name: "CD — Staging vitalia (manual)"

# Deploy a staging MANUAL (post 2026-05-19 policy change ratificada Chris).
# Detecta si vitalia tiene cambios (dorny/paths-filter) y dispara el workflow
# reutilizable _deploy-brand.yml solo si aplica.
#
# Repo standalone single-brand (2026-07-31): solo vitalia.
#
# Trigger: workflow_dispatch (manual desde GH Actions UI o gh CLI). NO auto-trigger.
# Cambio policy 2026-05-19: push a main YA NO dispara staging auto-deploy.
# Solo release/* dispara prod (cd-prod.yml). Staging deploys son manuales
# explícitos cuando se necesitan validar cambios.
#
# Ref: ADR-004 § CI/CD (post 2026-05-19 update) — staging manual not auto.
# Cómo invocar:
#   gh workflow run "CD — Staging vitalia (manual)" --ref main
#   o desde GitHub UI: Actions → workflow → Run workflow

on:
  workflow_dispatch:
    inputs:
      force_all_brands:
        description: 'Deploy sin detección de paths (true) o solo si vitalia/core cambiaron (false)'
        required: false
        default: 'false'
        type: choice
        options:
          - 'false'
          - 'true'

# Permisos minimos globales
permissions:
  contents: read

jobs:
  detect-brand-changes:
    name: "Detectar cambios en vitalia"
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      vitalia: ${{ steps.filter.outputs.vitalia }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            vitalia:
              - 'vitalia/**'
              - 'core/**'

  deploy-vitalia-staging:
    name: "Staging vitalia"
    needs: detect-brand-changes
    if: needs.detect-brand-changes.outputs.vitalia == 'true' || github.event.inputs.force_all_brands == 'true'
    uses: ./.github/workflows/_deploy-brand.yml
    with:
      brand: vitalia
      version: ${{ github.sha }}
      environment: vitalia-staging
    secrets: inherit
