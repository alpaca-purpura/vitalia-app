name: CI

# Quota-aware triggers (post 2026-05-19 mitigations):
# - push:main + pull_request:main both fire to gate code changes
# - paths-ignore: docs-only / process-only changes skip CI entirely
#   (no value running full suite when only docs/, .claude/, *.md changed)
# - concurrency: cancel in-progress runs when newer commit lands
#   (avoid duplicate billing on rapid push sequences + PR rebases)
#
# Ref: docs/process/learnings.md § 2026-05-19 — GH Actions quota incident

on:
  pull_request:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - '.gitignore'
      - 'LICENSE'
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.claude/**'
      - '.github/ISSUE_TEMPLATE/**'
      - '.github/PULL_REQUEST_TEMPLATE/**'
      - '.gitignore'
      - 'LICENSE'

# Cancel in-progress runs when newer commit lands on same ref
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Minimum permissions — least-privilege (supply chain safety)
permissions:
  contents: read

jobs:
  python-lint:
    name: python-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install Python workspace dependencies
        run: uv sync --all-packages
      - name: Ruff lint — all workspace packages
        run: uv run ruff check core/ vitalia/ --no-cache

  python-test:
    name: python-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install Python workspace dependencies
        run: uv sync --all-packages
      - name: Run full test suite (including arch-fitness)
        run: uv run pytest -x -q --tb=short

  arch-fitness:
    name: arch-fitness
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: "3.12"
      - name: Install Python workspace dependencies
        run: uv sync --all-packages
      - name: Arch fitness — vitalia backend
        working-directory: vitalia/backend
        run: uv run pytest tests/architecture/ -v --tb=short --override-ini="addopts="
      - name: Arch fitness — core packages
        run: |
          # arch-fitness tests enforce DDD boundaries, API contracts, naming conventions.
          # Run per-package so failures are clearly attributed.
          for d in core/luana-core-*/tests/architecture; do
            [ -d "$d" ] || continue
            pkg="${d%/tests/architecture}"
            echo "── arch fitness: $pkg"
            (cd "$pkg" && uv run pytest tests/architecture/ -v --tb=short --override-ini="addopts=")
          done

  ts-lint:
    name: ts-lint
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Install Node.js workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: ESLint — all frontend workspaces (vitalia/frontend + core/@luana/*)
        run: pnpm lint

  ts-test:
    name: ts-test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"
      - name: Install Node.js workspace dependencies
        run: pnpm install --frozen-lockfile
      - name: Vitest — all frontend workspaces (vitalia/frontend + core/@luana/*, with coverage)
        run: pnpm test
