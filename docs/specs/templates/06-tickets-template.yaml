# 06-tickets.yaml — Template (pila tickets ordenada del story, paradigm v4 post pm-redesign 2026-05)
# Vive en: {brand}/docs/product/stories/{story-id}/06-tickets.yaml
# Owner: /architect
#
# v4.1 cement 2026-05-19 — adicionalmente cada ticket cita `must_load_skills` resueltas
# (subset de 05-guidelines.md § must_load_skills aplicable al surface del ticket).
# Builder MUST entregar T-{n}-result.md § "Skills consulted" listando cada must_load_skill
# + status (loaded | n/a) + when consulted. Auditor flag CHANGES_REQUESTED si missing.
#
# ── Convenciones (origen R6+R8 process-improvement 2026-05-05 + v4.1 2026-05-19) ──
#
# 1. decisions_applicable: list of decision IDs (D1, D2, A5, X2, etc.)
#    ratificadas en 01-spec.md "Decisions" block o 03-arch-*.md
#    "Architectural decisions" block. Cada ticket DEBE listar las
#    decisions que le aplican. Builder commit body MUST include sección
#    "Decisions honored" que cite cómo cada una fue respetada.
#
#    Ejemplo:
#      decisions_applicable: [D1, D3, X2]
#      # Donde D1 = "use SQLA 2.0 async" (de 03-arch-be.md)
#      #       D3 = "tenant_id en cada query" (de 01-spec.md)
#      #       X2 = "schema-mirror exception copilot" (de 03-arch-be.md)
#
#    Auditor verifica commit body cita cada D# del decisions_applicable
#    list. Sin cita = REVIEW.md WARN Cat 11 (Cross-cutting).
#
# 2. Sub-ticket numbering convention strict (R8):
#    - Use T-{N}.a, T-{N}.b, T-{N}.c — NEVER T-Na, T-Nb (sin punto)
#    - Renumeración prohibida post-architect: una vez asignado T-6.a,
#      no se renombra a T-7 aunque T-6 base sea cancelado
#    - Sub-tickets only when architect detects internal sequencing
#      (e.g., T-6.a = NULL columns, T-6.b = verify gate, T-6.c = DROP).
#      Independent work = new top-level T-N.
#    - Origen: PI-12 S1 Story A T-1..T-9 nominal pero arch produjo 11
#      con T-6a/b/c sin punto → confusión planeación.
#
# 3. Single git mv commit BEFORE scope expansion (R9):
#    - Cuando ticket implica rename file/folder + scope expansion
#      (e.g., add fields), architect/dev MUST split en 2 commits:
#        commit 1: `git mv` puro (rename only, zero diff content)
#        commit 2: scope expansion (modify content)
#    - Cleaner history. Bisect-friendly. Rename detección git automática.
#
# 4. repro_verified field for hot-fix tickets (R26 2026-05-05):
#    SSoT: .claude/rules/hotfix-repro-mandatory.md
#
#    Hot-fix tickets (origin: handoff doc, incident, auditor escalation,
#    bis sub-numbering) MUST include `repro_verified: bool` + `repro_evidence`:
#
#      repro_verified: true
#      repro_evidence:
#        command: "cd backend && .venv/bin/pytest tests/X/test_y.py -v"
#        output: |
#          AssertionError: '>' not supported between NoneType and int
#          at line 153 of test_y.py
#        diagnosis_validates_handoff: false                # if mismatch
#        diagnosis_correction: "Real cause is X not Y as handoff suggested"
#
#    /dev-team Step 0.5 refuses spawn builder if hot-fix ticket missing
#    `repro_verified: true`. /po Step 2.5 refuses redactar spec without
#    running repro first. Auditor REVIEW Cat 11 verifies cite presence.
#
#    Origen: T-1.bis 2026-05-05. Handoff doc misdiagnosed root cause; sin
#    repro local, el builder agéntico (flagship) habría implementado wrong scope (~$8 waste).
#
# 5. production_code flag + dynamic owner_eligibility (R23, 2026-05-05):
#    Cada ticket declara `production_code: bool` (default: derivado de surface).
#    - true  = touches src/ (production runtime code, migrations, schema)
#    - false = touches tests/, docs/, scripts/ tooling, configs no-runtime
#
#    /dev-team Step 1 owner-decision logic:
#    - production_code: true  + surface AGENTIC → flagship_required: true HARD
#    - production_code: true  + BE/FE non-agentic → owner pool [qwen, workhorse, flagship]
#    - production_code: false + ANY surface → owner pool [qwen, workhorse] (el flagship
#      override-able pero NO required, even si surface AGENTIC)
#
#    Origen: T-1.bis 2026-05-05 forzó Opus 4.8 para test-only fix porque ticket
#    heredó `flagship_required: true` de Story A surface=AGENTIC. Token waste
#    ~$8 USD para test bridge migration que sonnet/qwen capable.
#
#    Default mapping:
#    - type: backend|agentic|frontend → production_code: true
#    - type: tests|docs|tooling|migration-only-no-data → production_code: false
#    Architect MAY override default explicitly cuando ticket es híbrido.
#
# 6. gherkin_coverage MANDATORY post-cement-date 2026-05-18 (story-closure-gate):
#    SSoT: .claude/rules/story-closure-gate.md (Phase D /auditor)
#
#    Cada ticket DEBE mapear scenarios Gherkin de 01-spec.md → tests específicos
#    que cubren ese scenario. /auditor Phase D ejecuta los tests citados y
#    escribe 06-audit/gherkin-matrix.md (scenario → test path → status PASS/FAIL/NO_COVERAGE).
#
#    Schema:
#      gherkin_coverage:
#        - scenario: "SC-01 Wizard finaliza con tenant_id válido"
#          tests:
#            - "{brand}/backend/tests/modules/{brand}/onboarding/test_wizard_complete.py::test_creates_tenant"
#        - scenario: "SC-02 Wizard rechaza email duplicado"
#          tests:
#            - "{brand}/backend/tests/modules/{brand}/onboarding/test_wizard_complete.py::test_duplicate_email_rejected"
#            - "{brand}/frontend/e2e/wizard/{story-id}.spec.ts::scenario-02"
#
#    Si ticket no toca surface UI o NO tiene scenarios Gherkin asignados, declarar
#    explícitamente:
#      gherkin_coverage: []          # ticket es infra puro, scenarios cubiertos en otros tickets
#    o
#      gherkin_coverage_note: "Scenarios SC-01..SC-04 cubiertos por T-3 (FE). Este ticket aporta BE service layer únicamente."
#
#    Auditor Phase D agrega gherkin_coverage cross-ticket → matrix completa.
#    Cualquier scenario en 01-spec.md SIN mapping en algún ticket → CHANGES_REQUESTED
#    (post-cement-date 2026-05-18 forward-only).
#
#    Origen: caso vitalia 2026-05-18 (story-closure-gate). Stories sin gherkin_coverage
#    transitioned a reviewing antes de cement-date quedan exentas; post-cement-date
#    es FAIL obligatorio.
#
# 7. must_load_skills enforceable v4.1 (cement 2026-05-19):
#    SSoT: 05-guidelines.md § must_load_skills + .claude/rules/auditor-self-fix-policy.md
#
#    Cada ticket DECLARA un subset RESUELTO de must_load_skills aplicable al ticket
#    (no las "when:" generales del 05-guidelines.md, sino la lista final ya resuelta
#    según surface + module del ticket).
#
#    Schema:
#      must_load_skills:
#        - backend-expert
#        - playwright-expert
#        - .claude/rules/tenant-isolation.md
#        - .claude/rules/spanish-text.md
#        - .claude/rules/auditor-self-fix-policy.md
#        - FastAPI canonical patterns
#        - pytest async testing patterns
#
#    /dev-team Step 2 cita esta lista verbatim en builder spawn prompt.
#    Builder T-{n}-result.md DEBE incluir sección "Skills consulted (must_load enforcement v4.1)"
#    con tabla skill/rule + status + when consulted. Auditor verifica.
#
#    Origen: conversación 2026-05-19 ratificada Chris (autonomy v4.1).
#
# 8. assignment block MANDATORY (R: .claude/rules/architect-autonomous-mode.md Step 7.5):
#    Cada ticket DECLARA un bloque `assignment` con el dispatch explícito que /dev-team respeta:
#      assignment:
#        primary_agent: builder-backend            # builder-backend | builder-frontend | builder-agentic (NUNCA general-purpose)
#        model_preference: workhorse                  # workhorse | flagship | qwen-opencode (tiers → project.config.yaml::models) · AGENTIC production_code → flagship HARD (R23)
#        forbidden_to_touch: [...]                 # paths explícitos que el builder NO toca
#        rationale: "why this agent + this model"
#    NO duplicar `must_load_skills` ni `inputs` dentro de assignment — esos son los campos
#    ticket-level de arriba (assignment los referencia, no los copia → evita drift).
#    /architect además produce dispatch-plan.md (ver docs/specs/templates/dispatch-plan-template.md).

