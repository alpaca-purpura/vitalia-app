# 04-validators.yaml — platform-lift-sales-agent-graph-runtime (Phase 1: ESC-4/5/6)
# technical-story · verification_nature: técnica. Gates redesigned tras la verificación empírica del architect
# (ver 03-arch § Realidad del entorno de tests): la suite completa vía PYTHONPATH-override en este worktree es
# FLAKY (configure_mappers global + conftest sintético + sqlite gaps). El gate AUTORITATIVO in-worktree = los
# arch tests por ESC (deterministas; el de ESC-4 corre en SUBPROCESO). La suite completa + downstream ×4 = entorno
# canónico (ci-parity + Postgres), realísticamente POST-MERGE.
#
# PP_CORE = "PYTHONPATH=${WS}/core/luana-core-sales-agent/src:${WS}/core/luana-core-platform/src"
# PP_ESC4 = PP_CORE + ":${WS}/core/luana-core-scheduling/src:${WS}/core/luana-core-iam/src:${WS}/core/luana-core-offer-studio/src"
#   (ESC-4 importa los targets de relationship de LeadModel; en entorno canónico/uv-editable NO hace falta el override)

verification:
  nature: técnica
  demo_required: false
  demo_skip_reason: "engine-hardening user_visible:false; bar = grafo corriendo live en vitalia (Chris, post merge+sync)"
  runtime_effect_bar: "grafo sales_agent end-to-end en vitalia: mensaje Telegram → reply de Adrián + fila conversación/trace/costo en DB + cero traceback. Post merge a main + sync vitalia."
  architect_spike_proof: "ESC-4/5/6 probados RED→GREEN + no-regression en aislamiento (03-arch § Spike verification). Diffs exactos = 03-arch § TL;DR. Tests = verified-arch-tests.md."
  technical_gates:
    baseline: [ruff_check, ruff_format]
    opt_in: []
    mutation: {enabled: false, mode: advisory, reason: "wiring/persistencia binaria; arch test RED-first ya prueba el efecto"}

validators:
  # ───── NON-FUNCTIONAL (lint/format de los 3 archivos editados) ─────
  - id: ruff_check
    category: non_functional
    type: shell
    cmd: "${WS}/.venv/bin/ruff check core/luana-core-sales-agent/src core/luana-core-platform/src/luana_core_platform/infrastructure/models/crm.py --no-cache"
    must_pass: true
    timeout_sec: 30
  - id: ruff_format
    category: non_functional
    type: shell
    cmd: "${WS}/.venv/bin/ruff format --check core/luana-core-sales-agent/src core/luana-core-platform/src/luana_core_platform/infrastructure/models/crm.py"
    must_pass: true
    timeout_sec: 30

  # ───── ARCH TESTS POR ESC (★ gate AUTORITATIVO in-worktree · deterministas · RED-first) ─────
  # Código exacto proven por el architect en verified-arch-tests.md (copy-paste).
  - id: esc4_relationship_module_qualified
    category: architectural_validation
    type: pytest
    cmd: "PYTHONPATH=${WS}/core/luana-core-sales-agent/src:${WS}/core/luana-core-platform/src:${WS}/core/luana-core-scheduling/src:${WS}/core/luana-core-iam/src:${WS}/core/luana-core-offer-studio/src ${WS}/.venv/bin/pytest core/luana-core-sales-agent/tests/architecture/test_esc4_relationship_module_qualified.py -v -p no:cacheprovider --override-ini='addopts='"
    must_pass: true
    timeout_sec: 90
    red_first: true
    architect_verified: "RED=InvalidRequestError 'Multiple classes found for path MessageModel' (returncode 1) ✓; GREEN=CONFIGURE_OK (returncode 0) ✓. Subproceso = import-state determinístico (evita el conftest sintético)."
    description: "configure_mappers() resuelve con un MessageModel homónimo de marca sobre el Base compartido (corre en subproceso)."
  - id: esc5_templates_cwd_independent
    category: architectural_validation
    type: pytest
    cmd: "PYTHONPATH=${WS}/core/luana-core-sales-agent/src:${WS}/core/luana-core-platform/src ${WS}/.venv/bin/pytest core/luana-core-sales-agent/tests/architecture/test_esc5_templates_cwd_independent.py -v -p no:cacheprovider --override-ini='addopts='"
    must_pass: true
    timeout_sec: 60
    red_first: true
    architect_verified: "RED=TemplateNotFound desde cwd=/tmp ✓; GREEN=get_template OK + templates_dir resuelto al paquete ✓."
    description: "PromptLoader() resuelve templates del paquete desde cualquier cwd + honra override explícito."
  - id: esc6_prompt_version_tenant_id
    category: architectural_validation
    type: pytest
    cmd: "PYTHONPATH=${WS}/core/luana-core-sales-agent/src:${WS}/core/luana-core-platform/src ${WS}/.venv/bin/pytest core/luana-core-sales-agent/tests/architecture/test_esc6_prompt_version_tenant_id.py -v -p no:cacheprovider --override-ini='addopts='"
    must_pass: true
    timeout_sec: 60
    red_first: true
    architect_verified: "RED=AttributeError 'no attribute tenant_id' ✓; GREEN=columna presente + ambas ramas del query construyen ✓."
    description: "PromptVersion.tenant_id presente + queries specific-override/system-default construyen."

  # ───── SUITES ENGINE (advisory in-worktree · must_pass en entorno CANÓNICO) ─────
  # ★ En este worktree (PYTHONPATH-hack) la suite completa es FLAKY (ver 03-arch § Realidad del entorno):
  #   ruido de configure_mappers global + conftest sintético AppointmentModel + 1 test stale de colección + sqlite gaps.
  #   El architect PROBÓ no-regresión en aislamiento determinístico (subset payment/scheduling: baseline==edited).
  #   Gate real de regresión = entorno canónico (uv editable + Postgres) vía ci-parity, POST-MERGE.
  - id: suite_collects
    category: architectural_validation
    type: shell
    cmd: "cd core/luana-core-sales-agent && ${WS}/.venv/bin/pytest --collect-only -q > /dev/null"
    must_pass: true                  # T-DEBT1 lo vuelve verde (colección sin ModuleNotFoundError)
    timeout_sec: 120
    description: "La suite sales-agent COLECTA sin error (T-DEBT1 fix del import stale). RED hoy: ModuleNotFoundError tests.modules."

  - id: sales_agent_suite_canonical
    category: architectural_validation
    type: pytest
    cmd: "cd core/luana-core-sales-agent && ${WS}/.venv/bin/pytest -q"
    must_pass: false                 # advisory in-worktree (flaky por estado global) · HARD en canónico post-merge
    canonical_must_pass: true
    timeout_sec: 600
    description: "Suite sales-agent (post T-DEBT1 colecta limpio). In-worktree = advisory (ruido configure_mappers global + conftest stub Story-8). Autoritativo en uv-editable + Postgres (ci-parity)."
  - id: platform_suite_canonical
    category: architectural_validation
    type: pytest
    cmd: "cd core/luana-core-platform && ${WS}/.venv/bin/pytest -q -p no:cacheprovider"
    must_pass: false                 # advisory in-worktree
    canonical_must_pass: true
    timeout_sec: 600
    architect_verified: "in-worktree (PYTHONPATH override): exit=0 (passed) con el fix ESC-4 ✓."
    description: "Suite platform (ESC-4 crm.py). Architect la corrió verde in-worktree."

  # ───── DOWNSTREAM REGRESSION ×4 (canónico · post-merge · ci-parity) ─────
  - id: downstream_ci_parity
    category: architectural_validation
    type: shell
    cmd: "echo 'POST-MERGE: make ci-parity (engine + vitalia + nicolify + comunify + lupulo con uv-editable + Postgres). In-worktree NO confiable vía PYTHONPATH-hack — el arch test ESC-4 (con homónimo) cubre el caso live.'"
    must_pass: true                  # el echo pasa; el gate real es ci-parity post-merge (documentado, no silencioso)
    canonical_gate: "make ci-parity"
    timeout_sec: 5
    description: "Downstream ×4 corre en canónico post-merge (engine compartido). lupulo=placeholder skip."

scenario_coverage:
  - {scenario_id: "ESC-4 relationship ambiguity", validators: [esc4_relationship_module_qualified, platform_suite_canonical]}
  - {scenario_id: "ESC-5 templates cwd-independent", validators: [esc5_templates_cwd_independent]}
  - {scenario_id: "ESC-6 prompt_versions.tenant_id", validators: [esc6_prompt_version_tenant_id]}
  - {scenario_id: "T-DEBT1 suite collects", validators: [suite_collects]}
  - {scenario_id: "no-regression downstream", validators: [suite_collects, sales_agent_suite_canonical, platform_suite_canonical, downstream_ci_parity]}

brand_authored_migration:
  owner: "cada brand consumer en SU worktree (wip/{brand}) al adoptar"
  ddl_source: migration_notes.md
  idempotent: true
  note: "prompt_versions no existe en alembic de ninguna marca → CREATE TABLE IF NOT EXISTS + ADD COLUMN IF NOT EXISTS tenant_id + índice. Backfill no-op."
  verification_deferred_to: "downstream ci-parity + efecto runtime vitalia post-merge"

# Tech-debt (NO bloquea). [stale test → in-scope como T-DEBT1, ratificado Chris 2026-06-22]
out_of_scope_findings:
  - "conftest.py sales-agent registra AppointmentModel sintético = stub DELIBERADO Story-8-pending → no tocar; se resuelve con el lift de scheduling."
  - "copilot PromptLoader (core/luana-core-platform/.../prompts/base.py:23 default monolítico + cwd, singleton L195) = mismo bug-class ESC-5 → /harness-issue (futuro copilot)."
  - "LeadModel.appointments (crm.py:214) = misma ambigüedad latente que ESC-4; seguro en prod hoy (vitalia sin homónimo AppointmentModel); abordar en Story 8 lift."

iteration:
  max_iterations: 8
  on_fail: "aplicar el diff exacto del ESC (03-arch § TL;DR), re-correr SOLO el arch test del ESC (PYTHONPATH override)"
  on_all_pass: "state developing→developed; impl-log por ESC citando arch_verified; NO auto-handoff (autonomous_mode:false)"
  on_cap_reached: "state developing→blocked; escalate Chris con el trace"
