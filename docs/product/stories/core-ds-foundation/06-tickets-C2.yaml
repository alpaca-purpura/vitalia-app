      no-div-layout/no-native-select replication cross-brand · comunify-eslint no-arbitrary (pre-req de Fase C, separate).
  C4: wiring del catálogo en skills/po-ux/architect · brand-skills→routers que leen el catálogo.
  C5: adopción (mirrors shadcn vitalia · 4 dead-stubs · 7 shell cross-brand · UniversalIntake lift) — per marca, /pm-{brand}.
  C6: verificación e2e end-to-end (necesidad→mockup→arch→dev→diff demuestra mockup===resultado).
