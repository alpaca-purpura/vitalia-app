name: new-session
description: Crear nuevo worktree Luana — origin/main fresco + symlink venv + manifest .session.yaml.
command: bash scripts/git/new-session.sh {{brand}} {{type}} {{slug}} {{lane}}
arguments:
  - name: brand
    description: vitalia | nicolify | comunify | lupulo | core
    default_value: vitalia
  - name: type
    description: canonical | story | hotfix | exp | lift (lift solo con brand=core)
    default_value: story
  - name: slug
    description: story-id o slug-corto. Solo [a-z0-9-]
    default_value: ""
  - name: lane
    description: opcional, solo con type=story — be|fe|tests|docs
    default_value: ""
tags:
  - luana
  - git
  - worktree
shells:
  - bash
  - zsh
