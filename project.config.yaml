# ════════════════════════════════════════════════════════════════════════
#  project.config.yaml — THE SEAM (DIP contract for the harness CORE)
# ════════════════════════════════════════════════════════════════════════
#
#  STATUS: ★ RATIFIED by Chris 2026-06-09 (W5a) — F1 = CENTRALIZED (per-brand facets nest
#          here under brands[], = PROCESS-MODEL §4 shape) · F2/F3 defaults stand (root yaml,
#          full roster/value_stream in the seam). ★ LIVE root file since W5b (2026-06-09):
#          moved here from docs/process/harness-refactor-w5/project.config.PROPOSED.yaml;
#          loader scripts/harness_config.py reads it; consumers (bash/python/cockpit) wired.
#
#  WHAT THIS IS: the single store of every PROJECT/BRAND/TECH-specific value the
#  harness is written against. This file fills the slots for THIS product
#  (vitalia-app). Post 2026-07-31 el harness está MATERIALIZADO en el repo
#  (.claude/ archivos reales, sin plugin ni kit externo); este seam sigue siendo
#  el SSoT de valores para scripts/hooks/cockpit (harness_config.py).
#
#  HOW IT IS READ (verified date-aware against official Claude Code docs 2026-06-09):
#    · bash / git-hooks  → `${WS}/.venv/bin/python -m harness_config <dotted.slot>`
#    · python scripts    → `from harness_config import load` (same module, one parser)
#    · cockpit TS        → server-only `lib/project-config.ts` (js-yaml, typed)
#    · markdown (rules/skills/agents/templates, loaded as CONTEXT) → CONVENTION:
#        the file writes `{slot}` + "(resolved from project.config.yaml)" and the
#        MODEL Reads this yaml on demand. There is NO native interpolation for bare
#        rules/CLAUDE.md/agents (confirmed: code.claude.com/docs/en/{memory,skills}).
#        Optional skill-ONLY native upgrade: `` !`python -m harness_config <slot>` ``
#        (never a hard dependency — `disableSkillShellExecution` can kill it).
#
#  Sentinel for an unfilled slot: __FILL_ME__   (`python -m harness_config --doctor` los lista)
# ════════════════════════════════════════════════════════════════════════

meta:
  product: vitalia-app
  config_version: 1
  description: "Vitalia — SaaS multitenant Salud + Bienestar (standalone, extraído de luana-platform 2026-07-30; engine core/ vendored)"

# ── SLOT 1 ──────────────────────────────────────────────────────────────
#  brands[]  ·  replaces: `for B in nicolify vitalia comunify lupulo` hardcoded loops,
#               UNIVERSES, BRAND_SLUGS, cockpit/dev-app port maps, the 10-brand loops.
#  Per-brand facets (ports/dev_app/compliance/roster/value_stream) nest under each
#  brand. live_verify_infra / agent_roster / value_stream CROSS-REFERENCE these
#  (DRY — a port/dev-app lives here ONCE).
#  ⚠ design fork flagged in W5-OUTPUT §F1: centralize here (this draft, = PROCESS-MODEL §4
#    ratified shape) vs delegate per-brand facets to {brand}/config/brand.yaml (BRAND layer).
brands:
  cockpit_main_port: 4000          # legacy multi-cockpit (chris-corp); este repo usa brands.active[].ports.cockpit (4002)
  # canonical order for brand loops (single-brand)
  loop_order: [vitalia]

  # ── per-brand facets (F1 centralized): cap_gate = is the bidirectional cap-gate HARD
  #    (blocks push/commit) or advisory for this brand? Consumed by pre-push + the pre-commit
  #    05e-cap-gates check (derive the HARD set via `harness_config.py brands.active slug
  #    --where cap_gate=hard`). Adding a brand's policy = config here, never editing the gate.
  active:                          # have docs/, ports, dev-app, a build surface
    - slug: vitalia
      vertical: "Salud + Bienestar"
      status: shipped
      ports: { backend: 8002, frontend: 3002, cockpit: 4002 }
      dev_app_url: dev-app.vitalialat.com
      compliance: hipaa-lite       # brand-tier facet (PHI handling)
      cap_gate: hard

  pending_bootstrap: []            # repo standalone single-brand — sin marcas pendientes

# ── SLOT 2 ──────────────────────────────────────────────────────────────
#  toolchain  ·  replaces: ruff/pytest/mypy/tsc/eslint/vitest/alembic/`.venv/bin` literals.
#  ${WS} = $(git rev-parse --show-toplevel). Native-First HARD: NEVER lint/test/typecheck
#  inside Docker (host only); Docker only for runtime/migrations/ci-parity.
toolchain:
  python_version: "3.12"
  package_manager_py: uv                 # [tool.uv.workspace], 27 members editable
  package_manager_fe: "pnpm@9.15.9"      # node 20 LTS via nvm
  venv_path: "${WS}/.venv"               # venv AT WORKSPACE ROOT
  postgres_port: 5435                    # shared dev postgres
  # Cockpit = VENDORED en tools/cockpit/ (fork consciente ratificado por Chris 2026-07-30,
  # snapshot de prenter-harness products/devhub). Se buildea local: make cockpit-build.
  # El pin de versión externa quedó obsoleto — se conserva como referencia del snapshot origen.
  cockpit_min_version: "0.4.0"           # tag prenter del snapshot vendored (histórico)
  backend:
    cwd: "{brand}/backend"
    lint:      "${WS}/.venv/bin/ruff check ."          # line-length 120, py312
    format:    "${WS}/.venv/bin/ruff format --check"   # double quotes, spaces
    typecheck: "${WS}/.venv/bin/mypy --strict"         # DoD technical gate
    test:      "${WS}/.venv/bin/pytest --cov=src"      # arch-first; fail_under=43%
    arch_test: "${WS}/.venv/bin/pytest tests/architecture/ -v"
    migrate:   "docker exec luana-dev-{brand}_backend_dev-1 bash -c \"cd /workspace/{brand}/backend && /workspace/.venv/bin/alembic upgrade head\""
    audit:     "${WS}/.venv/bin/pip-audit"
  frontend:
    cwd: "{brand}/frontend"
    typecheck: "npx tsc --noEmit"                      # strict
    lint:      "npx eslint src/ --cache"               # 0 errors
    test:      "npx vitest run --coverage"             # 20% threshold per-brand
    e2e_smoke: "E2E_BASE_URL=http://localhost:{fe_port} npx playwright test --project=smoke"
  ci_gate: "make ci-parity"                            # mandatory pre-push-to-main
  etl_contract_regen: "make extraction-contract"

# ── SLOT 3 ──────────────────────────────────────────────────────────────
#  locale  ·  replaces: the voseo / Spanish-neutro gate as a hard step.
locale:
  identifier: "es-LATAM-neutro"
  rule: tuteo                              # PROHIBIDO voseo (vos/sos/tenés/podés/mirá/dejá)
  excludes_dialects: [MX, CO, PE, CL, EC]
  scope: ["frontend UI", "agentic output"] # acotado 2026-06-01: SOLO user-facing
  scope_excludes: [".claude/", "docs/", "*.md", "scripts/", "tools/", "tests", "comments", "variables"]
  enforcement: "scripts/git-hooks/pre-commit §1 (escanea solo .py/.ts/.tsx producto)"
  agentic_validation: "core/ arch tests (test_*_voseo_compliance.py, test_system_prompt_neutro_latam.py)"
  magic_comment_escape: "# voseo-allowed"  # variant: <!-- voseo-allowed -->
  exception: "sales_agent output respeta voz tenant (puede ser voseo si tenant AR)"
  glossary_full: "docs/rules-detail/spanish-glossary.md"

# ── SLOT 4 ──────────────────────────────────────────────────────────────
#  engine_prefix  ·  replaces: `core/luana-core-*` path literals in process logic.
engine_prefix:
  python_glob: "core/luana-core-*"         # internal: core/luana-core-*/src/luana_core_*/
  python_module_prefix: "luana_core_"
  ts_scope: "@luana/*"                      # core/@luana/<pkg> consumed via import @luana/...
  python_package_count: 27
  lift_gate: "flujo engine /pm-vitalia — cambio directo en core/ gateado por arch tests (paquete + vitalia) + semver bump + CHANGELOG; breaking EP-1..18 → ADR + Chris ratifica"
  # full list maintained for anti-dup / doctor; ts packages under core/@luana/
  ts_packages: [api-client, design-tokens, eslint-config, extension-sdk, format, hooks, schemas, ui-kit]

# ── SLOT 5 ──────────────────────────────────────────────────────────────
#  live_verify_infra  ·  replaces: vitalia URLs/creds/ports in rule #37 normative body
#  + (facet observability_evidence) the docker-logs/Sentry/trace sources for repro/diagnosis.
#  NOTE (DRY): dev_app_url + ports live in brands[] (slot 1); this slot holds the verify
#  MACHINERY only (creds, clerk mechanism, obs sources, per-brand arming).
live_verify_infra:
  mechanism: "cloudflared tunnel (locally-managed) → stack local localhost:{port} · deploy deferred"
  localhost_fallback: "localhost:{fe_port}  (API proxy /api/* → backend :{be_port})"
  tunnel_setup_script: "scripts/cloudflared-setup.sh {brand}"   # non-interactive, idempotent
  test_creds:
    location: "{brand}/.env.dev"            # gitignored, per-worktree
    keys: [DEV_APP_TEST_EMAIL, DEV_APP_TEST_PASSWORD, DEV_APP_CHRIS_EMAIL, DEV_APP_CHRIS_PASSWORD,
           "CLERK_TESTING_TOKEN_{BRAND}", CLERK_SECRET_KEY, NEXT_PUBLIC_CLERK_PUBLISHABLE_KEY]
    tunnel_api_keys: "{brand}/deploy/cloudflared/.credentials/cf-api.env"   # gitignored cfat_ token
    nature: "DEV creds only (pk_test_); NUNCA pk_live_; NUNCA en archivo tracked"
  clerk_verify:                             # verify-real before declaring a cred set
    user_exists: "GET /v1/users?email_address={email} → existe + public_metadata(role/tenant)"
    password_check: "POST /v1/users/{user_id}/verify_password → verified:true"
    skill: clerk-backend-api
  observability_evidence:                   # facet — repro/diagnosis evidence sources (D4)
    sources: [docker-logs, sentry, copilot_trace_event, conversation-log]
    schema: "trace_evidence: {source: <one-of-sources>, ref: <id/url/snippet>}"
  per_brand:                                # arming status + test user (dev_app/ports from slot 1)
    vitalia:  { arming: full,         test_user: "dr.demo@vitalialat.com",        up_cmd: "make dev-app-vitalia" }

# ── SLOT 6 ──────────────────────────────────────────────────────────────
#  design_system_ref  ·  replaces: the design-system-canon.md binding.
design_system_ref:
  canon_ssot: "docs/architecture/luana-platform/design-system-canon.md"
  doctrine_adr: "docs/architecture/luana-platform/ADR-014-design-system-homologation.md"
  ui_kit_package: "@luana/ui-kit"           # único lego del builder-frontend
  design_tokens_package: "@luana/design-tokens"
  shadcn_atoms: "components/ui/"
  shared_molecules: "components/shared/"
  binding: "HARD end-to-end (po-ux compose · architect refs · dev build-from · auditor reject-non-composed)"
  shell_design_contract:                    # ⚠ PER-BRAND (not platform-level)
    vitalia: "vitalia/docs/architecture/SHELL-DESIGN-CONTRACT.md"

# ── SLOT 7 ──────────────────────────────────────────────────────────────
#  domain_modules[]  ·  replaces: offer/copilot/analytics/… as process assumptions
#  + the contract-guard.js RULES array. 3 categories (Brand→Core mapping).
domain_modules:
  conceptual: [brand, offer, landing, sales_agent, copilot, crm, scheduling, analytics,
               connections, assets, tenant_domains, commercial_calendar, campaigns, iam]
  core_full:               # identical cross-brand · core package · no brand-extension surface
    [iam, crm, assets, commercial_calendar, tenant_domains, tenant_profile, social_proof,
     idempotency, events, compliance, billing, channels, llm, observability, extension-sdk, extraction]
  engine_brand_extension:  # engine + brand-specific CODE
    - { module: copilot,     core_package: luana-core-copilot,     surface: "{brand}/backend/src/modules/{brand}/copilot/{extractors,tools,workflows,kb}/" }
    - { module: sales_agent, core_package: luana-core-sales-agent, surface: "{brand}/backend/src/modules/{brand}/sales_agent/{tools,personas,goldens}/" }
    - { module: scheduling,  core_package: luana-core-platform,    surface: "BookingPolicyDef per-brand" }   # luana-core-scheduling futuro
    - { module: connections, core_package: luana-core-connections, surface: "ChannelAdapterDef per-brand" }
  engine_brand_config:     # engine + brand-specific CONFIG (yaml/registry, no code)
    - { module: brand,     core_package: luana-core-brand-studio,     surface: "{brand}/config/brand.yaml" }
    - { module: offer,     core_package: luana-core-offer-studio,     surface: "preset packs via EP-2" }
    - { module: analytics, core_package: luana-core-analytics-engine, surface: "enabled_metrics + channel_groups per-brand" }
    - { module: campaigns, core_package: luana-core-campaigns,        surface: "CampaignTemplateDefs via EP-7" }
    - { module: landing,   core_package: luana-core-landing,          surface: "LandingTemplateDefs via EP-12" }
  contract_guard_watch:    # contract-guard.js SSoT-guard PostToolUse (Write|Edit|MultiEdit)
    - { name: etl-contract,    regen: "make extraction-contract" }
    - { name: metric-catalog,  regen: "pytest test_extraction_contract.py (catalog↔contract)" }
    - { name: offer-catalogs,  regen: "bump _CATALOG_VERSION + arch tests" }
    - { name: channel-registry, regen: "no duplicate STAGE_CHANNEL_MAP" }
    - { name: copilot-registry, regen: "ModuleDescriptor entry required" }

# ── SLOT 8 ──────────────────────────────────────────────────────────────
#  agent_roster  ·  replaces: cockpit agent-meta.ts rosters + MapView VITALIA_ROLES +
#  generate_capability_index VITALIA_AGENTS. {slug,name,emoji,color,role,subtitle}.
#  supervisor/orchestrator = sidebar (NOT a value-stream box).
agent_roster:
