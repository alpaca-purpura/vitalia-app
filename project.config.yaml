    - { slug: config, name: "Configurar", emoji: "⚙", color: "#64748b", subtitle: "tenant · iam · compliance" }
    - { slug: infra,  name: "Infra",      emoji: "🔧", color: "#06b6d4", subtitle: "observability · platform · scaffolding" }
  vitalia:
    - { slug: valeria, name: Valeria, emoji: "🗓", color: "#a855f7", role: supervisor,   subtitle: "Mi Día" }
    - { slug: lisa,    name: Lisa,    emoji: "🏥", color: "#10b981", role: especialista, subtitle: "Mi Clínica" }
    - { slug: lucas,   name: Lucas,   emoji: "📣", color: "#f59e0b", role: especialista, subtitle: "Marketing / Atraer" }
    - { slug: adrian,  name: Adrián,  emoji: "💼", color: "#3b82f6", role: especialista, subtitle: "Vender" }
    - { slug: mateo,   name: Mateo,   emoji: "📅", color: "#FEE209", role: especialista, subtitle: "Operar / Mi Día" }
    - { slug: camila,  name: Camila,  emoji: "🌟", color: "#ec4899", role: especialista, subtitle: "Reputación + cohortes" }

# ── SLOT 9 ──────────────────────────────────────────────────────────────
#  value_stream  ·  replaces: cockpit map-zones.ts VALUE_STREAM_STAGES.
#  Cadena canónica empleados-IA = Atraer→Vender→Operar→Retener; vitalia = clinical GTM instance.
value_stream:
  canonical_stages: [atraer, vender, operar, retener]   # empleados-IA chain
  vitalia:
    - { id: atraer,    name: Atraer,    order: 1, description: "Presencia pública + marketing que trae pacientes.", boxIds: [lisa, lucas] }
    - { id: vender,    name: Vender,    order: 2, description: "Captar, calificar y cerrar al paciente.",          boxIds: [adrian] }
    - { id: operar,    name: Operar,    order: 3, description: "Agenda, reservas prepagadas y día clínico.",        boxIds: [mateo] }
    - { id: fidelizar, name: Fidelizar, order: 4, description: "Post-tratamiento, NPS, reputación y cohortes.",     boxIds: [camila] }

# ── SLOT 10 (D1) ─────────────────────────────────────────────────────────
#  wip_caps  ·  replaces: the CAP NUMBERS duplicated VERBATIM in
#  validate_session_close.py:73 AND generate_backlog.py:84 (both comment "must match").
#  D1 (ratified): keep the Stop hook a COARSE per-brand session-close net; seam the NUMBERS
#  here so both scripts read ONE store. The CANONICAL module-scoped cap (developed≤1 per
#  code:{module}) is a DIFFERENT concern living in story-closure-gate.md + the pre-commit
#  story-closure gate — NOT seamed here (one-SSoT; do not duplicate the module rule).
wip_caps:
  coarse_session_net:        # the Stop hook + backlog gen (per-brand, gross over-accumulation)
    refining_max: 3
    refined_max: 5
    ready_max: 5
    developing_max: 3
    developed_max: 10        # coarse net (NOT the module-scoped ≤1 — that's story-closure-gate)
    reviewing_max: 2
  staleness_days:            # generate_backlog.py CAPS
    checkpoint_stale: 7
    idea_stale: 90
    refining_stale: 60
    refined_stale: 30
    done_rolling: 90
  active_states: [refining, refined, ready, developing, developed, reviewing]
  module_scoped_note: "developed/developing/reviewing ≤1 per code:{module} bucket — enforced by pre-commit story-closure gate (story-closure-gate.md WIP-cap v2), NOT this coarse net."

# ── SLOT 12 ─────────────────────────────────────────────────────────────
#  models  ·  SSoT de ruteo de modelos Claude del harness (pedido Chris 2026-06-12).
#  REEMPLAZA: nombres de modelo hardcodeados en frontmatter `model:` de
#  .claude/{agents,skills}.
#  CONVENCIÓN: la doctrina (rules/skills/templates) habla en TIERS
#  (flagship/coordinator/workhorse/mechanical) — NUNCA nombres de modelo.
#  El frontmatter `model:` es ARTEFACTO GENERADO: `make models-sync` lo parchea
#  desde acá; machinery CHECK 31 (`scripts/sync_model_tiers.py --check`) bloquea drift.
#  · Swap global (ej. opus→fable): editar 1 línea en tiers + `make models-sync`.
#  · Override puntual por superficie: el valor en agents/skills puede ser un tier
#    O un alias literal (fable|opus|sonnet|haiku) — "quiero que ESTE agente use X".
models:
  tiers:
    flagship: opus         # estratégico + agentic prod (R23) + refinamiento (2026-06-14: fable deshabilitado → opus 4.8)
    coordinator: opus      # PMs + orquestación git (commit-push/handoff)
    workhorse: sonnet      # builders BE/FE no-agentic
    mechanical: haiku      # gate-runner / context / grep workers
  agents:                  # .claude/agents/{name}.md
    architect-orchestrator: flagship
    auditor-agentic: flagship
    auditor-backend: flagship
    auditor-frontend: flagship
    builder-agentic: flagship
    builder-backend: workhorse
    builder-frontend: workhorse
    context-builder: mechanical
    context-validator: mechanical
    gate-runner: mechanical
  skills:                  # .claude/skills/{name}/SKILL.md
    architect: flagship
    auditor: flagship
    dev-team: flagship
    po: flagship
    po-ux: flagship
    ux-agentico: flagship
    pm: coordinator
    pm-vitalia: coordinator
    commit-push: coordinator
    handoff: coordinator
    harness-issue: mechanical
    hipaa-check: flagship
