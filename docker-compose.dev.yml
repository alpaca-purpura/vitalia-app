# docker-compose.dev.yml — RAÍZ — servicios shared ÚNICAMENTE
# Brand-specific services viven en {brand}/docker-compose.dev.yml
# Uso: docker compose -f docker-compose.dev.yml -f {brand}/docker-compose.dev.yml up -d
# O más fácil: make dev-{brand}
#
# S-DOCKER-DEV-MULTIBRAND T-1 — 2026-05-15
# Decisions: D1 (1 postgres + N databases), D3 (qdrant+redis opt-in profiles)

name: luana-dev

services:
  luana_postgres_dev:
    image: postgres:15-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: password
      POSTGRES_DB: postgres  # DB base (no usar para brands)
    volumes:
      - luana_postgres_dev_data:/var/lib/postgresql/data
      - ./scripts/postgres-init:/docker-entrypoint-initdb.d:ro  # init scripts idempotentes
    ports:
      - "127.0.0.1:5435:5432"
    networks:
      - luana_dev_net
    deploy:
      resources:
        limits:
          cpus: "0.75"
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10

  luana_qdrant_dev:
    image: qdrant/qdrant:v1.8.3
    profiles: [vector]  # opt-in: make dev-{brand}-vector o make dev-all-vector
    restart: unless-stopped
    volumes:
      - luana_qdrant_dev_data:/qdrant/storage
    ports:
      - "127.0.0.1:6333:6333"
      - "127.0.0.1:6334:6334"
    networks:
      - luana_dev_net
    deploy:
      resources:
        limits:
          memory: 512M

  luana_redis_dev:
    image: redis:7-alpine
    profiles: [cache]  # opt-in: make dev-{brand}-cache o make dev-all-cache
    restart: unless-stopped
    command: redis-server --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - luana_redis_dev_data:/data
    ports:
      - "127.0.0.1:6379:6379"
    networks:
      - luana_dev_net
    deploy:
      resources:
        limits:
          memory: 256M

volumes:
  luana_postgres_dev_data:
    name: luana_postgres_dev_data
  luana_qdrant_dev_data:
    name: luana_qdrant_dev_data
  luana_redis_dev_data:
    name: luana_redis_dev_data

networks:
  luana_dev_net:
    name: luana_dev_net
    driver: bridge
