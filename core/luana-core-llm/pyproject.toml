[project]
name = "luana-core-llm"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "structlog>=24.0",
    "litellm>=1.40",
    "langchain>=0.3",
    "langchain-core>=0.3",
    "langchain-openai>=0.2",
    "openai>=1.0",
    "luana-core-platform",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luana_core_llm"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-x -q --tb=short"
