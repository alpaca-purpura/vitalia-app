[project]
name = "luana-core-copilot"
version = "0.3.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "structlog>=24.0",
    "httpx>=0.27",
    "langgraph>=0.2",              # StateGraph + checkpointers
    "langchain-core>=0.3",
    "langchain-openai>=0.2",       # for OpenAI-protocol providers
    "langchain-text-splitters>=0.3", # contextual_chunker service
    "deepagents>=0.5.3",           # subagent harness
    "qdrant-client>=1.10",         # marketing_kb_store
    "arq>=0.26",                   # workers/telegram_worker
    "jinja2>=3.1",                 # prompts templates
    "tiktoken>=0.7",               # token counter
    "trafilatura>=1.12",           # web crawl
    "litellm>=1.40",
    "luana-core-platform",
    "luana-core-iam",
    "luana-core-observability",
    "luana-core-llm",
    "luana-core-channels",
    "luana-core-events",
    "luana-core-idempotency",
    "luana-core-billing",
    "luana-core-extraction",
    "luana-core-brand-studio",
    "luana-core-offer-studio",
    "luana-core-assets",
    "luana-core-crm",
    "luana-core-analytics-engine",
    "luana-core-landing",
    "luana-core-connections",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luana_core_copilot"]

[tool.pytest.ini_options]
pythonpath = [".", "tests"]
asyncio_mode = "auto"

# Story 6 T-21 — ruff per-file-ignores for lifted AISALESHT artifacts.
# Tests inherit a permissive AISALESHT pattern: forward-reference imports
# placed mid-file for cycle-avoidance, ambiguous variable names `l` in
# comprehensions over labels lists, long lines in mock fixtures, etc.
# These tolerances match AISALESHT's `[tool.ruff.lint.per-file-ignores]`
# pattern.  When the workspace-level ruff config (luana-platform/pyproject.toml)
# is upgraded to include more rules, this block lifts those overrides
# back to workspace level.
[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "E402",    # module-level imports after env setup or markers
    "E501",    # long mock patch targets / fixture strings
    "E741",    # `l` in comprehensions over `labels` lists is idiomatic
]
# Forward-reference imports for cycle avoidance — kept verbatim from AISALESHT
"src/luana_core_copilot/application/orchestrator/chat.py" = ["E402"]
"src/luana_core_copilot/application/orchestrator/output_sanitizer.py" = ["E402"]
"src/luana_core_copilot/application/tools/extraction_tools.py" = ["E402"]
"src/luana_core_copilot/domain/ports.py" = ["E402"]
