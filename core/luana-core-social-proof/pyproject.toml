[project]
name = "luana-core-social-proof"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "fastapi>=0.115",
    "structlog>=24.0",
    "luana-core-platform",
    "luana-core-iam",
    "luana-core-copilot",          # Story 6 T-16 — copilot_provider/ unlift requires copilot ports
]

[project.entry-points."nicolify.copilot_providers"]
social_proof = "luana_core_social_proof.copilot_provider:provider"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luana_core_social_proof"]
