[project]
name = "luana-core-flows"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "langgraph",
    "langgraph-checkpoint-postgres>=3.1.0,<4",
    "pydantic>=2.0",
    "structlog>=24.0",
    "luana-core-platform",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luana_core_flows"]

[tool.ruff]
line-length = 120
target-version = "py312"

[tool.pytest.ini_options]
markers = [
    "integration: requires real Postgres + libpq (dev stack); skipped natively when unavailable",
]
