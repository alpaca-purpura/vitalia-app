[project]
name = "luana-core-observability"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "sqlalchemy>=2.0",
    "structlog>=24.0",
    "httpx>=0.27",
    "litellm>=1.40",
    "luana-core-platform",
    "luana-core-channels",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luana_core_observability"]
