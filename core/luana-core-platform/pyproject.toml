[project]
name = "luana-core-platform"
version = "0.5.1"
requires-python = ">=3.12"
dependencies = [
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "sqlalchemy>=2.0",
    "redis>=5.0",
    "structlog>=24.0",
    "httpx>=0.27",
    "sentry-sdk>=2.0",
    "arq>=0.26",
    "cryptography>=42.0",
    "alembic>=1.13",
    "aiofiles>=23.0",
    "pillow>=10.0",
    "pypdf>=4.0",
    "python-docx>=1.1",
    "python-dotenv>=1.0",
    "playwright>=1.44",
    "beautifulsoup4>=4.12",
    "fastapi>=0.111",
    "psycopg2-binary>=2.9",
    "asyncpg>=0.29",
    # cyclic workspace dep
    "luana-core-llm",
    "passlib>=1.7.4",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/luana_core_platform"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
addopts = "-x -q --tb=short"
