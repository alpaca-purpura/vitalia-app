# medical_kb_psychiatry_v1 — KB pack manifest
# Story 11 T-kb-3 (R23 Opus 4.7) — Vitalia psychiatry vertical reference content.
#
# tenant_scope=brand → cross-tenant medical reference (NOT per-tenant PHI).
# Chunks are educational content + medication safety + drug-drug interactions
# + REQUIRED DISCLAIMER (forced top-1 on medication query).
# No patient PII is stored here. Per-tenant clinic-specific protocols (if added
# later) would carry tenant_id payload field and live in same collection.

pack_id: medical_kb_psychiatry_v1
qdrant_collection: vitalia_medical_kb_psychiatry_v1
embedding_model: text-embedding-3-large
embedding_dim: 1536          # text-embedding-3-large with `dimensions=1536` parameter
tenant_scope: brand          # cross-tenant share (D7 hipaa_lite OK — no PHI)
similarity_threshold: 0.72   # baseline RAG retrieval contract (03-arch § 7.5)
top_k: 5                     # baseline RAG retrieval contract (03-arch § 7.5)
schema_version: 1
compliance_level: hipaa_lite

# Chunk source files (alphabetical) — every .md scanned + chunked at H2 boundaries.
# 02-design § 9.3: ~120 chunks across medication classes + side effects + interactions.
chunk_sources:
  - 00_disclaimer.md                    # Special chunk disclaimer_psychiatric_prescription_only
  - 01_ssris_antidepressants.md         # SSRI class — sertralina/escitalopram/etc + side effects
  - 02_anxiolytics_benzodiazepines.md   # Benzo class — clonazepam/alprazolam/lorazepam/etc
  - 03_antipsychotics.md                # Antipsychotics — risperidona/olanzapina/quetiapina/etc
  - 04_mood_stabilizers.md              # Mood stabilizers — litio/lamotrigina/valproato
  - 05_drug_interactions.md             # Drug-drug interactions + analgesics co-use
  - 06_common_questions.md              # Common patient questions (no medication adjustments)
  - 07_safety_keywords_psychiatric.md   # Acute psychiatric crisis keywords (suicidal ideation etc)

# ─── Medication-query forced retrieval (core T-kb-3 contract) ────────────────
# When patient INPUT contains any of these keywords (case-insensitive contains
# match), `VitaliaMedicalKbStore._detect_medication_query` triggers forced
# retrieval of `disclaimer_psychiatric_prescription_only` chunk at top-1 —
# bypassing similarity threshold. Sales_agent prompt template MUST quote the
# disclaimer chunk verbatim in response (see 02-design § 9.3 + § 17.2 +
# guardrail medical_safety_no_prescription).
#
# Catalog construction principles:
#   1. Cover INN (international non-proprietary name) AND brand names — patients
#      often say "Rivotril" or "Zoloft" before saying "clonazepam" / "sertralina".
#   2. 200+ entries baseline per 02-design § 9.3 — driven by 6 psychiatric drug
#      classes (antidepressants/anxiolytics/antipsychotics/mood-stabilizers/
#      stimulants/sleep-aids) + brand-name multiplier (~3 brands per INN avg)
#      + analgesics commonly co-mentioned by psych patients (paracetamol/
#      ibuprofeno) since interactions matter.
#   3. Lowercase canonical — detection case-insensitive.
#   4. Spanish neutro covers AR/CL/MX/CO/PE/UY/EC.
#   5. NO street/recreational drug names in this list (those route to
#      `medical_safety_no_prescription` guardrail directly via different path).
