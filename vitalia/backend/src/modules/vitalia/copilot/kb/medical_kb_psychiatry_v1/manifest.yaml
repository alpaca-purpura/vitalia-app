# ─── Crisis keyword detection (orthogonal to medication detection) ───────────
# Psychiatry pack ALSO covers self-harm / suicide ideation patterns — same
# semantics as psychology pack but separate forced-retrieval chunks. When BOTH
# medication keyword AND crisis keyword present, BOTH boundary chunks are
# returned (forced-retrieval merge dedupes by point_id).
crisis_keywords:
  - suicidio
  - matarme
  - matarse
  - me quiero matar
  - me quiero morir
  - quitarme la vida
  - quitarse la vida
  - no quiero vivir
  - ya no quiero vivir
  - autolesión
  - autolesionarme
  - autolesionarse
  - cortarme
  - lastimarme
  - hacerme daño
  - emergencia psiquiátrica
  - crisis psiquiátrica
  - estoy en crisis
  - intoxicación intencional
  - sobredosis intencional

# ─── Boundary chunks (forced retrieval bypasses similarity threshold) ────────
# Disclaimer is THE primary T-kb-3 contract: forced top-1 on ANY medication
# query. Crisis lines mirror psychology pack pattern (per-country routing
# applies same logic — see VitaliaMedicalKbStore._fetch_forced_boundary_hits).
boundary_chunks:
  # ── PRIMARY T-kb-3 contract ─────────────────────────────────────────────
  - chunk_id: disclaimer_psychiatric_prescription_only
    source: 00_disclaimer.md
    forced_retrieval: true
    triggers: medication_keywords          # NOT crisis_keywords — disclaimer triggers on ANY medication
    priority: 1
    applies_to_countries: ["*"]            # always returned on medication query

  # ── Crisis lines (orthogonal — share psychology pack pattern) ──────────
  - chunk_id: boundary_refer_out_general_psych
    source: 07_safety_keywords_psychiatric.md
    forced_retrieval: true
    triggers: crisis_keywords
    priority: 2
    applies_to_countries: ["*"]

  - chunk_id: crisis_line_AR
    source: 07_safety_keywords_psychiatric.md
    forced_retrieval: true
    triggers: crisis_keywords
    priority: 2
    applies_to_countries: ["AR"]

  - chunk_id: crisis_line_CL
    source: 07_safety_keywords_psychiatric.md
    forced_retrieval: true
    triggers: crisis_keywords
    priority: 2
    applies_to_countries: ["CL"]

  - chunk_id: crisis_line_MX
    source: 07_safety_keywords_psychiatric.md
    forced_retrieval: true
    triggers: crisis_keywords
    priority: 2
    applies_to_countries: ["MX"]

  - chunk_id: crisis_line_CO
    source: 07_safety_keywords_psychiatric.md
    forced_retrieval: true
    triggers: crisis_keywords
    priority: 2
    applies_to_countries: ["CO"]

  - chunk_id: crisis_line_PE
    source: 07_safety_keywords_psychiatric.md
    forced_retrieval: true
    triggers: crisis_keywords
    priority: 2
    applies_to_countries: ["PE"]

  - chunk_id: crisis_line_BR
    source: 07_safety_keywords_psychiatric.md
