[project]
name = "luana-vitalia"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "python-multipart>=0.0.20",
    "starlette>=0.46",
    "structlog>=25.1",
    # Admin Streamlit (T-4)
    "streamlit>=1.40",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt>=4.0",
    # Clerk SDK for admin user management (graceful degradation if unavailable)
    "clerk-backend-api>=1.0",
]
# NOTA: las deps runtime completas (uvicorn, sqlalchemy, asyncpg, luana_core_*)
# viven en vitalia/pyproject.toml (workspace-visible stub). Este subproyecto
# vitalia/backend/ no está listado como workspace member — su pyproject NO se
# usa para resolver deps del image dev. Ver outcome dev-stack-cross-brand-fixes.

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-x -q --tb=short"
markers = [
    "integration: requires live Postgres instance (skipped when DB unavailable)",
    "verify: data reliability layer verification tests",
]

[tool.ruff]
line-length = 120
target-version = "py312"
exclude = [".git", "__pycache__", "dist", ".venv"]

[tool.ruff.lint]
select = ["E", "F", "I"]
