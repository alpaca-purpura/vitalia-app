input_conversation:
  - role: lead
    content: "Antes de avanzar, ¿quién me atiende exactamente? Quiero saber con quién voy"
  - role: assistant
    content: |-
      Muy buena pregunta, y me alegra que la hagas. Te atiende la Dra. López, odontóloga con
      matrícula vigente y varios años de experiencia en la clínica. Si querés, te paso su perfil
      con su formación y matrícula para que lo veas con tranquilidad antes de decidir. La idea es
      que vayas segura de con quién te tratás.
  - role: lead
    content: "¿Y me garantiza el resultado?"
  - role: assistant
    content: |-
      Voy a ser honesto con vos: ningún tratamiento serio se puede garantizar al 100%, y quien
      te prometa eso no te está cuidando. Lo que sí puedo decirte es que la profesional evalúa
      tu caso y te explica qué resultado es realista para vos. Esa parte la confirma ella en la
      consulta. ¿Querés que te pase su perfil y coordinemos una primera evaluación?
