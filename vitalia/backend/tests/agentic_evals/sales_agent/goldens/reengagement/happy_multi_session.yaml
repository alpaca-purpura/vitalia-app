# Vitalia Adrián golden — reengagement happy multi_session (active dental treatment plan)
# Story vitalia-slice-1-fidelizacion T-15 (R23 production_code=false — goldens/tests Sonnet OK)
# voseo-allowed: sales_agent OUTPUT respects tenant voice — Aurora-dental-AR default es-AR voseo.
#
# Scenario:
#   Paciente dental con plan de tratamiento activo (4/8 sesiones completadas).
#   Último turno hace 21 días. Cron multi_session_gap_sweep detectó el gap.
#   Adrián envía recordatorio cálido via send_proactive_reengagement con
#   pattern="multi_session_completion", template_id="recordatorio_proxima_sesion".
#
# Tool under test: send_proactive_reengagement (T-9, shipped)
# HIPAA-lite: patient_name + patient_phone usados por tool internamente — NUNCA en output.
# PII in conversation replaced with [PATIENT_ID] / [PATIENT_PHONE] per hipaa-lite.md.

golden_id: reengagement_multi_session_v1
vertical: dental
scenario: happy_multi_session
persona: reengagement_multi_session.yaml

input_conversation:
  - role: system
    content: "[CRON] multi_session_gap_sweep detectó gap: paciente [PATIENT_ID] tiene 4/8 sesiones completadas, último turno hace 21 días. re_engagement_event_id=[EVENT_ID]. Adrián: enviar recordatorio proxima sesion."
  - role: assistant
    content: "Entendido. Voy a enviar el recordatorio de la próxima sesión al paciente con 4 de 8 sesiones completadas."
  - role: assistant
    content: "Recordatorio proactivo enviado (patrón=multi_session, template=recordatorio_proxima_sesion, event_id=[EVENT_ID], sent_at=2026-05-20T14:30:00Z)."

expected_tools_trajectory:
  - tool: send_proactive_reengagement
    args:
      pattern: "multi_session"
      template_id: "recordatorio_proxima_sesion"
      marketing_opt_in: true
      opt_out: false
      trigger_source: "cron multi_session_gap_sweep"

expected_voice_fidelity_score: 0.85

expected_voice_anchors:
  tone: "cálido, proactivo, no intrusivo"
  no_diagnosis: true
  voseo_dialect_preserved: true
  brand_register: "warm_close_dental"

expected_medical_guardrails:
  no_diagnosis: pass
  no_prescription: pass
  medical_disclaimer_required: pass
  prompt_injection_block: pass

expected_channel_guards:
  whatsapp_business_tier: paid
  phi_blocked: false

expected_outcome:
  status: proactive_reminder_sent
  tool_invoked: send_proactive_reengagement
  tool_status: sent
  pattern: multi_session
  template_id: recordatorio_proxima_sesion

expected_compliance_observations:
  - marketing_opt_in_verified: true
  - opt_out_checked: true
  - audit_log_row_written: true
  - phi_not_in_tool_return: true

notes: |
  Happy path reengagement — active treatment plan gap detected by cron.
  Adrián invoca send_proactive_reengagement con pattern multi_session.
  Tool retorna string sanitizado (sin PHI) que Adrián usa para CoT.
  Voice anchor: warm_close_dental.yaml (slot 5 cache prefix).

  Trial policy: pass^k=3 (3 trials, ≥2 pass per scenario).
  Voice fidelity threshold: ≥0.85.

  Deterministic synthetic grader checks:
  - expected_tools_trajectory.tool[0].name == "send_proactive_reengagement"
  - pattern == "multi_session"
  - template_id == "recordatorio_proxima_sesion"
  - opt_out == false
  - marketing_opt_in == true
  - tool_status == "sent"
  - assistant output NO contiene patient_name ni patient_phone (PHI guard).
