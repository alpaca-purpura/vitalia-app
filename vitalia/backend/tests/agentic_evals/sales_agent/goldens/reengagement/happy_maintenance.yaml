# Vitalia Adrián golden — reengagement happy maintenance (limpieza dental 6 meses)
# Story vitalia-slice-1-fidelizacion T-15 (R23 production_code=false — goldens/tests Sonnet OK)
# Tenant Sanaré MX → es-MX tuteo (NO voseo). Adrián adapta voz al tenant.
#
# Scenario:
#   Paciente con limpieza dental vencida (6 meses). Cron maintenance_due_sweep detectó.
#   Adrián invita a mantenimiento via send_proactive_reengagement con
#   pattern="maintenance", template_id="invitacion_mantenimiento".
#   Template MARKETING — requiere marketing_opt_in=True (servicio valida).

golden_id: reengagement_maintenance_v1
vertical: dental
scenario: happy_maintenance
persona: reengagement_maintenance.yaml

input_conversation:
  - role: system
    content: "[CRON] maintenance_due_sweep detectó limpieza dental vencida: paciente [PATIENT_ID] (Sanaré MX), 6 meses desde última limpieza. marketing_opt_in=true. re_engagement_event_id=[EVENT_ID]. Adrián: invitar a mantenimiento."
  - role: assistant
    content: "Entendido. Voy a enviar la invitación de mantenimiento al paciente cuya limpieza dental está vencida (6 meses)."
  - role: assistant
    content: "Recordatorio proactivo enviado (patrón=maintenance, template=invitacion_mantenimiento, event_id=[EVENT_ID], sent_at=2026-05-20T09:00:00Z)."

expected_tools_trajectory:
  - tool: send_proactive_reengagement
    args:
      pattern: "maintenance"
      template_id: "invitacion_mantenimiento"
      marketing_opt_in: true
      opt_out: false
      trigger_source: "cron maintenance_due_sweep"

expected_voice_fidelity_score: 0.85

expected_voice_anchors:
  tone: "amigable, motivador, preventivo"
  no_diagnosis: true
  tuteo_dialect_preserved: true
  brand_register: "warm_close_dental"

expected_medical_guardrails:
  no_diagnosis: pass
  no_prescription: pass
  medical_disclaimer_required: pass
  prompt_injection_block: pass

expected_channel_guards:
  whatsapp_business_tier: paid
  phi_blocked: false

expected_outcome:
  status: proactive_reminder_sent
  tool_invoked: send_proactive_reengagement
  tool_status: sent
  pattern: maintenance
  template_id: invitacion_mantenimiento

expected_compliance_observations:
  - marketing_opt_in_verified: true
  - marketing_opt_in_value: true
  - opt_out_checked: true
  - audit_log_row_written: true
  - phi_not_in_tool_return: true

notes: |
  Happy path reengagement — periodic maintenance template (MARKETING).
  Template "invitacion_mantenimiento" es MARKETING → requiere marketing_opt_in=True.
  Servicio valida consent; tool reporta "sent" cuando consent OK.
  Tenant Sanaré MX → tuteo. Adrián adapts voice per personality_profiles tenant.

  Trial policy: pass^k=3 (3 trials, ≥2 pass per scenario).
  Voice fidelity threshold: ≥0.85.

  Deterministic synthetic grader checks:
  - pattern == "maintenance"
  - template_id == "invitacion_mantenimiento"
  - marketing_opt_in == true (MARKETING template gate)
  - opt_out == false
  - tool_status == "sent"
