    content: "Presencial mejor. ¿Cuándo?"
  - role: assistant
    content: "Tengo: jueves 17:00 o sábado 10:00 con la Dra. Vázquez. ¿Cuál les queda?"
  - role: lead
    content: "Jueves 17"
