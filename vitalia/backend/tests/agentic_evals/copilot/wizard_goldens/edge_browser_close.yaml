  - role: assistant
    content: "Listo, anoté 'psicología/bienestar mental' como especialidad principal. ¿Algún link de la clínica para extraer info? Si no, seguimos sin eso."
  - role: tenant
    content: "Sí, web: centrobienestarandino.ec"
  - role: assistant
    content: "Genial, extraigo. Te aviso cuando termine y te muestro qué encontró para que confirmes."
expected_tools_trajectory:
