# Vitalia Valeria wizard golden — edge browser close (autosave resume)
golden_id: wizard_edge_browser_close_v1
flow: wizard_onboarding
scenario: edge_browser_close
persona: tenant_distraido_se_va_vuelve.yaml
input_conversation:
  - role: tenant
    content: "Hola, soy de Centro de Bienestar"
  - role: assistant
    content: "Hola, soy Valeria. Te ayudo con la configuración. ¿'Centro de Bienestar' es el nombre completo y en qué ciudad estás?"
