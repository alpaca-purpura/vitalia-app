    content: "[Resume 2h later] Hola, volví, vi correo"
  - role: assistant
    content: "Hola, qué bueno que volviste. Tenemos guardado: 'Centro de Bienestar Andino' en Quito. ¿Seguimos desde donde quedamos? Te tocaba pasarme la especialidad principal."
