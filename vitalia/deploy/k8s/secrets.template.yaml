---
# vitalia/deploy/k8s/secrets.template.yaml
# TEMPLATE ONLY — environment variable REFERENCES, no real values.
# Chris provisions real values via Clerk dashboard + payment portals + Postgres.
#
# Usage before applying to cluster:
#   envsubst < secrets.template.yaml | kubectl apply -f -
# Or use a secrets manager (Doppler / AWS Secrets Manager / Vault):
#   doppler run -- kubectl apply -f <(doppler secrets substitute secrets.template.yaml)
#
# SECURITY: NEVER commit the rendered version. Add to .gitignore:
#   vitalia/deploy/k8s/secrets.yaml
#
# Arch ref: 03-arch.md § 5.3 + § 5.4 + § 5.5 (Chris UI gates Q4=B)
# T-deploy-1 constraint: env var REFERENCES only — ${VARNAME} placeholders.
apiVersion: v1
kind: Secret
metadata:
  name: vitalia-secrets
  namespace: vitalia
  labels:
    app.kubernetes.io/name: vitalia
    app.kubernetes.io/component: backend
    app.kubernetes.io/part-of: luana-platform
    app.kubernetes.io/managed-by: kubectl
type: Opaque
stringData:
  # ── Database credentials ─────────────────────────────────────────────────
  # Chris provisions: CREATE USER vitalia_app WITH PASSWORD '...';
  POSTGRES_PASSWORD: ${VITALIA_DB_PASSWORD}

  # ── Clerk app #2 (stand-alone Vitalia — NOT shared with Nicolify per § 5.4) ─
  # Chris provisions: dashboard.clerk.com → app "vitalia" → API Keys
  VITALIA_CLERK_PUBLISHABLE_KEY: ${VITALIA_CLERK_PUBLISHABLE_KEY}
  VITALIA_CLERK_SECRET_KEY: ${VITALIA_CLERK_SECRET_KEY}
  # Clerk → Webhooks → endpoint /api/v1/vitalia/webhooks/clerk → Signing Secret
  VITALIA_CLERK_WEBHOOK_SECRET: ${VITALIA_CLERK_WEBHOOK_SECRET}

  # ── Stripe Connect (US/EU clinics secondary market) ──────────────────────
  # Chris provisions: dashboard.stripe.com → Developers → API Keys
  # NOTE: NO Stripe Healthcare flag — compliance_level=hipaa_lite (Q6=B ratified).
  VITALIA_STRIPE_SECRET_KEY: ${VITALIA_STRIPE_SECRET_KEY}
  # Stripe → Developers → Webhooks → endpoint /api/v1/vitalia/webhooks/stripe
  VITALIA_STRIPE_WEBHOOK_SECRET: ${VITALIA_STRIPE_WEBHOOK_SECRET}

  # ── MercadoPago (LatAm primary — AR/MX/BR/CL/CO per § 5.5) ─────────────
  # Chris provisions: mercadopago.com/developers → Credentials → Production
  # One access token per país if multi-country expansion needed.
  VITALIA_MERCADOPAGO_ACCESS_TOKEN: ${VITALIA_MERCADOPAGO_ACCESS_TOKEN}
  VITALIA_MERCADOPAGO_PUBLIC_KEY: ${VITALIA_MERCADOPAGO_PUBLIC_KEY}
  # MercadoPago → Webhooks → endpoint /api/v1/vitalia/webhooks/mercadopago
  VITALIA_MERCADOPAGO_WEBHOOK_SECRET: ${VITALIA_MERCADOPAGO_WEBHOOK_SECRET}

  # ── WhatsApp Business API ────────────────────────────────────────────────
  VITALIA_WHATSAPP_WEBHOOK_SECRET: ${VITALIA_WHATSAPP_WEBHOOK_SECRET}

  # ── ManyChat ─────────────────────────────────────────────────────────────
  VITALIA_MANYCHAT_WEBHOOK_SECRET: ${VITALIA_MANYCHAT_WEBHOOK_SECRET}

  # ── Consent URL HMAC signing ─────────────────────────────────────────────
  # Used by ConsentService to sign time-limited consent URLs.
  VITALIA_CONSENT_URL_SECRET: ${VITALIA_CONSENT_URL_SECRET}

  # ── Anthropic API (agentic surface — copilot + sales_agent) ─────────────
  ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}

  # ── Redis (if password auth enabled) ─────────────────────────────────────
  REDIS_PASSWORD: ${VITALIA_REDIS_PASSWORD}

  # ── Qdrant (if API key auth enabled) ─────────────────────────────────────
  QDRANT_API_KEY: ${VITALIA_QDRANT_API_KEY}

  # ── Admin Streamlit super-admin auth (T-5 vitalia-auth-base-functional) ─
  # bcrypt hash of VITALIA_ADMIN_PASSWORD — generate with:
  #   bash vitalia/deploy/scripts/generate_admin_password_hash.sh
  # Then export:
  #   export VITALIA_ADMIN_PASSWORD_HASH='$2b$12$...'
  # D8 ratified: single password env-var (defer multi-admin).
  # NEVER commit the plaintext password. Only commit the hash in secrets.
  VITALIA_ADMIN_PASSWORD_HASH: ${VITALIA_ADMIN_PASSWORD_HASH}
