      reproduced_local: false
      not_a_bugfix: "feature nuevo (CRUD + validators) — repro N/A; live-verify en DoD"
    assignment:
      primary_agent: builder-backend
      model_preference: sonnet           # R23: production_code BE non-agentic → Sonnet OK (NO copilot/sales_agent)
