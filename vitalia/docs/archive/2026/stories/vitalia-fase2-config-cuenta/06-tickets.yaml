        - "tests/modules/vitalia/_shared/test_specialty_catalog.py"
        - "tests/modules/vitalia/clinics/test_clinic_account_repository.py"
        - "tests/modules/vitalia/clinics/test_clinic_account_service.py"
        - "tests/modules/vitalia/clinics/test_account_router.py"
