    module: clinics
    nature: feature_be_inside_out
    state: audit-passed        # /auditor iter 2 APPROVED 2026-06-12 · C9-1 RESOLVED (audit row durable, live count 1→2 verificado por el auditor) · C1-2/C10-1 closed. Ver T-2-review.md § Audit iteration 2
