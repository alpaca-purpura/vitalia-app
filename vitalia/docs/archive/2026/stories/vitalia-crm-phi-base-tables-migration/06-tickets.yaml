    title: "Seed paciente cifrado + integration tests reales + verificación live (re-god-matrix)"
    surface: BE
    production_code: true
    owner_eligibility: [opencode, sonnet, opus]
    deliverables:
      - "scripts/seed_test_users_link.py: + 1 paciente Sanaré (id determinístico) INSERT con pgp_sym_encrypt + datos LatAm neutros"
      - "tests/integration/test_crm_phi_real_tables.py: test_doctor_reads_patient_200_audit, test_marketing_403, test_cross_tenant_404, test_cross_clinic_403, test_phi_encrypted_at_rest_decrypted_on_read (NO monkeypatch repo; monkeypatch SOLO verify_token_payload) — RED first"
      - "verificación live supervisada: aplicar 035 en dev + re-god-matrix mint JWT real → /patients/{id} 200+descifrado+audit + raw=ciphertext + /leads 200 + marketing 403 + cross-tenant 404 + logs limpios (sin KEK/PHI/500)"
      - "documentar evidencia live (status codes + logs sanitizados) en T-3-result.md — NUNCA imprimir JWT/secret/PHI plaintext"
    tests_required:
      - "integration sobre tablas reales (5 scenarios)"
      - "manual_audit anti-teatro (04-validators § manual_audit) — supervisado por Chris"
    assignment:
      primary_agent: builder-backend
      model_preference: sonnet
      must_load_skills:
        - backend-expert
        - tessl__pytest-api-testing
        - vitalia/.claude/rules/hipaa-lite.md
        - .claude/rules/test-design-doctrine.md
      must_load_artifacts:
        - "vitalia/docs/product/stories/vitalia-crm-phi-base-tables-migration/04-validators.yaml § scenario_coverage + manual_audit"
        - "vitalia/docs/product/stories/vitalia-crm-phi-base-tables-migration/03-arch.md § 6"
        - "vitalia/docs/learnings/2026-05-30-clerk-godmatrix-mint-live-verification.md"
      forbidden_to_touch:
        - "core/luana-core-*/src/"
        - "nicolify/"
        - "comunify/"
        - "lupulo/"
        - "vitalia/backend/src/modules/vitalia/copilot/"
        - "vitalia/backend/src/modules/vitalia/sales_agent/"
        - "vitalia/backend/alembic/versions/016_vitalia_patients_columns.py"
      rationale: "Seed + integration + verificación live anti-teatro. BE non-agentic — Sonnet. La verificación live es SUPERVISADA (autonomous_mode false): Chris valida el approach + revisa evidencia antes de cerrar."
