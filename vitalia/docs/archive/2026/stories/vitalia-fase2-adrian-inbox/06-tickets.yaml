# 06-tickets.yaml — vitalia-fase2-adrian-inbox
# Owner: /architect. Cada ticket: assignment block (NUNCA general-purpose) + production_code + acceptance + gherkin_coverage + DAG.
# Naturaleza: MIGRACIÓN + consolidación + un-stub. NO build virgen. Cero tickets editan core/ o sales_agent/ runtime.

story_id: vitalia-fase2-adrian-inbox
brand: vitalia
architecture_pattern: ADR-vitalia-004
autonomous_mode: true            # Chris ratified 2026-06-03 ("cubre todos los pasos hasta done")
human_gate: "reviewing → done requiere Chris demo sign-off en dev-app (Rule #37 + ADR-vitalia-008)"

tickets:

  # ───────────────────────────────────────────────────────────────
  - id: T-1
    title: "BE — un-stub ComplianceService real + PhiChannelPolicy (SC-3/AC-9/RN-7)"
    surface: backend
    production_code: true
    owner_eligibility: [builder-backend]
    depends_on: []
    blocks: [T-2, T-6]
    assignment:
      primary_agent: builder-backend
      model_preference: sonnet           # BE no-agentic; consume engine (no AGENTIC production code)
      must_load_skills: [backend-expert, sales-agent-expert]   # sales-agent-expert SOLO § anti-duplication (consume tool, no import)
      must_load_artifacts:
        - vitalia/docs/product/stories/vitalia-fase2-adrian-inbox/03-arch-be.md
        - vitalia/docs/product/stories/vitalia-fase2-adrian-inbox/05-guidelines.md
        - vitalia/.claude/rules/hipaa-lite.md
      forbidden_to_touch:
        - core/**
        - vitalia/backend/src/modules/vitalia/sales_agent/**
        - vitalia/backend/src/modules/vitalia/copilot/**
        - "vitalia_conversations schema (sin migración)"
      rationale: >-
        Consume ComplianceService.check() del engine compliance vía una PhiChannelPolicy que cumple
        el CompliancePolicy Protocol (extensión, no mirror). Wire DI NoOp→real en _get_send_service/
        _get_proactive_service. NO crea layer nuevo. Sonnet OK (no agentic production code).
    deliverables:
      - "inbox/application/policies/phi_channel_policy.py (NEW — implementa CompliancePolicy Protocol)"
      - "inbox/api/router.py (MODIFY — DI ComplianceService real en send/proactive paths)"
      - "send path: si !allowed → redirect a portal (microcopy SSoT) + activity event + audit row 'compliance_block_outbound_phi'"
    acceptance:
      validator_ids: [fn-be-phi-policy, av-be-arch-fitness, av-no-sales-agent-import, av-no-core-edit]
    gherkin_coverage: [SC-3]
    tests_red_first:
      - "tests/modules/vitalia/inbox/application/test_phi_channel_policy.py"
      - "tests/modules/vitalia/inbox/compliance/test_phi_voice_redirect.py (llenar stub)"

  # ───────────────────────────────────────────────────────────────
  - id: T-2
    title: "BE — NudgeService + endpoint POST /nudge (RN-13)"
    surface: backend
    production_code: true
    owner_eligibility: [builder-backend]
    depends_on: [T-1]                     # comparte DI/router con T-1; serializar para evitar conflicto en router.py
    blocks: [T-6]
    assignment:
      primary_agent: builder-backend
      model_preference: sonnet
      must_load_skills: [backend-expert, sales-agent-expert]
      must_load_artifacts:
        - vitalia/docs/product/stories/vitalia-fase2-adrian-inbox/03-arch-be.md
        - vitalia/.claude/rules/hipaa-lite.md
      forbidden_to_touch:
        - core/**
        - vitalia/backend/src/modules/vitalia/sales_agent/**
      rationale: >-
        Nudge consume send_proactive_reengagement (brand tool shipped) vía service resolver — NUNCA
        import directo de sales_agent/. Scoped a UNA conv viva estancada (no conv nueva, no lead frío).
        Idempotency dedup. response_model + dual filter + audit sync. Sonnet OK (no agentic prod code).
    deliverables:
      - "inbox/application/services/nudge_service.py (NEW)"
      - "inbox/application/dto/nudge_dto.py (NEW — NudgeRequest/Response)"
      - "inbox/api/router.py (MODIFY — POST /conversations/{id}/nudge + _get_nudge_service DI)"
    acceptance:
      validator_ids: [fn-be-nudge, fn-schemathesis-nudge, av-be-arch-fitness, av-no-sales-agent-import]
    gherkin_coverage: [SC-6]
    tests_red_first:
      - "tests/modules/vitalia/inbox/application/test_nudge_service.py"
      - "tests/modules/vitalia/inbox/api/test_router_nudge.py"

  # ───────────────────────────────────────────────────────────────
  - id: T-3
    title: "FE — ruta adrian/inbox/page.tsx + registro shell (SHIPPED_STATIC_SUBTABS) + ChannelBadge + barrel (CONN)"
    surface: frontend
    production_code: true
    owner_eligibility: [builder-frontend]
    depends_on: []                        # independiente de BE (consume contrato shipped)
    blocks: [T-4, T-5]
    assignment:
      primary_agent: builder-frontend
      model_preference: sonnet
      must_load_skills: [frontend-expert, vitalia-design-system]
      must_load_artifacts:
        - vitalia/docs/product/stories/vitalia-fase2-adrian-inbox/03-arch-fe.md
        - vitalia/docs/product/stories/vitalia-fase2-adrian-inbox/05-guidelines.md
        - vitalia/docs/architecture/ADR-vitalia-004-shell-feature-architecture.md
      forbidden_to_touch:
        - components/ui/**
        - "components/shared/shell-organism/{ShellOrganismLayout,ValeriaSidebar,Ribbon,SubTabsBar,EmptyState,SubSubTabsBar}.tsx"
        - stores/shell-store.ts
        - core/**
      rationale: >-
        Mirror exacto de mateo/agenda/page.tsx (RSC + getInitialInboxState SSR). Registro CONN:
        SHIPPED_STATIC_SUBTABS += adrian.inbox (sin esto la ruta es isla → dispatcher → placeholder).
        ChannelBadge reusable a shared/shell-organism/. Establece el esqueleto que T-4 llena.
    deliverables:
      - "app/[tenantId]/(shell-organism)/adrian/inbox/page.tsx (NEW)"
      - "features/adrian/api/inbox-server.ts (NEW — getInitialInboxState, graceful degradation)"
      - "components/shared/shell-organism/ChannelBadge.tsx (NEW)"
      - "lib/agent-catalog.ts (MODIFY — SHIPPED_STATIC_SUBTABS += adrian.inbox)"
      - "features/adrian/index.ts (MODIFY — export AdrianInboxView + getInitialInboxState; quitar InboxPlaceholder del wiring activo)"
    acceptance:
      validator_ids: [nf-fe-tsc, av-no-orphan-inbox, av-fe-arch-fitness, vis-runtime-error-gate]
    gherkin_coverage: [SC-7, SC-8]

  # ───────────────────────────────────────────────────────────────
  - id: T-4
    title: "FE — consolidación features/inbox → features/adrian/components/inbox + MERGE parity + DELETE huérfano"
    surface: frontend
    production_code: true
    owner_eligibility: [builder-frontend]
    depends_on: [T-3]                     # necesita ruta + barrel + ChannelBadge
    blocks: [T-5, T-6]
    assignment:
      primary_agent: builder-frontend
      model_preference: sonnet
      must_load_skills: [frontend-expert, vitalia-design-system]
      must_load_artifacts:
        - vitalia/docs/product/stories/vitalia-fase2-adrian-inbox/03-arch.md          # § 9 migration plan (source→dest verbatim)
        - vitalia/docs/product/stories/vitalia-fase2-adrian-inbox/03-arch-fe.md
      forbidden_to_touch:
        - components/ui/**
        - "components/shared/shell-organism/{ShellOrganismLayout,ValeriaSidebar,Ribbon,SubTabsBar}.tsx"
        - stores/shell-store.ts
      rationale: >-
        Migra la lógica rica (~40 comps + hooks + store) de features/inbox/ → features/adrian/components/inbox/,
        merge con la versión parity (quedarse con la más rica), mueve Vitest co-located, y DELETE
        features/inbox/ en el MISMO PR (anti-duplicación: dos sets no conviven). Gate av-no-orphan-inbox valida.
    deliverables:
      - "features/adrian/components/inbox/** (MIGRATE+MERGE per 03-arch.md § 9.1/9.2)"
      - "features/adrian/api/{inbox.ts,_keys.ts} (NEW/MIGRATE — hooks RQ consolidados)"
      - "features/adrian/hooks/** + store/inbox-store.ts (MIGRATE+EXTEND priorValeriaState)"
      - "features/adrian/types/{inbox.types.ts,inbox-schema.ts} (MIGRATE+NEW)"
      - "features/inbox/ (DELETE — todo el directorio)"
    acceptance:
      validator_ids: [nf-fe-tsc, nf-fe-eslint, nf-no-dup-jscpd, av-no-orphan-inbox, av-fe-arch-fitness, fn-fe-vitest-inbox]
    gherkin_coverage: [SC-1, SC-2]

  # ───────────────────────────────────────────────────────────────
  - id: T-5
    title: "FE — piezas NEW: AdrianInboxView 3-pane + ModeToggle + ConversationModeButton + ToolCallCard + NudgeButton + Valeria-reacciona"
    surface: frontend
    production_code: true
    owner_eligibility: [builder-frontend]
    depends_on: [T-3, T-4]
    blocks: [T-6]
    assignment:
      primary_agent: builder-frontend
      model_preference: sonnet
      must_load_skills: [frontend-expert, vitalia-design-system]
      must_load_artifacts:
        - vitalia/docs/product/stories/vitalia-fase2-adrian-inbox/03-arch-fe.md       # § 5 mapping, § 6 modo conversación, § 7 valeria-reacciona
        - vitalia/docs/product/stories/vitalia-fase2-adrian-inbox/01-spec.md           # § Wireframes + § Estados visuales
      forbidden_to_touch:
        - components/ui/**
        - stores/shell-store.ts                # consume setValeriaState, NO modifica
        - core/**
        - vitalia/backend/src/modules/vitalia/sales_agent/**
      rationale: >-
        Las piezas que no existían: 3-pane ResizablePanelGroup, ModeToggle (mapping 3-modos→backend),
        ConversationModeButton (colapsa Valeria + recuerda estado via useShellStore REUSE),
        ToolCallCard inline, NudgeButton (consume endpoint T-2), useValeriaReaccion básica.
        Segmented control NO Shadcn Tabs.
    deliverables:
      - "features/adrian/components/inbox/{AdrianInboxView,ModeToggle,ConversationModeButton,ToolCallCard,NudgeButton}.tsx (NEW)"
      - "features/adrian/hooks/useValeriaReaccion.ts (NEW)"
      - "Vitest co-located para cada pieza NEW"
    acceptance:
      validator_ids: [nf-fe-tsc, nf-fe-eslint, fn-fe-vitest-inbox, av-fe-arch-fitness]
    gherkin_coverage: [SC-1, SC-4, SC-5, SC-6]

  # ───────────────────────────────────────────────────────────────
  - id: T-6
    title: "Tests E2E + visual goldens + a11y + BE regression_guard + demo-script (live-verify DoD #37)"
    surface: frontend                       # mayormente FE e2e; incluye verificar suite BE verde
    production_code: false                  # tests + demo-script (no production code)
    owner_eligibility: [builder-frontend]
    depends_on: [T-1, T-2, T-4, T-5]
    blocks: []
    assignment:
      primary_agent: builder-frontend
      model_preference: sonnet
      must_load_skills: [frontend-expert, playwright-expert, vitalia-design-system]
      must_load_artifacts:
        - vitalia/docs/product/stories/vitalia-fase2-adrian-inbox/04-validators.yaml   # scenario_coverage + test_construction_plan
        - vitalia/docs/product/stories/vitalia-fase2-adrian-inbox/01-spec.md           # § Gherkin SC-1..SC-10
      forbidden_to_touch:
        - core/**
        - "production code de T-1..T-5 (solo tests + demo-script; bugs → handoff al builder owner)"
