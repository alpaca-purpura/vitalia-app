      - "e2e/pages/AdrianInboxPage.ts (NEW POM)"
      - "e2e/__screenshots__/inbox/*.png (12 goldens)"
      - "demo-script.md (SETUP/HAPPY/EDGE/TEARDOWN derivado de SC)"
