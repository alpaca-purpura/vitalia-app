    gherkin_coverage: [SC-1, SC-2, SC-3, SC-4, SC-5, SC-6, SC-7, SC-8, SC-9, SC-10]

# ═══════════════════════════════════════════════════════════════
# DAG (depends_on / blocks)
# ═══════════════════════════════════════════════════════════════
dag:
  description: >-
    Lane BE (T-1 → T-2) y lane FE (T-3 → T-4 → T-5) corren EN PARALELO (sin deps cruzadas hasta T-6).
    T-1→T-2 serializan por compartir router.py. T-3→T-4→T-5 serializan por compartir features/adrian/.
    T-6 (tests + demo) cierra: depende de T-1,T-2,T-4,T-5.
  critical_path: [T-3, T-4, T-5, T-6]       # FE es el camino más largo
  parallel_lanes:
    - { lane: BE, tickets: [T-1, T-2] }
    - { lane: FE, tickets: [T-3, T-4, T-5] }
  join: T-6

# ═══════════════════════════════════════════════════════════════
# Guardrails globales (todos los tickets)
# ═══════════════════════════════════════════════════════════════
guardrails:
  - "NINGÚN ticket edita core/luana-core-*/src/ ni vitalia/.../sales_agent/ o copilot/ runtime."
  - "Necesidad genuina de tocar sales_agent tool/prompt → escalar /pm-vitalia (NO ticket)."
  - "Necesidad de primitive nuevo en engine compliance → escalar /pm-luana (NO ticket)."
  - "Anti-duplicación: features/inbox/ se BORRA en T-4 (no dos sets)."
  - "Tenant+clinic dual filter + audit sync write + response_model en todo endpoint."
  - "e2e importan e2e/fixtures/base.ts (anti-burbuja). NO mockear backend del surface (DoD #37)."
  - "Native Linux host (no docker exec). FE :3002 / BE :8002."

