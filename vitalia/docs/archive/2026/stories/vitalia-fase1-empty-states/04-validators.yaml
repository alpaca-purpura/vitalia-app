# ──────────────────────────────────────────────────────────────────────
# Categoría 5 — architectural_validation
# ──────────────────────────────────────────────────────────────────────
architectural_validation:
  - id: val-fe-arch-subtab-content-uses-ribbon-subtabs-ssot
    name: "Arch · SubTabContent dispatcher consume RIBBON_SUBTABS SSoT (NUEVO test)"
    must_pass: true
    command: |
      cd ${WS}/vitalia/frontend && npx vitest run src/__tests__/architecture/test_subtab_content_uses_ribbon_subtabs_ssot.test.ts
    expected: |
      - PLACEHOLDER_MAP contiene exactamente 22 keys derivadas de RIBBON_SUBTABS
      - sin keys 'mateo.*' (transversal agent)
      - importa RIBBON_SUBTABS desde @/lib/agent-catalog

  - id: val-fe-arch-no-hardcoded-subtab-keys
    name: "Arch · no literal 'agent.subtab' hardcoded outside dispatcher (NUEVO test)"
    must_pass: true
    command: |
      cd ${WS}/vitalia/frontend && npx vitest run src/__tests__/architecture/test_no_hardcoded_subtab_keys.test.ts
    expected: "0 hardcoded keys fuera de SubTabContent.tsx + __tests__/ + e2e/"

  - id: val-fe-arch-no-phi-real-data
    name: "Arch · placeholders mock-only, no PHI real (NUEVO test)"
    must_pass: true
    command: |
      cd ${WS}/vitalia/frontend && npx vitest run src/__tests__/architecture/test_no_phi_real_data.test.ts
    expected: |
      - 0 secuencias 8-digit literal en features/{adrian,valeria,camila}/components/
      - 0 phone real 10+ dígitos consecutivos en placeholders
      - email masked pattern verificado (m***@gmail.com format)

  - id: val-fe-arch-fsd-boundaries
    name: "Arch · FSD-Lite boundaries shrink-only ratchet"
    must_pass: true
    command: |
      cd ${WS}/vitalia/frontend && npx vitest run src/__tests__/architecture/test_fsd_boundaries.test.ts
    expected: "shared no importa de features · feature no importa cross-feature · allowlist no grew"

  - id: val-fe-arch-no-cross-brand-mirror
    name: "Arch · no cross-brand mirror (vitalia ↔ nicolify/comunify/lupulo)"
    must_pass: true
    command: |
      ${WS}/scripts/scan_cross_brand_mirror.sh vitalia shell-organism
    expected: |
      - no SubTabContent.tsx en otros brands frontend
      - no EmptyState.tsx (shell-specific) en otros brands frontend
      - no features/adrian/components/inbox/ en otros brands frontend

  - id: val-fe-arch-no-voseo-strings
    name: "Arch · 0 voseo verbs en strings user-facing (Spanish neutro LatAm)"
    must_pass: true
    command: |
      ${WS}/scripts/git-hooks/pre-commit
    expected: "pre-commit voseo glosario check passes — 0 matches en placeholders + moléculas + organisms"

