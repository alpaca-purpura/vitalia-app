# F1-S10 vitalia-fase1-empty-states — validators (5 categorías ★ v4.1)
#
# Each validator: must_pass=true unless explicitly marked. Comando shell EJECUTABLE.
# ZERO Opus en build (FE puro sin agentic surface).
#
# Categorías v4.1:
#   1. non_functional          — typecheck, lint, format, vitest unit + coverage, arch FSD boundaries, cross-brand mirror
#   2. functional              — E2E Playwright (11 specs SC-1..SC-10) + vitest unit
#   3. visual                  — Playwright visual goldens (44 light/dark + 6 takeover + ~18 responsive)
#   4. agentic_eval            — N/A justified (zero agentic surface)
#   5. architectural_validation — FSD-Lite, no-cross-brand, ribbon-subtabs-ssot, no-hardcoded-subtab-keys, no-PHI-real-data

story_id: vitalia-fase1-empty-states
brand: vitalia
phase: fase-1
story_type: ui-story
last_modified: 2026-05-26
architect_iter: 1
playwright_required: true   # ui-story HARD per v4.1

# ──────────────────────────────────────────────────────────────────────
# scenario_coverage — 11 SC del spec ratificado
# ──────────────────────────────────────────────────────────────────────
scenario_coverage:
  total_scenarios: 11
  mapped: 11
  coverage_pct: 100
  scenarios:
    - id: SC-1
      title: "happy · 22 sub-tabs navegables sin error"
      validator_ids:
        - val-fe-e2e-sc01-navegacion-22-subtabs
        - val-fe-vitest-unit-subtab-content
        - val-fe-tsc
        - val-fe-visual-goldens-22-subtabs

    - id: SC-2
      title: "happy · placeholder Lisa Servicios (toggle Catálogo|Escalera)"
      validator_ids:
        - val-fe-e2e-sc02-lisa-servicios
        - val-fe-vitest-unit-toggle-pill
        - val-fe-visual-lisa-servicios-catalogo
        - val-fe-visual-lisa-servicios-escalera

    - id: SC-3
      title: "happy · placeholder Adrián Embudo (Kanban 6 cols)"
      validator_ids:
        - val-fe-e2e-sc03-adrian-embudo
        - val-fe-visual-adrian-embudo-kanban
        - val-fe-visual-adrian-embudo-lista

    - id: SC-4
      title: "happy · placeholder Valeria Agenda enriquecida (toolbar+filters+grid+footer)"
      validator_ids:
        - val-fe-e2e-sc04-valeria-agenda
        - val-fe-vitest-unit-agenda-slot
        - val-fe-visual-valeria-agenda-week-default
        - val-fe-visual-responsive-valeria-agenda

    - id: SC-4-bis
      title: "happy · placeholder Adrián Inbox + Takeover UX A↔B + sidebar toggle"
      validator_ids:
        - val-fe-e2e-sc04bis-adrian-inbox
        - val-fe-vitest-unit-conversation-item
        - val-fe-vitest-unit-thread-header
        - val-fe-visual-inbox-state-A-adrian
        - val-fe-visual-inbox-state-B-human
        - val-fe-visual-inbox-sidebar-closed

    - id: SC-5
      title: "negative · subtab inválido → not-found.tsx jerárquico"
      validator_ids:
        - val-fe-e2e-sc05-subtab-invalido

    - id: SC-6
      title: "edge · 22 sub-tabs sin re-mount completo shell"
      validator_ids:
        - val-fe-e2e-sc06-no-shell-remount

    - id: SC-7
      title: "adversarial · XSS payload en URL → safe render (no script execution)"
      validator_ids:
        - val-fe-e2e-sc07-adversarial-xss

    - id: SC-8
      title: "sub-categoría empty_state · 16 sub-tabs genéricos parametrizado"
      validator_ids:
        - val-fe-e2e-sc08-empty-states-genericos
        - val-fe-vitest-unit-empty-state

    - id: SC-9
      title: "sub-categoría accessibility · axe wcag2aa + heading hierarchy + keyboard"
      validator_ids:
        - val-fe-e2e-sc09-a11y
        - val-fe-axe-empty-states

    - id: SC-10
      title: "sub-categoría i18n · Spanish neutro LatAm + tenant_locale PEN"
      validator_ids:
        - val-fe-e2e-sc10-i18n
        - val-fe-arch-no-voseo-strings

sub_categories_coverage:
  race_condition:
    applies: false
    not_applicable_reason: "F1-S10 sin writes / sin unique constraint / sin create concurrente — mock-only placeholder."
  concurrent_users:
    applies: false
    not_applicable_reason: "Routing per-session; toggle state local component-scoped. Sin state compartido cross-user."
  network_failure:
    applies: false
    not_applicable_reason: "Cero fetch APIs. Todo mock hardcoded en componentes Fase 1. F2 cableará data real per sub-tab."
  large_dataset:
    applies: false
    not_applicable_reason: "Mock fijo: 5 conversaciones, 10 agenda slots, 6 cols × 3 leads. Sin paginación / sin large list virtualization Fase 1."
  empty_state:
    applies: true
    covered_by: [val-fe-e2e-sc08-empty-states-genericos, val-fe-vitest-unit-empty-state]
  accessibility:
    applies: true
    covered_by: [val-fe-e2e-sc09-a11y, val-fe-axe-empty-states]
  i18n_l10n:
    applies: true
    covered_by: [val-fe-e2e-sc10-i18n, val-fe-arch-no-voseo-strings]

