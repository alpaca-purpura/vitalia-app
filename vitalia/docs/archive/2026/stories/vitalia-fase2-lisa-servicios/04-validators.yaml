    - { rn: RN-33, tag: "@RN-33", scenarios: [agregar-testimonio, quitar-testimonio, caso-requiere-consent, caso-sin-consent-bloquea], verification: [e2e, int] }

# ───────────────────────────────────────────────────────────────────────────
# 3 · VISUAL (goldens · ADR-003 · maxDiffPixelRatio 0.001)
# ───────────────────────────────────────────────────────────────────────────
visual:
  golden_tolerance: 0.001
  goldens:
    - { mockup: mockups/catalogo.html, snapshot: "e2e/__screenshots__/servicios/catalogo-{theme}.png", component: "features/lisa/components/servicios/CatalogoView.tsx", themes: [light, dark] }
    - { mockup: mockups/escalera.html, snapshot: "e2e/__screenshots__/servicios/escalera-{theme}.png", component: "features/lisa/components/servicios/EscaleraView.tsx", themes: [light, dark] }
    - { mockup: mockups/servicio-workspace.html, snapshot: "e2e/__screenshots__/servicios/servicio-workspace-{theme}.png", component: "features/lisa/components/servicios/ServicioWorkspaceView.tsx", themes: [light, dark] }
    - { mockup: mockups/nuevo-servicio.html, snapshot: "e2e/__screenshots__/servicios/nuevo-servicio-{theme}.png", component: "features/lisa/components/servicios/BibliotecaPicker.tsx", themes: [light, dark] }
  design_contract_ref: "docs/architecture/luana-platform/design-system-canon.md §2 + vitalia/docs/architecture/SHELL-DESIGN-CONTRACT.md"

# ───────────────────────────────────────────────────────────────────────────
# 4 · AGENTIC_EVAL
# ───────────────────────────────────────────────────────────────────────────
agentic_eval:
  sub_phase_A:
    - id: AE-A1
      desc: "KEYSTONE: Offer activo aparece en TenantKnowledgeBuilder.build_identity output (data shape · consume-only)."
      rn: [AC-6]
      verification: [int, live]
      note: "BE assertion + LIVE-verify (activar + leer logs). NO eval goldens (sin sales_agent code nuevo en A)."
  sub_phase_B:
    deferred_pending_engine_lift: true
    goldens_required: 4   # 1 happy + 3 adversarial · drift threshold grader_score >= 0.85
    owner_eligibility: flagship   # R23
    evals:
      - id: AE-B1
        desc: "RAG retrieval responde de fuentes comerciales (1 happy)."
        verification_phase: B
      - id: AE-B2
        desc: "Adversarial: precio del doc rechazado (precio sale del campo)."
        verification_phase: B
      - id: AE-B3
        desc: "Adversarial: pregunta clínica escala al doctor."
        verification_phase: B
      - id: AE-B4
        desc: "Adversarial: ingesta con scrub PHI."
        verification_phase: B

# ───────────────────────────────────────────────────────────────────────────
# 5 · ARCHITECTURAL_VALIDATION
# ───────────────────────────────────────────────────────────────────────────
architectural_validation:
  adr_004_compliance: full
  gates:
    - "vitalia/backend/tests/architecture/test_response_model_required.py — toda ruta nueva response_model="
    - "vitalia/backend/tests/architecture/ DDD boundaries — offer no importa luana_core_offer_studio.domain directo (solo port)"
    - "vitalia/backend/tests/architecture/test_audit_log_sync_write.py — Case consent gate escribe audit_log"
    - "vitalia/frontend/src/__tests__/architecture/test_features_no_cross_imports.test.ts"
    - "vitalia/frontend/src/__tests__/architecture/test_react_query_keys_convention.test.ts"
    - "vitalia/frontend/src/__tests__/architecture/test_no_phi_in_url_params.test.ts"
    - "vitalia/frontend/src/__tests__/architecture/test_no_clerk_organizations.test.ts — tenant_id de useTenantId()"
    - "vitalia/frontend/src/__tests__/architecture/test_agent_subsubtabs_ssot.test.ts — AGENT_SUBSUBTABS['lisa.servicios']"
    - "core/luana-core-offer-studio/tests/test_catalogs_dag_smoke.py — EP-2 preset pack NO regresa engine catalog"
  new_arch_test_suggested:
    - "test_offer_no_engine_edit.py (shrink-only) — offer/ consume engine solo vía luana_core_platform.links.ports.offer"
  allowlist_policy: shrink-only

# ───────────────────────────────────────────────────────────────────────────
# technical_gates (opt-in por naturaleza · DoD §2)
# ───────────────────────────────────────────────────────────────────────────
technical_gates:
  baseline: [tsc, eslint, ruff, arch-fitness, vitest-unit, pytest-unit]
  mutation:
    enabled: true
    mode: hard
    diff_scoped: true     # 100% mutantes muertos sobre líneas NUEVAS
    surfaces:
      - "offer/domain/pricing_calc.py (3-charge derived calc)"
      - "offer/domain/completeness.py (26 must-have · is_active NUNCA bloqueado)"
      - "offer/api/decorators RBAC gate (RN-7)"
      - "offer/infrastructure/repositories tenant-isolation filter (RN-12)"
    degrade_advisory_if_tool_missing: true   # mutmut/Stryker ausente → advisory, no rompe ci-parity
  schemathesis:
    enabled: true
    note: "endpoints nuevos /api/v1/offer/servicios/*"
  hypothesis:
    enabled: false

# ───────────────────────────────────────────────────────────────────────────
# test_construction_plan (por naturaleza · TDD RED-first)
# ───────────────────────────────────────────────────────────────────────────
test_construction_plan:
  playwright_required: true
  creation_order:
    - "RED domain: pricing_calc + completeness (unit · mutation-critical)"
    - "RED infra: offer_ext_repository dual-tenant"
    - "RED application: catalog/biblioteca/link/proof services + keystone offer shape"
    - "RED api: RBAC 403 + cross-tenant 404 + response_model + consent gate"
    - "RED FE hooks: use-autosave (debounce + UNA indicator) + useServiciosQuery (MSW)"
    - "RED FE components: RungPicker(locked) + ModalidadPicker(discriminated) + VariantsRepeater + FichaCompletenessChip"
    - "RED e2e smoke: ruta /lisa/servicios"
    - "GREEN build per layer → visual goldens (8) → axe → live-verify"
  scenario_to_test:
    crear-plantilla: "e2e/shell-organism/lisa-servicios-crear.spec.ts"
    crear=editar: "e2e/shell-organism/lisa-servicios-crear.spec.ts"
    todo-autoguarda-sin-boton: "e2e/shell-organism/lisa-servicios-autosave.spec.ts"
    mover-entre-peldanos: "e2e/shell-organism/lisa-servicios-escalera-drag.spec.ts"
    keyboard-mover-peldano: "e2e/shell-organism/lisa-servicios-escalera-drag.spec.ts (a11y)"
    vincular-roster: "e2e/shell-organism/lisa-servicios-especialistas.spec.ts"
    servicio-activo-entra-conocimiento-adrian: "backend/tests/modules/vitalia/offer/test_keystone_offer_shape.py + live-verify"
    caso-sin-consent-bloquea: "backend/tests/modules/vitalia/offer/test_case_consent_gate.py"
  poms_required: [ServiciosCatalogoPage, ServicioWorkspacePage, EscaleraPage, NuevoServicioPage]
  fixtures_required: [auth.fixture (admin_clinic + doctor roles), seeded-tenant (biblioteca preset pack), base.ts anti-burbuja]

# playwright_visual_scope
playwright_visual_scope:
  story_scope_routes:
    - "/{tenantId}/lisa/servicios"
    - "/{tenantId}/lisa/servicios/catalogo"
    - "/{tenantId}/lisa/servicios/escalera"
    - "/{tenantId}/lisa/servicios/[offer-id]/*"
    - "/{tenantId}/lisa/servicios/nuevo"
  forbidden_visual_changes:
    - "vitalia/frontend/src/components/ui/** (Shadcn primitives)"
    - "core/@luana/ui-kit/src/** (lift-gate)"
    - "vitalia/frontend/src/components/shared/shell-organism/** (shell chrome shipped — solo CONSUME)"
    - "otras features/*"
  allowed_new_files:
    - "vitalia/frontend/src/components/shared/NumberWithUnit.tsx (NEW shared · no modifica existentes)"
    - "vitalia/frontend/src/lib/shell-routes.ts (AGENT_SUBSUBTABS append · no modifica entries existentes)"
  non_egoismo: "commit por pathspec (bucket code:offer FE+BE); no tocar scope de otras sesiones"

# regression_guard
regression_guard:
  - "core/luana-core-offer-studio engine catalog NO regresa (consume, no edita)"
  - "TenantKnowledgeBuilder consume sync NO regresa (D-1 wrapping)"
  - "shell-routes.ts AGENT_SUBSUBTABS existentes (lisa.marca, config.cuenta) intactos"

