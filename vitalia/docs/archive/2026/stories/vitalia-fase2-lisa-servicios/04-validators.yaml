story_id: vitalia-fase2-lisa-servicios
brand: vitalia
schema_version: v4.1
architecture_pattern: ADR-vitalia-004

# Naturaleza de la verificación (D-X4 · top-level · keyea los gates · definition-of-done-live-verify §1-6)
verification_nature: ambas       # FE = funcional (UI + reglas de negocio + demo) · BE/migrations/EP-2 = técnica
demo_required: true              # funcional → chris_verify.signoff en G (NO en F)
dev_app_verified:
  required: true                 # DoD #37 — ejercer acción real (writes) en dev-app vitalia + leer logs
  env: "make dev-app-vitalia → dev-app.vitalialat.com (Chrome DevTools MCP) o localhost:3002 fallback"

# ───────────────────────────────────────────────────────────────────────────
# 1 · NON_FUNCTIONAL
# ───────────────────────────────────────────────────────────────────────────
non_functional:
  performance:
    - id: NF-1
      desc: "Catálogo grande (300 servicios) pagina con cursor server-side (NO filtra en memoria)."
      scenario: "§1 Catálogo grande no carga todo al cliente"
      verification: e2e
  security:
    - id: NF-2
      desc: "Cross-tenant query bloqueada (404, no leak) · tenant-isolation TODA query."
      rn: [RN-12, RN-13]
      scenario: "§16 Query cross-tenant bloqueada"
      verification: [int, arch]
    - id: NF-3
      desc: "RBAC: admin_clinic+owner write; doctor/nurse/staff → 403."
      rn: [RN-7]
      scenario: "§1 RBAC read-only · §16 Staff no edita precio"
      verification: [int, e2e]
    - id: NF-4
      desc: "Case (foto paciente) requiere consent_signed=true (HIPAA-lite) + audit_log sync write."
      rn: [RN-33]
      scenario: "§10 Caso sin consentimiento se bloquea"
      verification: [int]
  resilience:
    - id: NF-5
      desc: "Servicio activo sin especialistas → UI avisa + agente degrada (responde, no matchea)."
      rn: [RN-9]
      scenario: "§8 Servicio activo sin especialistas"
      verification: [e2e, live]

# ───────────────────────────────────────────────────────────────────────────
# 2 · FUNCTIONAL — scenario_coverage (cada grupo Gherkin del spec · 16 grupos)
# ───────────────────────────────────────────────────────────────────────────
functional:
  scenario_coverage:
    - group: "§1 Catálogo (lista·búsqueda·filtros·RBAC·borrado)"
      scenarios: [catalogo-vacio-biblioteca, buscar-filtrar, activar-card, rbac-readonly, soft-delete, catalogo-grande-cursor]
      sub_categories: [empty, large, network]
    - group: "§2 Crear (picker inline·plantilla·personalizado·borrador)"
      scenarios: [crear-plantilla, typeahead-sinonimo, crear-personalizado, no-borrador-fantasma, volver-elegir, crear=editar]
      sub_categories: [empty]
    - group: "§3 Resumen · Identidad + herencia bloqueada (RN-30)"
      scenarios: [estandar-hereda-bloqueado, personalizado-pide-categoria-peldano, no-recategorizar-estandar, chip-origen-readonly]
      sub_categories: []
    - group: "§4 Resumen · Qué es + variantes (RN-8·RN-29)"
      scenarios: [descripcion-voz-marca, agregar-variante, quitar-variante, sin-variantes-precio-base, adrian-cotiza-variante]
      sub_categories: [empty]
    - group: "§5 Resumen · Modalidad y agenda (RN-28·31·32)"
      scenarios: [unica-sin-extra, sesiones-revela-paquete, recurrente-revela-cadencia, plantilla-sugiere-modalidad, sesiones-invalida-rechaza, richselect-descripcion, duracion-numerica-min]
      sub_categories: [empty, i18n]
    - group: "§6 Resumen · ficha paciente (procedimiento·riesgos·RN-26)"
      scenarios: [ficha-completa-editable, riesgos-curados-cita-textual]
      sub_categories: []
    - group: "§7 Para Adrián (argumentario·FAQ·objeciones·keywords·safety)"
      scenarios: [argumentario-completo, faq-objeciones-pares, keywords-match, contraindicaciones-frenan-agente]
      sub_categories: []
    - group: "§8 Especialistas (vincular·desvincular·sin-doctor·RN-9·AC-5)"
      scenarios: [vincular-roster, vincular-no-crea, ver-detalle-desvincular, activo-sin-especialistas]
      sub_categories: [empty]
    - group: "§9 Plan de pago (3 cobros·calculados·publicable·RN-6·RN-11)"
      scenarios: [tres-cobros-independientes, derivados-calculan-solos, no-publicable-agenda-valoracion, precio-rango, precio-negativo-rechaza, moneda-readonly-origen]
      sub_categories: []
    - group: "§10 Prueba social (manual·consentimiento·RN-33)"
      scenarios: [agregar-testimonio, quitar-testimonio, caso-requiere-consent, caso-sin-consent-bloquea]
      sub_categories: [empty]
    - group: "§11 Escalera (peldaños fijos·drag·a11y·RN-2·AC-3)"
      scenarios: [peldano-con-servicios, peldano-vacio-guia, mover-entre-peldanos, mover-estandar-fijo, keyboard-mover-peldano]
      sub_categories: [a11y, empty]
    - group: "§12 Autoguardado (RN-20)"
      scenarios: [todo-autoguarda-sin-boton, acciones-estado-vs-autosave]
      sub_categories: [network]
    - group: "§13 Tooltips + edición (RN-18·RN-23)"
      scenarios: [campos-no-obvios-tooltip, readonly-dice-donde-edita]
      sub_categories: []
    - group: "§14 Fuentes & conocimiento (autocompletar+RAG+guardas·RN-17/21/22)"
      scenarios:
        - { id: doc-autocompleta, verification_phase: A }       # extract one-shot (Sub-phase A)
        - { id: doc-queda-conocimiento-rag, verification_phase: B }   # indexado RAG (engine-lift)
        - { id: precio-nunca-del-documento, verification_phase: B }
        - { id: pregunta-clinica-escala-doctor, verification_phase: B }
        - { id: ingesta-scrub-phi, verification_phase: B }
      sub_categories: [adversarial]
    - group: "§15 KEYSTONE — agente conoce el catálogo (AC-6)"
      scenarios: [servicio-activo-entra-conocimiento-adrian]
      sub_categories: [keystone]
    - group: "§16 Adversarial transversal (tenant·RBAC·idioma·vertical)"
      scenarios: [cross-tenant-bloqueada, staff-no-edita, ui-espanol-neutro, misma-estructura-dental-estetica]
      sub_categories: [adversarial, i18n]

  # business_rules matrix (RN → @rule-tag → scenario · cada RN ≥1 happy + ≥1 negative/edge)
  business_rules:
    - { rn: RN-1, tag: "@RN-1", scenarios: [crear-plantilla, servicio-activo-entra-conocimiento-adrian], verification: [int, arch] }
    - { rn: RN-2, tag: "@RN-2", scenarios: [mover-entre-peldanos], verification: [unit, e2e] }
    - { rn: RN-3, tag: "@RN-3", scenarios: [precio-rango, moneda-readonly-origen], verification: [unit, e2e] }
    - { rn: RN-4, tag: "@RN-4", scenarios: [sesiones-revela-paquete], verification: [unit, e2e] }
    - { rn: RN-5-superseded-28, tag: "@RN-28", scenarios: [recurrente-revela-cadencia], verification: [unit] }
    - { rn: RN-6, tag: "@RN-6", scenarios: [tres-cobros-independientes, derivados-calculan-solos], verification: [unit, e2e], mutation_critical: true }
    - { rn: RN-7, tag: "@RN-7", scenarios: [rbac-readonly, staff-no-edita], verification: [int, e2e], mutation_critical: true }
    - { rn: RN-8, tag: "@RN-8", scenarios: [descripcion-voz-marca], verification: [int] }
    - { rn: RN-9, tag: "@RN-9", scenarios: [activo-sin-especialistas], verification: [e2e, live] }
    - { rn: RN-10, tag: "@RN-10", scenarios: [activar-card], verification: [e2e] }
    - { rn: RN-11, tag: "@RN-11", scenarios: [precio-negativo-rechaza], verification: [unit, int] }
    - { rn: RN-12, tag: "@RN-12", scenarios: [cross-tenant-bloqueada], verification: [int, arch], mutation_critical: true }
    - { rn: RN-13, tag: "@RN-13", scenarios: [cross-tenant-bloqueada], verification: [int, arch] }
    - { rn: RN-14, tag: "@RN-14", scenarios: [ui-espanol-neutro], verification: [arch, e2e] }
    - { rn: RN-15, tag: "@RN-15", scenarios: [buscar-filtrar, catalogo-grande-cursor], verification: [e2e] }
    - { rn: RN-16, tag: "@RN-16", scenarios: [crear=editar, no-borrador-fantasma, keywords-match], verification: [e2e, live] }
    - { rn: RN-17a, tag: "@RN-17", scenarios: [doc-autocompleta], verification: [int, live], verification_phase: A }
    - { rn: RN-17b, tag: "@RN-17", scenarios: [doc-queda-conocimiento-rag], verification: [int, live], verification_phase: B }
    - { rn: RN-18, tag: "@RN-18", scenarios: [campos-no-obvios-tooltip], verification: [e2e] }
    - { rn: RN-19, tag: "@RN-19", scenarios: [misma-estructura-dental-estetica], verification: [e2e] }
    - { rn: RN-20, tag: "@RN-20", scenarios: [todo-autoguarda-sin-boton, vincular-roster], verification: [e2e, live] }
    - { rn: RN-21, tag: "@RN-21", scenarios: [doc-autocompleta], verification: [e2e] }
    - { rn: RN-22, tag: "@RN-22", scenarios: [riesgos-curados-cita-textual, precio-nunca-del-documento, pregunta-clinica-escala-doctor, ingesta-scrub-phi], verification: [int, live, eval], verification_phase: B }
    - { rn: RN-23, tag: "@RN-23", scenarios: [chip-origen-readonly, readonly-dice-donde-edita, moneda-readonly-origen], verification: [e2e] }
    - { rn: RN-24, tag: "@RN-24", scenarios: [misma-estructura-dental-estetica], verification: [e2e] }
    - { rn: RN-25, tag: "@RN-25", scenarios: [crear-plantilla, typeahead-sinonimo], verification: [e2e, live] }
    - { rn: RN-26, tag: "@RN-26", scenarios: [ficha-completa-editable], verification: [e2e] }
    - { rn: RN-27, tag: "@RN-27", scenarios: [crear-personalizado], verification: [int] }
    - { rn: RN-28, tag: "@RN-28", scenarios: [unica-sin-extra, sesiones-revela-paquete, recurrente-revela-cadencia, plantilla-sugiere-modalidad], verification: [unit, e2e] }
    - { rn: RN-29, tag: "@RN-29", scenarios: [agregar-variante, quitar-variante, sin-variantes-precio-base, adrian-cotiza-variante], verification: [unit, e2e, live] }
    - { rn: RN-30, tag: "@RN-30", scenarios: [estandar-hereda-bloqueado, personalizado-pide-categoria-peldano, no-recategorizar-estandar, mover-estandar-fijo], verification: [e2e] }
    - { rn: RN-31, tag: "@RN-31", scenarios: [sesiones-invalida-rechaza, duracion-numerica-min], verification: [unit, e2e] }
