<!doctype html>
<html lang="es-419" data-mockup="shell-layout-web" data-version="v1">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Vitalia · F1-S4 · Shell Layout — modo web (rail 60px + 1fr)</title>
  <meta name="description" content="Mockup F1-S4 vitalia-fase1-shell-layout-5050: layout root del shell-organism en modo web (Valeria minimizada a rail 60px + AppPanel 1fr). Toggle modo placeholder en TopBar, dark mode, responsive < md drawer.">
  <script src="https://cdn.tailwindcss.com"></script>
  <style>
    /* === Tokens Vitalia (mismo schema que Design Contract §5.1) === */
    :root {
      --background: 0 0% 100%;
      --foreground: 240 10% 4%;
      --card: 0 0% 100%;
      --card-foreground: 240 10% 4%;
      --popover: 0 0% 100%;
      --popover-foreground: 240 10% 4%;
      --primary: 198 99% 49%;
      --primary-foreground: 0 0% 100%;
      --secondary: 240 5% 96%;
      --secondary-foreground: 240 6% 10%;
      --muted: 240 5% 96%;
      --muted-foreground: 240 4% 46%;
      --accent: 287 53% 37%;
      --accent-foreground: 0 0% 100%;
      --destructive: 0 84% 60%;
      --destructive-foreground: 0 0% 98%;
      --border: 240 6% 90%;
      --input: 240 6% 90%;
      --ring: 198 99% 49%;
      --radius: 0.625rem;
      --agent-lisa: 156 100% 41%;
      --agent-lisa-soft: 156 80% 92%;
      --agent-lucas: 0 0% 7%;
      --agent-lucas-soft: 0 0% 92%;
      --agent-adrian: 198 99% 49%;
      --agent-adrian-soft: 197 90% 89%;
      --agent-valeria: 287 53% 37%;
      --agent-valeria-soft: 287 53% 90%;
      --agent-camila: 244 84% 32%;
      --agent-camila-soft: 244 53% 92%;
      --agent-mateo: 53 99% 51%;
      --agent-config: 240 4% 46%;
    }
    .dark {
      --background: 240 10% 4%;
      --foreground: 0 0% 98%;
      --card: 240 8% 8%;
      --card-foreground: 0 0% 98%;
      --popover: 240 8% 8%;
      --popover-foreground: 0 0% 98%;
      --primary: 198 99% 49%;
      --primary-foreground: 240 10% 4%;
      --secondary: 240 4% 16%;
      --secondary-foreground: 0 0% 98%;
      --muted: 240 4% 16%;
      --muted-foreground: 240 5% 65%;
      --accent: 287 53% 50%;
      --accent-foreground: 0 0% 98%;
      --destructive: 0 63% 31%;
      --destructive-foreground: 0 0% 98%;
      --border: 240 4% 20%;
      --input: 240 4% 20%;
      --ring: 198 99% 49%;
      --agent-lisa-soft: 156 60% 15%;
      --agent-lucas-soft: 0 0% 20%;
      --agent-adrian-soft: 198 60% 20%;
      --agent-valeria-soft: 287 40% 25%;
      --agent-camila-soft: 244 50% 20%;
    }

    html, body { height: 100%; }
    body {
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
      background: hsl(var(--background));
      color: hsl(var(--foreground));
      overflow: hidden;
    }

    /* Skeleton helpers */
    .skel-block { background: hsl(var(--muted)); border-radius: var(--radius); opacity: 0.55; }
    .skel-line { background: hsl(var(--muted)); border-radius: 4px; opacity: 0.45; height: 8px; }
    .skel-circle { background: hsl(var(--muted)); border-radius: 9999px; opacity: 0.55; }

    .slot-label {
      position: absolute;
      top: 50%; left: 50%;
      transform: translate(-50%, -50%);
      font-size: 11px;
      letter-spacing: 0.04em;
      color: hsl(var(--muted-foreground));
      text-transform: uppercase;
      font-weight: 600;
      background: hsla(var(--background), 0.92);
      padding: 4px 10px;
      border-radius: var(--radius);
      border: 1px dashed hsl(var(--border));
      pointer-events: none;
      white-space: nowrap;
    }

    /* Modo web: NO resize (rail es fijo). Just the divider stays visible no-cursor */
    .static-divider {
      width: 1px;
      background: hsl(var(--border));
    }

    @media (max-width: 767px) {
      .static-divider { display: none; }
    }

    /* === LogoMark CSS-based swap (replaces JS toggle — F1-S2 contract) === */
    .logomark-light, .logomark-dark { display: none; }
    .logomark-mark { display: block; }
    @media (min-width: 640px) {
      .logomark-light { display: block; }
      .logomark-mark { display: none; }
    }
    .dark .logomark-light { display: none; }
    @media (min-width: 640px) {
      .dark .logomark-light { display: none; }
      .dark .logomark-dark { display: block; }
    }
  </style>
</head>
<body>

  <div class="flex h-screen flex-col overflow-hidden">

    <!-- ============= TopBarGlobal (48px) ============= -->
    <header class="flex items-center justify-between border-b border-[hsl(var(--border))] bg-[hsl(var(--card))] px-4" style="height:48px;">
      <!-- LogoMark (F1-S2 contract: size='md' variant='full' · CSS-based dark swap) -->
      <a href="#" aria-label="Vitalia inicio" class="flex items-center">
        <img src="./assets/vitalia-logo.png" alt="" class="logomark-light" style="height:32px;width:auto;">
        <img src="./assets/vitalia-logo-dark.png" alt="" class="logomark-dark" style="height:32px;width:auto;">
        <img src="./assets/vitalia-ico.png" alt="" class="logomark-mark" style="height:32px;width:32px;">
      </a>

      <div class="flex items-center gap-2">
        <!-- ★ Toggle modo — variante web activa (placeholder F1-S4) -->
        <button
          type="button"
          class="flex h-8 items-center gap-1.5 rounded-md border border-[hsl(var(--border))] bg-[hsl(var(--secondary))] px-2.5 text-xs font-medium text-[hsl(var(--muted-foreground))] opacity-70 cursor-not-allowed"
          title="Modo (agentic/web) — toggle se activa en F1-S5/S7"
          aria-label="Modo de shell: web activo"
          disabled>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="4" height="18" rx="1"/><rect x="11" y="3" width="10" height="18" rx="1"/></svg>
          <span>Web</span>
        </button>

        <button id="theme-toggle"
                type="button"
                class="flex h-8 w-8 items-center justify-center rounded-md hover:bg-[hsl(var(--secondary))]"
                title="Cambiar tema"
                aria-label="Cambiar tema (claro/oscuro)">
          <span class="theme-icon-light">🌙</span>
          <span class="theme-icon-dark hidden">☀️</span>
        </button>

        <button type="button"
                class="flex h-8 items-center gap-2 rounded-md border border-[hsl(var(--border))] px-2 text-sm hover:bg-[hsl(var(--secondary))]"
                aria-label="Clínica activa: Sonrisa Plena · Lima centro">
          <div class="flex h-6 w-6 items-center justify-center rounded-full text-white text-[10px] font-semibold" style="background:hsl(var(--accent));">SP</div>
          <span class="hidden sm:inline truncate max-w-[140px] text-[hsl(var(--foreground))]">Sonrisa Plena</span>
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="text-[hsl(var(--muted-foreground))]"><polyline points="6 9 12 15 18 9"/></svg>
        </button>
      </div>
    </header>

    <!-- ============= Main grid (modo web: 60px + 1fr — NO resize) ============= -->
    <main id="main-content"
          tabindex="-1"
          class="grid flex-1 overflow-hidden md:grid-cols-[60px_1px_1fr] grid-cols-1">

      <!-- ============= ValeriaSidebarSlot — RAIL 60px (fijo, modo web) ============= -->
      <aside id="valeria-slot"
             aria-label="Panel Valeria minimizado a rail (modo web · placeholder F1-S5)"
             class="relative flex h-full min-h-0 overflow-hidden border-r border-[hsl(var(--border))] bg-[hsl(var(--card))] md:border-r-0">
        <div class="hidden md:flex h-full w-full flex-col items-center gap-3 py-3">
          <!-- rail silhouette only — modo web: chat + history NO visibles, expand requires toggle a agentic -->
          <div class="skel-block" style="width:32px;height:32px;"></div>
          <div class="skel-block" style="width:32px;height:32px;"></div>
          <div class="skel-block" style="width:32px;height:32px;"></div>
          <div class="skel-line" style="width:32px;margin-top:8px;"></div>
          <div class="skel-block" style="width:32px;height:32px;"></div>
          <div class="skel-block" style="width:32px;height:32px;"></div>
          <div class="skel-block" style="width:32px;height:32px;"></div>
          <div class="flex-1"></div>
          <!-- expand-to-agentic button silhouette (último, bottom) -->
          <div class="skel-block" style="width:32px;height:32px;background:hsl(var(--primary));opacity:0.6;"></div>
        </div>
        <!-- Mobile -->
        <div class="md:hidden flex h-full w-full items-center justify-center">
          <div class="text-center">
            <div class="skel-circle mx-auto" style="width:48px;height:48px;"></div>
            <p class="mt-3 text-xs text-[hsl(var(--muted-foreground))]">Valeria — abrir desde burger menu</p>
          </div>
        </div>

        <span class="slot-label" style="font-size:9px;writing-mode:vertical-rl;transform:translate(-50%,-50%) rotate(180deg);padding:8px 4px;">Rail · F1-S5</span>
      </aside>

      <!-- ============= Static divider (no resize en modo web) ============= -->
      <div class="static-divider hidden md:block" aria-hidden="true"></div>

      <!-- ============= AppPanelSlot — 1fr (ocupa todo el resto) ============= -->
      <section id="app-slot"
               aria-label="Panel aplicación (placeholder — F1-S7/S8/S10 lo construirá)"
               class="relative flex h-full min-h-0 flex-col overflow-hidden bg-[hsl(var(--background))]">
        <!-- ribbon -->
        <div class="flex items-center gap-2 border-b border-[hsl(var(--border))] px-4" style="height:64px;">
          <div class="flex items-center gap-1.5"><div class="skel-circle" style="width:28px;height:28px;background:hsl(var(--agent-lisa-soft));"></div><div class="skel-line" style="width:50px;"></div></div>
          <div class="flex items-center gap-1.5"><div class="skel-circle" style="width:28px;height:28px;background:hsl(var(--agent-lucas-soft));"></div><div class="skel-line" style="width:50px;"></div></div>
          <div class="flex items-center gap-1.5"><div class="skel-circle" style="width:28px;height:28px;background:hsl(var(--agent-adrian-soft));"></div><div class="skel-line" style="width:50px;"></div></div>
          <div class="flex items-center gap-1.5"><div class="skel-circle" style="width:28px;height:28px;background:hsl(var(--agent-valeria-soft));"></div><div class="skel-line" style="width:50px;"></div></div>
          <div class="flex items-center gap-1.5"><div class="skel-circle" style="width:28px;height:28px;background:hsl(var(--agent-camila-soft));"></div><div class="skel-line" style="width:50px;"></div></div>
          <div class="ml-auto flex items-center gap-1.5"><div class="skel-block" style="width:28px;height:28px;"></div><div class="skel-line" style="width:60px;"></div></div>
        </div>
        <div class="flex items-center gap-3 border-b border-[hsl(var(--border))] px-4" style="height:40px;">
          <div class="skel-line" style="width:62px;"></div>
          <div class="skel-line" style="width:80px;"></div>
          <div class="skel-line" style="width:54px;"></div>
          <div class="skel-line" style="width:70px;"></div>
          <div class="skel-line" style="width:90px;"></div>
        </div>
        <div class="flex-1 min-h-0 p-6 overflow-hidden flex flex-col gap-4">
          <div class="skel-line" style="width:42%;height:14px;"></div>
          <div class="skel-line" style="width:78%;"></div>
          <div class="skel-line" style="width:60%;"></div>
          <!-- Modo web: AppPanel tiene más espacio → grid 3 cols en lugar de 2 -->
          <div class="grid grid-cols-3 gap-3 mt-4">
            <div class="skel-block" style="height:120px;"></div>
            <div class="skel-block" style="height:120px;"></div>
            <div class="skel-block" style="height:120px;"></div>
            <div class="skel-block" style="height:120px;"></div>
            <div class="skel-block" style="height:120px;"></div>
            <div class="skel-block" style="height:120px;"></div>
          </div>
        </div>

        <span class="slot-label">AppPanelSlot · F1-S7 / S8 / S10</span>
      </section>
    </main>

    <!-- ============= Devtools status bar (mockup only) ============= -->
    <footer class="border-t border-[hsl(var(--border))] bg-[hsl(var(--card))] px-4 py-1.5 text-[10px] text-[hsl(var(--muted-foreground))] flex items-center justify-between" style="font-family:'JetBrains Mono', monospace;">
      <div>
        <span class="font-semibold text-[hsl(var(--foreground))]">F1-S4 · modo web</span>
        <span class="mx-2">·</span>
        <span>Tokens Vitalia (Design Contract §5.1)</span>
        <span class="mx-2">·</span>
        <span>shellMode: <span class="font-semibold text-[hsl(var(--primary))]">web</span></span>
        <span class="mx-2">·</span>
        <span>grid: <span class="font-semibold text-[hsl(var(--primary))]">60px · 1fr</span></span>
      </div>
      <div>
        <span>rail fijo · sin resize · md breakpoint 768px</span>
      </div>
    </footer>
  </div>

  <script>
    // === Theme toggle ===
    (function () {
      const root = document.documentElement;
      const stored = localStorage.getItem('vitalia-theme');
      if (stored === 'dark' || (stored !== 'light' && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
        root.classList.add('dark');
        document.querySelector('.theme-icon-light')?.classList.add('hidden');
        document.querySelector('.theme-icon-dark')?.classList.remove('hidden');
      }
      // Logo swap es 100% CSS (.logomark-* + .dark selector) — sin JS race.
      document.getElementById('theme-toggle').addEventListener('click', () => {
        const dark = root.classList.toggle('dark');
        localStorage.setItem('vitalia-theme', dark ? 'dark' : 'light');
        document.querySelector('.theme-icon-light').classList.toggle('hidden', dark);
        document.querySelector('.theme-icon-dark').classList.toggle('hidden', !dark);
      });
    })();
  </script>
</body>
</html>
