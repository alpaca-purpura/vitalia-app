      command: "cd vitalia/frontend && E2E_BASE_URL=http://localhost:3002 npx playwright test --project=visual shell-organism/valeria-chat-visual.spec.ts --grep 'populated dark 1280'"
      must_pass: true
      snapshot_path: "vitalia/frontend/e2e/shell-organism/valeria-chat-visual.spec.ts-snapshots/valeria-chat-populated-dark-1280x800.png"
      mockup_ref: "vitalia/docs/product/stories/vitalia-fase1-valeria-chat-skeleton/mockups/valeria-chat-sample.html"

    - id: val-fe-visual-empty-light
      description: "Visual golden vs mockup valeria-chat-sample.html (variante B empty state, light) @ 1280x800"
      command: "cd vitalia/frontend && E2E_BASE_URL=http://localhost:3002 npx playwright test --project=visual shell-organism/valeria-chat-visual.spec.ts --grep 'empty light 1280'"
      must_pass: true
      snapshot_path: "vitalia/frontend/e2e/shell-organism/valeria-chat-visual.spec.ts-snapshots/valeria-chat-empty-light-1280x800.png"
      mockup_ref: "vitalia/docs/product/stories/vitalia-fase1-valeria-chat-skeleton/mockups/valeria-chat-sample.html"

    - id: val-fe-visual-empty-dark
      description: "Visual golden vs mockup valeria-chat-sample.html (variante B, dark) @ 1280x800"
      command: "cd vitalia/frontend && E2E_BASE_URL=http://localhost:3002 npx playwright test --project=visual shell-organism/valeria-chat-visual.spec.ts --grep 'empty dark 1280'"
      must_pass: true
      snapshot_path: "vitalia/frontend/e2e/shell-organism/valeria-chat-visual.spec.ts-snapshots/valeria-chat-empty-dark-1280x800.png"
      mockup_ref: "vitalia/docs/product/stories/vitalia-fase1-valeria-chat-skeleton/mockups/valeria-chat-sample.html"

  # ════════════════════════════════════════════════════════════════════
  # § 4 — AGENTIC EVAL (N/A — FE only chrome UI sin LangGraph/specialist/LLM real)
  # ════════════════════════════════════════════════════════════════════
  agentic_eval:
    applies: false
    not_applicable_reason: "FE only chrome UI story (shell-organism chat skeleton). NO LangGraph state, NO specialist node, NO LLM call, NO goldens, NO sales_agent wire real (mock setTimeout). Sales_agent + Copilot brand extensions out-of-scope F1-S6. F2-S11 (camila-voz) y F2 wire sales_agent introducirán agentic_eval + goldens cuando wire real WebSocket."

