# ════════════════════════════════════════════════════════════════════
# Pre-build environment requirements (informacional — no validator)
# ════════════════════════════════════════════════════════════════════
preflight:
  notes: |
    - Dev stack vitalia must be running for E2E specs: `make dev-vitalia` (ports backend 8002, frontend 3002).
    - Playwright preflight: `bash scripts/e2e-preflight.sh` (verifica dev stack + Clerk auth state).
    - Public route /test-stack/shell-layout sigue siendo el entry point E2E (sin Clerk gate, heredado F1-S5).
    - Visual goldens iter 1 generation: builder T-9 monta mockup en
      `python3 -m http.server 8888 vitalia/docs/product/stories/vitalia-fase1-valeria-chat-skeleton/mockups/`
      side-by-side con componente real `localhost:3002/test-stack/shell-layout` (con seed chatStore populated / empty toggled).
      Solo cuando Chris valida side-by-side OK (4 estados visuales: populated/empty × light/dark), builder corre:
      `cd vitalia/frontend && E2E_BASE_URL=http://localhost:3002 npx playwright test --project=visual --update-snapshots shell-organism/valeria-chat-visual.spec.ts`
      Post-ratify Chris, ratchet shrink-only enforced.
    - chatStore seed determinism: addInitScript pre-nav setting `window.__chatStoreSeed__` (MOCK_MESSAGES o []). chat-store reads this on initial state si presente; fallback a default MOCK_MESSAGES.
    - 4 PNG snapshots: 2 states (populated/empty) × 2 themes (light/dark).
    - Time mocking en Playwright E2E NO disponible directo; SC-2 (send) verifica via wait + assertion (no fake timers). Vitest unit usa vi.useFakeTimers para sendMessage 800ms.
    - XSS spec: usar `page.on('dialog', ...)` listener para verificar NO alert disparada + DOM textContent inspection.
