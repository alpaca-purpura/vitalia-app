# F1-S5 vitalia-fase1-valeria-rail-history — validators (5 categorías ★ v4.1)
#
# Each validator: must_pass=true unless explicitly marked. Comando shell EJECUTABLE.
# ZERO Opus en build (FE no-agentic puro). R23 NO aplica.
#
# Categorías v4.1:
#   1. non_functional      — tsc, lint, prettier, vitest unit + coverage
#   2. functional          — E2E Playwright (1 spec per Gherkin scenario, 9 scenarios mapeados 1:1)
#   3. visual              — Playwright visual goldens (7 logical states × theme = 13 PNGs)
#   4. agentic_eval        — N/A (declarar razón explícita)
#   5. architectural_validation — FSD-Lite boundaries + arch tests heredados extend + 1 arch test NEW invariant + spanish neutro + no-hex grep

story_id: vitalia-fase1-valeria-rail-history
brand: vitalia
phase: fase-1
last_modified: 2026-05-24
architect_iter: 1
playwright_required: true   # ui-story HARD per v4.1

scenario_coverage:
  total_scenarios: 9
  mapped: 9
  coverage_pct: 100
  scenarios:
    - id: SC-1
      title: "happy · keyboard cycle de estados (r/f/c/Esc/r) + auto-coupling shellMode + persistencia"
      validator_ids: [val-fe-e2e-keyboard-cycle, val-fe-visual-rail-light, val-fe-visual-rail-dark, val-fe-visual-full-light, val-fe-visual-full-dark, val-fe-visual-collapsed-light, val-fe-visual-collapsed-dark]
    - id: SC-2
      title: "negative · typing en composer NO dispara shortcuts (input focus guard)"
      validator_ids: [val-fe-e2e-typing-guard]
    - id: SC-3
      title: "edge · IME composition (e.isComposing) skip shortcuts"
      validator_ids: [val-fe-e2e-ime-composition]
    - id: SC-4
      title: "adversarial · shell-store tampering devtools setState invalid → fallback gracefully"
      validator_ids: [val-fe-e2e-store-tampering]
    - id: SC-5
      title: "edge · click rail PanelLeftClose mientras shellMode='agentic' → collapsed+web"
      validator_ids: [val-fe-e2e-click-collapse]
    - id: SC-6
      title: "empty_state · búsqueda sin resultados → EmptyStateInline + grupos hidden"
      validator_ids: [val-fe-e2e-history-empty-search, val-fe-visual-history-empty-light, val-fe-visual-history-empty-dark]
    - id: SC-7
      title: "accessibility · keyboard navigation completo + aria + axe wcag2aa light+dark"
      validator_ids: [val-fe-e2e-a11y-keyboard, val-fe-axe]
    - id: SC-8
      title: "accessibility · mobile drawer aria-modal + focus trap + restoration"
      validator_ids: [val-fe-e2e-a11y-mobile-drawer, val-fe-axe-mobile, val-fe-visual-drawer-mobile]
    - id: SC-9
      title: "i18n · Spanish neutro LatAm rendered (28 strings ratificados) + cero PHI"
      validator_ids: [val-fe-e2e-i18n-spanish-neutro]

sub_categories_coverage:
  race_condition:
    applies: false
    not_applicable_reason: "Story no crea/edita recursos persistentes con unique constraint. Mock data es read-only hardcoded import; valeriaState transitions son setState local sin DB."
  concurrent_users:
    applies: false
    not_applicable_reason: "Shell chrome per-user (zustand local + localStorage). No comparte estado entre tenants/users."
  network_failure:
    applies: false
    not_applicable_reason: "F1-S5 no realiza fetch API alguno. Mock conversaciones son import estático desde _mock-conversations.ts. F1-S6+ introducen WebSocket/HTTP — sus scenarios cubrirán network_failure."
  large_dataset:
    applies: false
    not_applicable_reason: "Mock data = 8 items hardcoded. Pagination/virtualization queda para Fase 2 cuando se conecte API real (out-of-scope F1-S5)."
  empty_state:
    applies: true
    covered_by: [val-fe-e2e-history-empty-search, val-fe-visual-history-empty-light, val-fe-visual-history-empty-dark]
  accessibility:
    applies: true
    covered_by: [val-fe-e2e-a11y-keyboard, val-fe-axe, val-fe-e2e-a11y-mobile-drawer, val-fe-axe-mobile]
  i18n:
    applies: true
    covered_by: [val-fe-e2e-i18n-spanish-neutro]

iteration:
  max_iterations: 10
  on_fail: "fix targeted file (single file edit per iter, no scope creep beyond § 5 files_in_scope of 05-guidelines.md)"
  cap_reached_action: "escalate Chris with T-{n}-impl-log.md cap_reached summary; do NOT auto-disable any validator"

test_construction_plan:
  playwright_required: true
  creation_order:
    - "T-1: hooks/__tests__/useKeyboardShortcuts.test.ts (RED) → hooks/useKeyboardShortcuts.ts (GREEN). Foundation, no deps."
    - "T-2: _mock-conversations.ts (data + types, no dedicated test — pure data, consumer types verify via T-3/T-4)"
    - "T-3: ValeriaRail.test.tsx + ValeriaChatSlot.test.tsx (RED) → ValeriaRail.tsx + ValeriaChatSlot.tsx + HistoryItem.tsx + HistoryGroup.tsx + EmptyStateInline.tsx (GREEN). Átomos+moléculas low-level."
    - "T-4: ValeriaHistory.test.tsx (RED) → ValeriaHistory.tsx (GREEN). Consume T-2 + T-3."
    - "T-5: ValeriaSidebar.test.tsx (RED) → ValeriaSidebar.tsx (GREEN). Consume T-1 + T-3 + T-4 + useShellStore."
    - "T-6: TopBarGlobal.test.tsx update assertions (RED) → TopBarGlobal.tsx add hamburger button (GREEN). Independent MODIFY parallelizable con T-3..T-5."
    - "T-7: ShellOrganismLayout.test.tsx update assertions (RED) + test-shell-store-schema-readonly-f1-s5.test.ts (RED) → ShellOrganismLayoutClient.tsx MODIFY + DELETE ValeriaSidebarSlot{,.test}.tsx + extend arch tests allowlists (GREEN). Integration."
    - "T-8: Playwright POM ValeriaSidebarPage + 9 functional specs + visual-goldens.spec.ts + 13 PNG snapshots (--update-snapshots iter 1 post Chris ratify side-by-side)."
  scenario_to_test:
    SC-1: "vitalia/frontend/e2e/regression/vitalia-fase1-valeria-rail-history/keyboard-cycle.spec.ts"
    SC-2: "vitalia/frontend/e2e/regression/vitalia-fase1-valeria-rail-history/typing-guard.spec.ts"
    SC-3: "vitalia/frontend/e2e/regression/vitalia-fase1-valeria-rail-history/ime-composition.spec.ts"
    SC-4: "vitalia/frontend/e2e/regression/vitalia-fase1-valeria-rail-history/store-tampering.spec.ts"
    SC-5: "vitalia/frontend/e2e/regression/vitalia-fase1-valeria-rail-history/click-collapse.spec.ts"
    SC-6: "vitalia/frontend/e2e/regression/vitalia-fase1-valeria-rail-history/history-empty-search.spec.ts"
    SC-7: "vitalia/frontend/e2e/regression/vitalia-fase1-valeria-rail-history/a11y-keyboard.spec.ts"
    SC-8: "vitalia/frontend/e2e/regression/vitalia-fase1-valeria-rail-history/a11y-mobile-drawer.spec.ts"
    SC-9: "vitalia/frontend/e2e/regression/vitalia-fase1-valeria-rail-history/i18n-spanish-neutro.spec.ts"
  poms_required:
    - path: "vitalia/frontend/e2e/pages/ValeriaSidebarPage.ts"
      methods:
        - gotoShell
        - setValeriaStateViaStore
        - setShellModeViaStore
        - getAriaSidebar
        - getRailButton
        - pressKey
        - typeInSearch
        - clickHamburger
        - clickBackdrop
        - getLiveRegionText
        - getActiveHistoryItemTitle
        - getHistoryGroupLabels
        - getEmptyStateNode
        - setViewport
  fixtures_required:
    - path: "vitalia/frontend/e2e/fixtures/shell-theme.fixture.ts"
      action: "REUSE F1-S4 + extend addInitScript helpers para vitalia-shell-state con valeriaState/shellMode initial set per spec"
    - path: "vitalia/frontend/e2e/fixtures/clerk-auth.fixture.ts"
      action: "REUSE F1-S3 — public route /test-stack/shell-layout bypassa Clerk gate"

architectural_validation:
  sub_tests:
    - id: arch-fsd-imports
      description: "FSD-Lite: shell-organism components NO importan de features/*. NEW files (Valeria*, History*, EmptyStateInline, useKeyboardShortcuts) verificados."
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test_fsd_boundaries.test.ts"
      must_pass: true
    - id: arch-no-cross-brand-shell-mirror
      description: "Grep nicolify/comunify/lupulo for shell-organism artifacts (extend NEW names — must be 0 matches each)"
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test-no-cross-brand-shell-mirror.test.ts"
      must_pass: true
      file_modify: "vitalia/frontend/src/__tests__/architecture/test-no-cross-brand-shell-mirror.test.ts"
      extend_names:
        - ValeriaSidebar
        - ValeriaRail
        - ValeriaHistory
        - ValeriaChatSlot
        - HistoryItem
        - HistoryGroup
        - EmptyStateInline
        - useKeyboardShortcuts
    - id: arch-shell-store-schema-readonly
      description: "NEW invariant: F1-S5 NO modifica shell-store.ts schema (regression guard). Verifies exports + defaults + setters."
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test-shell-store-schema-readonly-f1-s5.test.ts"
      must_pass: true
      file_new: "vitalia/frontend/src/__tests__/architecture/test-shell-store-schema-readonly-f1-s5.test.ts"
    - id: arch-server-first
      description: "'use client' allowlist extend NEW client components — shrink only (justify in commit body)"
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test_server_first.test.ts"
      must_pass: true
      file_modify: "vitalia/frontend/src/__tests__/architecture/test_server_first.test.ts"
    - id: arch-no-hex-colors
      description: "NEW files NO contienen hex literals (#01b2f8, etc) — tokens semánticos ONLY"
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test_no_hardcoded_colors.test.ts"
      must_pass: true
    - id: arch-no-voseo
      description: "NEW components + microcopy validated against voseo glossary (.claude/rules/spanish-text.md)"
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test-vitalia-ui-strings-no-voseo.test.ts"
      must_pass: true
    - id: arch-skip-link-target
      description: "Skip-link target invariant — <main id='main-content' tabIndex={-1}> in ShellOrganismLayoutClient NO afectado por F1-S5 MODIFY"
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test-skip-link-target.test.ts"
      must_pass: true
    - id: arch-no-default-export
      description: "Ratchet heredado: NEW files use named exports (no default export)"
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test_server_first.test.ts"
      must_pass: true

# ════════════════════════════════════════════════════════════════════
# § 1 — NON-FUNCTIONAL
# ════════════════════════════════════════════════════════════════════
validators:
  non_functional:

    - id: val-fe-tsc
      description: "TypeScript strict (no any, no implicit, FSD boundaries respect, React 19 types ok)"
      command: "cd vitalia/frontend && npx tsc --noEmit"
      must_pass: true

    - id: val-fe-lint
      description: "ESLint cache scoped a archivos F1-S5 + shell-organism + hooks + arch tests"
      command: "cd vitalia/frontend && npx eslint src/components/shared/shell-organism src/hooks src/__tests__/architecture --cache --cache-location .eslintcache"
      must_pass: true

    - id: val-fe-prettier
      description: "Prettier format check on new + modified files"
      command: "cd vitalia/frontend && npx prettier --check 'src/components/shared/shell-organism/{Valeria,History,EmptyStateInline}*.tsx' 'src/components/shared/shell-organism/_mock-conversations.ts' 'src/hooks/useKeyboardShortcuts.ts' 'src/components/shared/shell-organism/{ShellOrganismLayoutClient,TopBarGlobal,ShellOrganismLayout}*.{ts,tsx}'"
      must_pass: true

    - id: val-fe-jscpd
      description: "jscpd: zero new copy-paste blocks shell-organism (threshold heredado)"
      command: "cd vitalia/frontend && npx jscpd src/components/shared/shell-organism --threshold 0 --silent || echo 'jscpd warning informational only'"
      must_pass: false  # informational only, no block
      
    - id: val-fe-vitest-unit
      description: "Vitest unit: hook + Valeria* + History* + EmptyStateInline + arch tests new + TopBarGlobal extended + ShellOrganismLayout modified + coverage threshold 20%"
      command: "cd vitalia/frontend && npx vitest run src/components/shared/shell-organism src/hooks src/__tests__/architecture --reporter=default --coverage --coverage.thresholds.lines=20 --coverage.thresholds.functions=20"
      must_pass: true

  # ════════════════════════════════════════════════════════════════════
  # § 2 — FUNCTIONAL (E2E Playwright per scenario, 9 specs 1:1)
  # ════════════════════════════════════════════════════════════════════
  functional:

    - id: val-fe-e2e-keyboard-cycle
