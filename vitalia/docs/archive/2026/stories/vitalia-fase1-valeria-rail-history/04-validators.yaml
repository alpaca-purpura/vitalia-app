    not_applicable_reason: "FE only chrome UI story (shell organism). NO LangGraph state, NO specialist node, NO LLM call, NO goldens. Sales_agent + Copilot brand extensions out-of-scope F1-S5 (F1-S6+ introducirá chat skeleton sin LLM real; F2 conectará agentic real)."

  # ════════════════════════════════════════════════════════════════════
  # § 5 — ARCHITECTURAL VALIDATION (FSD + shell-store invariant + no-cross-brand + spanish + skip-link)
  # ════════════════════════════════════════════════════════════════════
  architectural_validation:

    - id: val-fe-arch-fsd
      description: "FSD-Lite boundaries — NEW shell-organism components NO importan features/*"
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test_fsd_boundaries.test.ts"
      must_pass: true

    - id: val-fe-arch-no-cross-brand-mirror
      description: "Cross-brand mirror guard — extend NEW component names (anti-duplication.md cardinal rule)"
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test-no-cross-brand-shell-mirror.test.ts"
      must_pass: true

    - id: val-fe-arch-shell-store-readonly
      description: "NEW invariant: F1-S5 NO modifica shell-store.ts schema (regression guard)"
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test-shell-store-schema-readonly-f1-s5.test.ts"
      must_pass: true

    - id: val-fe-arch-server-first
      description: "'use client' allowlist extend (shrink only — justify in commit body)"
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test_server_first.test.ts"
      must_pass: true

    - id: val-fe-arch-no-hex
      description: "NEW files NO contienen hex literals — tokens semánticos ONLY"
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test_no_hardcoded_colors.test.ts"
      must_pass: true

    - id: val-fe-arch-no-voseo
      description: "NEW components microcopy validated against Spanish neutro glossary"
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test-vitalia-ui-strings-no-voseo.test.ts"
      must_pass: true

    - id: val-fe-arch-skip-link
      description: "Skip-link target invariant preservado (F1-S4 cementado, F1-S5 NO afecta)"
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test-skip-link-target.test.ts"
      must_pass: true

