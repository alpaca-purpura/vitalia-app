      command: "cd vitalia/frontend && E2E_BASE_URL=http://localhost:3002 npx playwright test regression/vitalia-fase1-valeria-rail-history/keyboard-cycle.spec.ts"
      must_pass: true
      scenario_id: SC-1

    - id: val-fe-e2e-typing-guard
      description: "SC-2 negative · typing 'COMPRAR' en composer NO dispara shortcuts c/r — letras escritas normalmente"
      command: "cd vitalia/frontend && E2E_BASE_URL=http://localhost:3002 npx playwright test regression/vitalia-fase1-valeria-rail-history/typing-guard.spec.ts"
      must_pass: true
      scenario_id: SC-2

    - id: val-fe-e2e-ime-composition
