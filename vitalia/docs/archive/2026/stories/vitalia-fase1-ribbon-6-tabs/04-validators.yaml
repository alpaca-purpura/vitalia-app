# F1-S7 vitalia-fase1-ribbon-6-tabs — validators (5 categorías ★ v4.1)
#
# Each validator: must_pass=true unless explicitly marked. Comando shell EJECUTABLE.
# ZERO Opus en build (FE no-agentic puro). R23 NO aplica.
#
# Categorías v4.1:
#   1. non_functional       — tsc, lint, prettier, vitest unit + coverage
#   2. functional           — E2E Playwright (1 spec per Gherkin scenario funcional, 9 specs)
#   3. visual               — Playwright visual goldens (11 PNGs mockup ratchet shrink-only)
#   4. agentic_eval         — N/A (declarar razón explícita)
#   5. architectural_validation — FSD-Lite + arch tests extend + 1 arch test NEW + spanish neutro + no-hex grep + no-Shadcn-Tabs invariant

story_id: vitalia-fase1-ribbon-6-tabs
brand: vitalia
phase: fase-1
last_modified: 2026-05-25
architect_iter: 1
playwright_required: true   # ui-story HARD per v4.1

scenario_coverage:
  total_scenarios: 9
  mapped: 9
  coverage_pct: 100
  scenarios:
    - id: SC-1
      title: "happy · click tab agente navega a default subtab"
      validator_ids: [val-fe-e2e-nav, val-fe-visual-active-lucas]
    - id: SC-2
      title: "happy · URL deep link marca active state correcto"
      validator_ids: [val-fe-e2e-deeplink, val-fe-visual-active-camila]
    - id: SC-3
      title: "happy · ConfigTab navega a /{tenantId}/config/cuenta"
      validator_ids: [val-fe-e2e-config-nav, val-fe-visual-active-config]
    - id: SC-4
      title: "negative · URL con agent slug inválido → idle state"
      validator_ids: [val-fe-e2e-invalid-agent, val-fe-visual-idle]
    - id: SC-5
      title: "edge · viewport mobile 375px → horizontal scroll"
      validator_ids: [val-fe-e2e-mobile, val-fe-visual-mobile-375]
    - id: SC-6
      title: "adversarial · prompt injection en path (XSS) → safe"
      validator_ids: [val-fe-e2e-xss]
    - id: SC-7
      title: "a11y · keyboard navigation WAI-ARIA tablist completo"
      validator_ids: [val-fe-e2e-keyboard, val-fe-axe, val-fe-visual-keyboard-focus]
    - id: SC-8
      title: "i18n · microcopy Spanish neutro renderizado correcto"
      validator_ids: [val-fe-e2e-i18n]
    - id: SC-9
      title: "edge · avatar PNG falla → fallback initial"
      validator_ids: [val-fe-e2e-avatar-fallback]

sub_categories_coverage:
  race_condition:
    applies: false
    not_applicable_reason: "Ribbon es UI nav puro: sin create/update, sin unique constraint. router.push es idempotente. Sin DB writes ni concurrent state mutation."
  concurrent_users:
    applies: false
    not_applicable_reason: "Sin list/detail filterable, sin shared state cross-user. Cada user tiene su URL propia client-side derived."
  network_failure:
    applies: false
    not_applicable_reason: "Ribbon NO hace fetch FE — solo router.push (next-routing local). Único network dependency es PNG avatar load, cubierto por SC-9 fallback."
  large_dataset:
    applies: false
    not_applicable_reason: "5 tabs fijos + ConfigTab. Sin pagination, sin lista dinámica."
  empty_state:
    applies: false
    not_applicable_reason: "Ribbon es lista estática de 5 tabs + ConfigTab — siempre populated. SC-4 cubre el edge case 'active=null' (URL inválido) que es el equivalente conceptual de 'sin tab activo'."
  accessibility:
    applies: true
    covered_by: [val-fe-e2e-keyboard, val-fe-axe, val-fe-visual-keyboard-focus]
  i18n:
    applies: true
    covered_by: [val-fe-e2e-i18n]

iteration:
  max_iterations: 10
  on_fail: "fix targeted file (single file edit per iter, no scope creep beyond § 5 files_in_scope of 05-guidelines.md)"
  cap_reached_action: "escalate Chris with T-{n}-impl-log.md cap_reached summary; do NOT auto-disable any validator"

