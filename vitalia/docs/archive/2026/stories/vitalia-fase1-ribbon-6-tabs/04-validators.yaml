    - "T-2: RibbonTab.test.tsx + ConfigTab.test.tsx (RED) → RibbonTab.tsx + ConfigTab.tsx (GREEN). Moléculas low-level. Consume T-1 catalog."
    - "T-3: Ribbon.test.tsx (RED) → Ribbon.tsx (GREEN). Organism root con roving tabindex + URL active extraction + navigateTo handler. Consume T-2."
    - "T-4: AppPanelSlot.test.tsx extend (RED) → AppPanelSlot.tsx MODIFY (GREEN). Integration swap skeleton ribbon → <Ribbon /> real. Arch test test-ribbon-no-shadcn-tabs.test.ts NEW. Extend test-no-cross-brand-shell-mirror.test.ts (NEW names: Ribbon/RibbonTab/ConfigTab/extractAgentFromPath/AGENT_RIBBON_ORDER). Extend test_server_first.test.ts allowlist con NEW client components."
