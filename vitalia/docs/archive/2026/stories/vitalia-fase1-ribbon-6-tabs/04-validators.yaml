architectural_validation:
  sub_tests:
    - id: arch-fsd-imports
      description: "FSD-Lite: shell-organism + lib components NO importan de features/*. NEW files verificados."
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test_fsd_boundaries.test.ts"
      must_pass: true
    - id: arch-no-cross-brand-shell-mirror
      description: "Cross-brand mirror guard — extend NEW component names (Ribbon, RibbonTab, ConfigTab, extractAgentFromPath, AGENT_RIBBON_ORDER) → 0 matches each en nicolify/comunify/lupulo"
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test-no-cross-brand-shell-mirror.test.ts"
      must_pass: true
      file_modify: "vitalia/frontend/src/__tests__/architecture/test-no-cross-brand-shell-mirror.test.ts"
      extend_names:
        - Ribbon
        - RibbonTab
        - ConfigTab
        - extractAgentFromPath
        - AGENT_RIBBON_ORDER
    - id: arch-shell-store-readonly-heredado
      description: "INVARIANT heredado F1-S5: shell-store.ts NO modificado por F1-S7 (Ribbon es stateless derive URL)"
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test-shell-store-schema-readonly-f1-s5.test.ts"
      must_pass: true
    - id: arch-agent-catalog-ssot-heredado
      description: "INVARIANT heredado F1-S6: agent-catalog.ts es SSoT 6 agentes. F1-S7 EXTEND in-place (no hex/thumbnail nuevos)"
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test-agent-catalog-ssot.test.ts"
      must_pass: true
    - id: arch-ribbon-no-shadcn-tabs
      description: "NEW invariant: Ribbon/RibbonTab/ConfigTab NO importan @/components/ui/tabs (Radix-based — incompatible con route-based nav)"
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test-ribbon-no-shadcn-tabs.test.ts"
      must_pass: true
      file_new: "vitalia/frontend/src/__tests__/architecture/test-ribbon-no-shadcn-tabs.test.ts"
    - id: arch-server-first
      description: "'use client' allowlist extend NEW client components (Ribbon, RibbonTab, ConfigTab) — shrink-only (justify in commit body)"
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test_server_first.test.ts"
      must_pass: true
      file_modify: "vitalia/frontend/src/__tests__/architecture/test_server_first.test.ts"
    - id: arch-no-hex-colors
      description: "NEW files NO contienen hex literals — tokens semánticos ONLY (agent-catalog.ts ya en KNOWN_HARDCODES allowlist heredado F1-S6)"
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test_no_hardcoded_colors.test.ts"
      must_pass: true
    - id: arch-no-vt-classes
      description: "NEW files NO contienen .vt-* legacy utility classes"
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test-no-vt-classes-in-new-features.test.ts"
      must_pass: true
    - id: arch-no-voseo
      description: "NEW components + microcopy validated against voseo glossary — verifica Spanish neutro verbatim (Mi Clínica, Atraer, Vender, Operar, Mantener, Configurar, Agentes, role labels)"
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test-vitalia-ui-strings-no-voseo.test.ts"
      must_pass: true
    - id: arch-skip-link-target
      description: "Skip-link target invariant heredado F1-S5 — F1-S7 NO afecta <main id='main-content'>"
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test-skip-link-target.test.ts"
      must_pass: true

# ════════════════════════════════════════════════════════════════════
# § 1 — NON-FUNCTIONAL
# ════════════════════════════════════════════════════════════════════
validators:
  non_functional:

    - id: val-fe-tsc
      description: "TypeScript strict (no any, no implicit, FSD boundaries respect, React 19 types ok)"
      command: "cd vitalia/frontend && npx tsc --noEmit"
      must_pass: true

    - id: val-fe-lint
      description: "ESLint cache scoped a archivos F1-S7 + shell-organism + lib + arch tests"
      command: "cd vitalia/frontend && npx eslint src/components/shared/shell-organism src/lib src/__tests__/architecture --cache --cache-location .eslintcache"
      must_pass: true

    - id: val-fe-prettier
      description: "Prettier format check on new + modified files"
      command: "cd vitalia/frontend && npx prettier --check 'src/components/shared/shell-organism/{Ribbon,RibbonTab,ConfigTab,AppPanelSlot}*.{ts,tsx}' 'src/lib/agent-catalog.ts' 'src/__tests__/architecture/test-ribbon-no-shadcn-tabs.test.ts'"
      must_pass: true

    - id: val-fe-vitest-unit
      description: "Vitest unit: agent-catalog extend + Ribbon + RibbonTab + ConfigTab + AppPanelSlot integration + arch tests new + coverage threshold 20% (component-level target ≥80% logic-heavy: Ribbon.tsx + extractAgentFromPath)"
      command: "cd vitalia/frontend && npx vitest run src/components/shared/shell-organism src/lib src/__tests__/architecture --reporter=default --coverage --coverage.thresholds.lines=20 --coverage.thresholds.functions=20"
      must_pass: true

  # ════════════════════════════════════════════════════════════════════
  # § 2 — FUNCTIONAL (E2E Playwright per scenario, 9 specs)
  # ════════════════════════════════════════════════════════════════════
