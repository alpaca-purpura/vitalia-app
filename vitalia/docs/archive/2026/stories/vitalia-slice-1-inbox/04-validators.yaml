# Category 3 — VISUAL (Playwright smoke · a11y · Chromatic)
# ============================================================
visual:

  - id: e2e_smoke_inbox_local
    must_pass: true
    surface: frontend
    command: cd ${fe_root} && E2E_BASE_URL=http://localhost:3002 npx playwright test --project=smoke e2e/specs/smoke/inbox.smoke.spec.ts
    description: |
      Smoke happy path /inbox (Clerk auth fixture dr.demo · tenant Sanaré MX).
      Tests: shell renders · conversation list visible · thread placeholder · segmented control · voice style chip.

  - id: e2e_smoke_inbox_live
    must_pass: true
    surface: frontend
    command: cd ${fe_root} && E2E_BASE_URL=https://dev-app.vitalialat.com npx playwright test --project=smoke e2e/specs/smoke/inbox.smoke.spec.ts
    description: Smoke /inbox against dev-app.vitalialat.com (live verification post-merge).

  - id: a11y_axe_inbox
    must_pass: true
    surface: frontend
    command: cd ${fe_root} && npx playwright test e2e/specs/a11y/inbox.a11y.spec.ts --project=a11y
    description: |
      axe-core a11y scan /inbox · critical + serious violations = 0.
      Coverage: segmented control radiogroup · ActivityStream aria-expanded · ActionReceipt aria-live polite · ContactSidebar PHI reveal aria-label · keyboard nav Tab order.

  - id: visual_regression_chromatic_inbox
    must_pass: false  # post-merge action, not blocking pre-merge
    surface: frontend
    command: cd ${fe_root} && npx chromatic --project-token=$CHROMATIC_TOKEN --only-changed --build-script-name=storybook:build
    description: |
      Chromatic visual regression snapshots per breakpoint (mobile 768 · tablet 1024 · desktop 1440).
      Inbox 8 states + per-component stories (SegmentedControl3Modes · FilterChips · etc.).

  - id: lighthouse_ci_inbox
    must_pass: false  # post-merge perf budget verification
    surface: frontend
    command: cd ${fe_root} && npx lighthouse-ci collect --url=http://localhost:3002/inbox --numberOfRuns=3
    description: |
      Performance budget verification:
      - LCP < 2.5s · INP < 200ms · CLS < 0.1
      - Bundle size /inbox route < 250KB gzipped

