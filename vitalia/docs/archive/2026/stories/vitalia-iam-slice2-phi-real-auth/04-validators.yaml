# 04-validators — vitalia-iam-slice2-phi-real-auth
# 5 categorias + test_construction_plan + scenario_coverage (SC-1..SC-4) + arch validation
story_id: vitalia-iam-slice2-phi-real-auth
brand: vitalia
schema_version: v4.1
architecture_pattern: ADR-vitalia-004
adr_004_compliance: n/a-with-rationale

# ===========================================================================
# 5 categorias de validacion
# ===========================================================================
categories:

  - id: cat-1-auth-jwks-real
    name: "Decoder JWKS real (reuse engine)"
    must_pass: true
    checks:
      - "ClerkJwtDecoder.decode importa verify_token_payload de luana_core_iam.application.auth (NO recrea PyJWKClient)"
      - "JWT real valido de Clerk -> payload verificado (RS256 via JWKS engine)"
      - "JWT invalido/expirado/forjado -> 401 honesto (sin bypass, sin leak en body)"
      - "stub 'stub:...' SOLO aceptado si VITALIA_AUTH_STUB=1 (test); en runtime -> JWKS real"
      - "user_id extraido de payload['sub']"

  - id: cat-2-role-from-db
    name: "Rol desde user_tenants (DB), no token"
    must_pass: true
    checks:
      - "ClinicResolver resuelve role desde user_tenants.role por (user_id, tenant_id, is_active) consumiendo UserTenantModel engine via import"
      - "ClinicContext.role refleja el rol DB (no el del payload)"
      - "user_id (Clerk sub string) -> users.id (UUID) via UserModel.clerk_id (import engine)"
      - "cero edit a core/luana-core-*/src/ (consume via import)"

  - id: cat-3-repos-reales-wired
    name: "Repos PHI reales cableados (DI)"
    must_pass: true
    checks:
      - "crm/router.py + consent_endpoints.py: cero AsyncMock() inline en runtime; repos reales via Depends(get_async_session)"
      - "marketing/routes.py + deps.py: ClinicResolver real + rol desde DB"
      - "inbox/router.py: repos reales + rol desde DB"
      - "cada repo real instanciado existe (sub-scope marcado si falta — OQ-1)"

  - id: cat-4-hipaa-lite
    name: "HIPAA-lite dual filter + audit + RBAC"
    must_pass: true
    checks:
      - "queries PHI dual filter tenant_id + clinic_id (PhiRepositoryBase enforced)"
      - "audit_log row escrito SYNC pre-response en acceso PHI (grant + denial)"
      - "@require_phi_access(roles=[doctor,nurse,admin_clinic]) gatea cada endpoint PHI"
      - "sanitization en traces (sin PHI re-identificable)"
      - "cross-tenant -> 404 (no leak); cross-clinic -> 403"

  - id: cat-5-fe-role-source
    name: "FE rol desde /me (1 fuente verdad DB)"
    must_pass: true
    checks:
      - "useCurrentUser lee role desde GET /api/v1/iam/users/me (React Query), no de Clerk publicMetadata.role"
      - "shape CurrentUser intacto (consumers RequireRole/usePiiRoleGate sin cambios)"
      - "NO toca components/ui/ ni layout"
      - "estados loading/error/success cubiertos"

# ===========================================================================
# scenario_coverage — los 4 scenarios del spec, graders ejecutables
# ===========================================================================
scenario_coverage:

  - scenario: SC-1
    name: "happy — doctor con JWT real ve PHI"
    graders:
      - { type: integration, path: "vitalia/backend/tests/integration/test_phi_real_auth.py::test_doctor_jwt_real_sees_phi" }
      - { type: state_check, target: db, query: "SELECT 1 FROM audit_log WHERE user_id=:uid AND action LIKE 'phi_access_granted%'" }
      - { type: manual_audit, who: claude-dev-app, expect: "JWT real minteado (Clerk Backend API) -> GET PHI 200 + audit row + log backend sin 401" }
    expect: "200 + data filtrada tenant+clinic + audit_log row + rol resuelto desde DB"

  - scenario: SC-2
    name: "negative — recepcion/marketing -> 403"
    graders:
      - { type: integration, path: "vitalia/backend/tests/integration/test_phi_real_auth.py::test_recepcion_403" }
      - { type: integration, path: "vitalia/backend/tests/integration/test_phi_real_auth.py::test_marketing_403" }
      - { type: manual_audit, expect: "recepcion JWT real -> 403 + audit log denied; cero leak de data" }
    expect: "403 (PHIAccessDeniedError) + audit_log phi_access_denied + no leak"

  - scenario: SC-3
    name: "edge — cross-tenant 404 / cross-clinic 403"
    graders:
      - { type: integration, path: "vitalia/backend/tests/integration/test_phi_real_auth.py::test_cross_tenant_404" }
      - { type: integration, path: "vitalia/backend/tests/integration/test_phi_real_auth.py::test_cross_clinic_403" }
    expect: "cross-tenant -> 404 (no leak); cross-clinic -> 403; audit del intento"

  - scenario: SC-4
    name: "adversarial — JWT invalido/expirado/forjado/stub-legacy -> 401"
    graders:
      - { type: integration, path: "vitalia/backend/tests/integration/test_phi_real_auth.py::test_invalid_token_401" }
      - { type: integration, path: "vitalia/backend/tests/integration/test_phi_real_auth.py::test_expired_token_401" }
      - { type: integration, path: "vitalia/backend/tests/integration/test_phi_real_auth.py::test_legacy_stub_token_rejected_in_runtime_401" }
      - { type: manual_audit, expect: "JWT forjado -> 401" }
    expect: "401 honesto via JWKS verify; stub legacy rechazado en runtime; sin leak en error body"

# ===========================================================================
# test_construction_plan (test-design-doctrine: naturaleza service-story BE-auth)
# ===========================================================================
test_construction_plan:

  red_first: true   # TDD: RED por capa antes de GREEN

  backend:
    unit:
      - "iam/infrastructure/clerk_jwt_decoder: decode JWKS-vs-stub gate (VITALIA_AUTH_STUB on/off)"
      - "iam/application/services/clinic_resolver: rol desde DB (user,tenant) -> role; sub->uuid resolution"
    integration:
      - path: "vitalia/backend/tests/integration/test_phi_real_auth.py"
        scenarios: [SC-1, SC-2, SC-3, SC-4]
        jwt_strategy: |
          JWT real via Clerk Backend API (handoff pattern: POST /v1/sessions + /tokens, UA curl)
          O JWKS mock env-gated. Para tests deterministas sin egress: monkeypatch verify_token_payload
          con payload fijo (sub=user_3EQJjxsvxiZ5exQjucSB651xnUd) + seed god-matrix DB.
        fixtures:
          tenant_sanare: "e69a691d-070e-5caf-a053-6e74642ec100"
          clinic_sanare: "f035be5b-0ac4-5210-8fc3-395650ca2b83"
          seed: "vitalia/backend/scripts/seed_test_users_link.py"
          password: "<VITALIA_TEST_USERS_PASSWORD — pedir a Chris>"
          doctor_user: "user_3EQJjxsvxiZ5exQjucSB651xnUd (doctor.demo)"
    arch_fitness:
      extend_keep_green:
        - "vitalia/backend/tests/architecture/test_phi_dual_filter.py"
        - "vitalia/backend/tests/architecture/test_audit_log_sync_write.py"
        - "vitalia/backend/tests/architecture/test_audit_log_row_per_phi_endpoint.py"
        - "vitalia/backend/tests/architecture/test_response_model_required.py"
        - "vitalia/backend/tests/architecture/test_no_phi_in_url_params.py"
      new:
        - path: "vitalia/backend/tests/architecture/test_auth_stub_env_gate.py"
          asserts:
            - "runtime config (vitalia/.env.dev.template, docker-compose.dev.yml) NO contiene VITALIA_AUTH_STUB"
            - "ClerkJwtDecoder NO acepta stub:... cuando VITALIA_AUTH_STUB ausente (default runtime)"
      grep_validation:
        - "grep dual-filter: toda query PHI tiene .where(tenant_id) Y .where(clinic_id)"
        - "grep AsyncMock: cero AsyncMock() inline en src/ de crm/consent/marketing/inbox runtime paths"

  frontend:
    unit:
      - "vitalia/frontend/src/hooks/__tests__/useCurrentUser.test.tsx: rol desde /me (success/loading/error); shape intacto"
    arch_fitness:
      keep_green:
        - "vitalia/frontend/src/__tests__/architecture/test_phi_pii_components_used.test.ts"

  e2e_or_manual:
    - "god-matrix JWT real (mint Clerk Backend API) contra dev-app: doctor.demo PHI 200 + audit ; recepcion 403 ; cross-tenant 404 ; logs backend leidos (anti-teatro, supervisado por Chris en gate de verificacion PHI)"

# ===========================================================================
# arch_validation — checks mecanicos extra
# ===========================================================================
arch_validation:
  no_engine_edit:
    rule: "cero modificacion a core/luana-core-*/src/"
    check: "git diff --name-only no incluye core/luana-core-*/src/"
  no_cross_brand_mirror:
    rule: "cero clerk_jwt_decoder/clinic_resolver en otras brands"
    check: "find {nicolify,comunify,lupulo}/backend/src -name 'clerk_jwt_decoder.py' -o -name 'clinic_resolver.py' -> vacio"
  stub_env_gate:
    rule: "Q2 — VITALIA_AUTH_STUB solo en tests, nunca runtime"
    check: "test_auth_stub_env_gate.py verde"
  dual_filter_phi:
    rule: "HIPAA-lite dual filter tenant+clinic en queries PHI"
    check: "test_phi_dual_filter.py verde"
  cap_change_type_coherence:
    rule: "extend (no new): cap iam-scaffold-slice-1 existe; story append scenarios"
    check: "scenarios SC-1..SC-4 con added_in_story en cap YAML al merge"
