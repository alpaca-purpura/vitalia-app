# ============================================================
# § NON_FUNCTIONAL (lint, format, type-check, arch fitness)
# ============================================================

non_functional:

  - id: nf-fe-tsc
    must_pass: true
    surface: frontend
    command: |
      cd vitalia/frontend && npx tsc --noEmit
    expected_exit: 0
    description: "TypeScript strict, 0 errors across all FE files (incluyendo middleware + dashboard feature)"

  - id: nf-fe-eslint
    must_pass: true
    surface: frontend
    command: |
      cd vitalia/frontend && npx eslint src/ --cache --max-warnings=0
    expected_exit: 0
    description: "ESLint 0 errors + 0 warnings"

  - id: nf-fe-arch-fitness
    must_pass: true
    surface: frontend
    command: |
      cd vitalia/frontend && npx vitest run src/__tests__/architecture/ --reporter=default
    expected_exit: 0
    description: "FE arch fitness ratchet — shrink-only allowlists, no new violations"

  - id: nf-be-ruff-check
    must_pass: true
    surface: backend
    command: |
      WS=$(git rev-parse --show-toplevel) && cd $WS/vitalia/backend && $WS/.venv/bin/ruff check src/modules/vitalia/admin/ tests/admin/ tests/integration/admin/ --no-cache
    expected_exit: 0
    description: "Ruff 0 errors on new admin module + tests (unit + integration)"

  - id: nf-be-ruff-format
    must_pass: true
    surface: backend
    command: |
      WS=$(git rev-parse --show-toplevel) && cd $WS/vitalia/backend && $WS/.venv/bin/ruff format --check src/modules/vitalia/admin/ tests/admin/ tests/integration/admin/
    expected_exit: 0
    description: "Ruff format consistency on admin module"

  - id: nf-be-arch-fitness
    must_pass: true
    surface: backend
    command: |
      WS=$(git rev-parse --show-toplevel) && cd $WS/vitalia/backend && $WS/.venv/bin/pytest tests/architecture/ -x -q --tb=short
    expected_exit: 0
    description: "BE arch fitness (DDD, tenant isolation, admin-panel rules)"

  - id: nf-anti-duplication-scan
    must_pass: true
    surface: cross-cutting
    command: |
      WS=$(git rev-parse --show-toplevel) && \
      MIRROR_COUNT=$(diff <(find $WS/nicolify/backend/src/modules/nicolify/admin/modules -name "tenants.py" -o -name "users.py" | xargs cat) <(find $WS/vitalia/backend/src/modules/vitalia/admin/modules -name "tenants.py" -o -name "users.py" | xargs cat) | wc -l) && \
      [ "$MIRROR_COUNT" -gt 50 ]
    expected_exit: 0
    description: "Cross-brand anti-mirror check: vitalia admin modules MUST differ ≥50 lines from nicolify (proven brand-specific reimplementation, not copy-paste). Per .claude/rules/admin-panel.md + anti-duplication.md."

# ============================================================
# § FUNCTIONAL (unit + integration tests)
# ============================================================

functional:

  - id: fn-be-admin-contract
    must_pass: true
    surface: backend
    command: |
      WS=$(git rev-parse --show-toplevel) && cd $WS/vitalia/backend && $WS/.venv/bin/pytest tests/admin/test_admin_contract.py -v
    expected_exit: 0
    description: "Admin contract test: PAGE_SPECS registry valid, all pages exist + callable, no slug dups"

  - id: fn-fe-dashboard-unit
    must_pass: true
    surface: frontend
    command: |
      cd vitalia/frontend && npx vitest run src/features/dashboard/__tests__/ --reporter=default
    expected_exit: 0
    description: "Dashboard feature unit tests (DashboardWelcome + SliceOneStubsRow)"

  - id: fn-be-webhook-clerk-integration            # ★ NEW MUST 2 ★
    must_pass: true
    surface: backend
    command: |
      WS=$(git rev-parse --show-toplevel) && cd $WS/vitalia/backend && $WS/.venv/bin/pytest tests/integration/admin/test_clerk_webhook_integration.py -v --tb=short
    expected_exit: 0
    description: |
      Backend integration test: POST fake user.created webhook with valid HMAC signature
      to /api/v1/vitalia/webhooks/clerk → verify UserProfile row created + tenant_id
      auto-associated (default aurora-dental-ar fixture) + audit_log row created.
      Also tests rejection of invalid HMAC signature (returns 401, no row created).
      Cubre SC-05 (sign-up → webhook → DB) + SC-12 (HMAC validation).

  - id: fn-be-hipaa-audit-log-verify               # ★ NEW MUST 3 ★
    must_pass: true
    surface: backend
    command: |
      WS=$(git rev-parse --show-toplevel) && cd $WS/vitalia/backend && $WS/.venv/bin/pytest tests/integration/admin/test_audit_log_verify.py -v --tb=short
    expected_exit: 0
    description: |
      HIPAA-lite audit_log compliance verification (per vitalia/.claude/rules/hipaa-lite.md).
      Test: invoke admin.tenant.create → query vitalia_audit_log table → verify row created
      with action="admin.tenant.create" + actor="super-admin" + resource_id=tenant_id +
      payload_redacted contains identity fields only (NO PHI). Idem admin.user.create.
      Cubre SC-13 (audit log row verify).

  - id: fn-be-cross-tenant-isolation-admin         # ★ NEW SHOULD 7 ★
    must_pass: true
    surface: backend
    command: |
      WS=$(git rev-parse --show-toplevel) && cd $WS/vitalia/backend && $WS/.venv/bin/pytest tests/integration/admin/test_cross_tenant_isolation.py -v --tb=short
    expected_exit: 0
    description: |
      HIPAA-lite dual-filter runtime verification (per hipaa-lite.md § tenant isolation).
      Test: admin creates Tenant A (user UA) + Tenant B (user UB) → query as UA
      requesting clinic_id of Tenant B → 404 (no leak). Query as UA requesting clinic_id
      of Tenant A but X-Tenant-ID header of Tenant B → 403. Arch fitness covers static,
      este verifica runtime. Cubre SC-11.

