        tests:
          - "fe_build_production"
          - "fe_html_suppress_hydration_warning_present"
          - "fe_theme_provider_props_correct"
    estimated_hours: 0.5
    notes_for_downstream: |
      Path: vitalia/frontend/src/app/layout.tsx

      Wrap verbatim:

        import { ThemeProvider } from 'next-themes'
        import './globals.css'

        export default function RootLayout({ children }: { children: React.ReactNode }) {
          return (
            <html lang="es" suppressHydrationWarning>
              <body>
                <ThemeProvider
                  attribute="data-theme"
                  defaultTheme="light"
                  enableSystem={false}
                  storageKey="vitalia-theme"
                >
                  {children}
                </ThemeProvider>
              </body>
            </html>
          )
        }

      Props verbatim D1+D4 (4 mandatory):
        - attribute="data-theme"        (NOT class="dark")
        - defaultTheme="light"           (D1 ratificada)
        - enableSystem={false}           (D1 ratificada)
        - storageKey="vitalia-theme"     (D4 ratificada namespaced)

      <html lang="es" suppressHydrationWarning> obligatorio.
      Sin suppressHydrationWarning → React emite warning durante hydration
      (next-themes inyecta data-theme inline <head> ANTES de hydrate React,
      legitimate SSR vs client mismatch).

      Scenario 3 validator (fe_build_production + console error capture)
      detecta esto post-build.

