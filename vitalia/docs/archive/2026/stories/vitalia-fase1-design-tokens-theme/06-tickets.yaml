      Path component: vitalia/frontend/src/components/shared/shell-organism/ThemeToggle.tsx

      Body verbatim (anclas técnicas):

        'use client'

        import { useTheme } from 'next-themes'
        import { Button } from '@/components/ui/button'
        import { Moon, Sun } from 'lucide-react'

        export function ThemeToggle() {
          const { theme, setTheme } = useTheme()
          const isDark = theme === 'dark'

          return (
            <Button
              variant="ghost"
              size="icon"
              aria-label={`Cambiar tema (actual: ${isDark ? 'oscuro' : 'claro'})`}
              aria-pressed={isDark}
              onClick={() => setTheme(isDark ? 'light' : 'dark')}
              data-testid="theme-toggle"
            >
              {isDark ? <Sun className="h-[1.2rem] w-[1.2rem]" /> : <Moon className="h-[1.2rem] w-[1.2rem]" />}
              <span className="sr-only">Cambiar tema</span>
            </Button>
          )
        }

      CRÍTICO:
        - 'use client' directive obligatoria (useTheme hook requiere React runtime)
        - import { useTheme } from 'next-themes' DIRECTO (NO wrapper — D5 ratificada)
        - export function ThemeToggle()  ← named export (NO export default — FSD-Lite enforce)
        - data-testid="theme-toggle"     ← Playwright selector estable
        - aria-label dinámico Spanish neutro: "Cambiar tema (actual: claro|oscuro)"
        - aria-pressed dinámico boolean
        - Conditional icon: Moon (light theme visible) / Sun (dark theme visible)
        - <span sr-only> screen-reader fallback (a11y defense-in-depth)
        - NO hex hardcoded, NO any TypeScript, NO default export

      Path unit test: vitalia/frontend/src/components/shared/shell-organism/ThemeToggle.test.tsx

      Tests vitest (≥4):
        1. it('renders with Moon icon when theme is light') — wrap with ThemeProvider defaultTheme=light
        2. it('renders with Sun icon when theme is dark') — wrap with ThemeProvider defaultTheme=dark
        3. it('toggles theme on click') — fireEvent.click + assert next-themes setTheme called
        4. it('aria-label matches Spanish neutro pattern') — regex /^Cambiar tema \(actual: (claro|oscuro)\)$/

