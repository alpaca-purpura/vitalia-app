story_closure_gate:
  defer_audit: false
  auto_handoff_on_developed: true
  handoff_target: "/auditor vitalia-fase1-design-tokens-theme"
  developed_to_reviewing_trigger: "ALL validators must_pass:true GREEN"
  reviewing_to_done_trigger: "/auditor APPROVED + /pm-vitalia merge 07-merge.md"

