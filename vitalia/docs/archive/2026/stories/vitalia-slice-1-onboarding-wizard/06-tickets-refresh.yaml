      ### Repository signatures (async — all queries filter tenant_id MANDATORY per .claude/rules/tenant-isolation.md)

      ```python
      # vitalia/backend/src/modules/vitalia/copilot/domain/repositories/onboarding_progress_repository.py
      from abc import ABC, abstractmethod
      from datetime import datetime
      from uuid import UUID
      from vitalia.backend.src.modules.vitalia.copilot.domain.entities.onboarding_draft import OnboardingDraft

      class OnboardingProgressRepository(ABC):
          @abstractmethod
          async def create(self, *, tenant_id: UUID, user_id: UUID, step: str, mode: str | None,
                           draft_id: UUID | None) -> OnboardingDraft: ...
          @abstractmethod
          async def get_by_tenant_user(self, *, tenant_id: UUID, user_id: UUID) -> OnboardingDraft | None: ...
          @abstractmethod
          async def update_step(self, *, tenant_id: UUID, progress_id: UUID, step: str,
                                slots_confirmed: dict, slots_pending: dict) -> OnboardingDraft: ...
          @abstractmethod
          async def mark_completed(self, *, tenant_id: UUID, progress_id: UUID,
                                   completed_at: datetime) -> OnboardingDraft: ...

      # vitalia/backend/src/modules/vitalia/copilot/domain/repositories/brand_studio_draft_repository.py
      class BrandStudioDraftRepository(ABC):
          @abstractmethod
          async def create(self, *, tenant_id: UUID, user_id: UUID, draft_kind: str,
                           expires_at: datetime | None) -> BrandStudioDraft: ...
          @abstractmethod
          async def get_by_id_tenant(self, *, tenant_id: UUID, draft_id: UUID) -> BrandStudioDraft | None: ...
          @abstractmethod
          async def append_payload_patch(self, *, tenant_id: UUID, draft_id: UUID,
                                          patch: dict, voice_profile_patch: dict) -> BrandStudioDraft: ...
          @abstractmethod
          async def mark_committed(self, *, tenant_id: UUID, draft_id: UUID,
                                   committed_at: datetime) -> BrandStudioDraft: ...
      ```

      ### DI binding (replaces AsyncMock in wizard_onboarding_routes.py lines 75-78)

      ```python
      # vitalia/backend/src/modules/vitalia/copilot/api/routes/wizard_onboarding_routes.py
      from fastapi import Depends
      from sqlalchemy.ext.asyncio import AsyncSession
      from vitalia.backend.src.shared.persistence.session import get_async_session
      from vitalia.backend.src.modules.vitalia.copilot.infrastructure.repositories.onboarding_progress_repository import \
          SqlAlchemyOnboardingProgressRepository
      from vitalia.backend.src.modules.vitalia.copilot.infrastructure.repositories.brand_studio_draft_repository import \
          SqlAlchemyBrandStudioDraftRepository

      async def get_onboarding_progress_repo(
          session: AsyncSession = Depends(get_async_session),
      ) -> OnboardingProgressRepository:
          return SqlAlchemyOnboardingProgressRepository(session)

      async def get_brand_studio_draft_repo(
          session: AsyncSession = Depends(get_async_session),
      ) -> BrandStudioDraftRepository:
          return SqlAlchemyBrandStudioDraftRepository(session)

      async def get_onboarding_draft_service(
          progress_repo: OnboardingProgressRepository = Depends(get_onboarding_progress_repo),
          draft_repo: BrandStudioDraftRepository = Depends(get_brand_studio_draft_repo),
      ) -> OnboardingDraftService:
          return OnboardingDraftService(progress_repo=progress_repo, draft_repo=draft_repo)
      ```

      ### Constraints (mandatory per .claude/rules/)
      - Tenant isolation: ALL queries filter tenant_id (incl. get_by_id) — `.where(Model.tenant_id == tenant_id)`. No exceptions.
      - SQLAlchemy 2.0 only: `select(Model).where(...)` + `mapped_column` (NEVER `session.query()` or `Column()`).
      - Soft delete via `status='abandoned'` (no deleted_at on these tables — tenant config, not PHI).
      - PhiRepositoryBase NOT required (wizard tables = brand voice samples + onboarding config, NOT PHI per
        vitalia/.claude/rules/hipaa-lite.md § PHI fields canónicos).
      - Inside-Out DDD: domain interfaces in copilot/domain/repositories/ → infrastructure impl in
        copilot/infrastructure/repositories/. No leak of SQLAlchemy types into domain layer.
