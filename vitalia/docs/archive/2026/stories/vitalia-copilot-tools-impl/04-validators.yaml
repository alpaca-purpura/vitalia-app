# ============================================================
# Category 4 — AGENTIC EVAL (pass^k goldens)
# ============================================================
agentic_eval:

  - id: ae_voice_fidelity_vitalia
    must_pass: true
    surface: backend
    command: cd ${ws_root} && .venv/bin/pytest vitalia/backend/tests/agentic_evals/sales_agent/test_voice_fidelity_vitalia.py -v -x -q --tb=short
    description: Voice fidelity grader smoke (engine grader from core/luana-core-brand-studio/) — anchored per-tenant personality_profile.system_instruction. Threshold ≥0.85 per golden trial.

  - id: ae_medical_guardrails
    must_pass: true
    surface: backend
    command: cd ${ws_root} && .venv/bin/pytest vitalia/backend/tests/agentic_evals/sales_agent/test_medical_guardrails.py -v -x -q --tb=short
    description: 4 medical guardrails enforce per § 4.2 design (no_diagnosis + no_prescription + medical_disclaimer_required + prompt_injection_block).

  - id: ae_pass_k_adrian_goldens
    must_pass: true
    surface: backend
    command: cd ${ws_root} && .venv/bin/pytest vitalia/backend/tests/agentic_evals/sales_agent/test_pass_k_evaluation.py -v -x -q --tb=short
    description: |
      Adrián pass^k evaluation — 12 goldens × 3 trials each.
      Trial policy:
        trials_per_scenario: 3
        per_trial_threshold: 0.66 (≥2/3 dimensions pass)
        pass_k_threshold: 0.5 (≥50% goldens pass k=3)
      Rubrics: voice-fidelity + no-hallucination + tool-trajectory + pii-redaction + safety
      Goldens: vitalia/backend/tests/agentic_evals/sales_agent/goldens/{dental,estetica,psicologia,fertilidad}/*.yaml

  - id: ae_pass_k_wizard_goldens
    must_pass: true
    surface: backend
    command: cd ${ws_root} && .venv/bin/pytest vitalia/backend/tests/agentic_evals/copilot/test_wizard_pass_k_evaluation.py -v -x -q --tb=short
    description: |
      Valeria wizard pass^k evaluation — 4 goldens × 3 trials.
      Same trial policy as Adrián.
      Goldens: vitalia/backend/tests/agentic_evals/copilot/wizard_goldens/{happy,negative,edge_browser_close,adversarial}.yaml

  - id: ae_lucas_smoke
    must_pass: true
    surface: backend
    command: cd ${ws_root} && .venv/bin/pytest vitalia/backend/tests/agentic_evals/agentic/lucas/test_lucas_smoke.py -v -x -q --tb=short
    description: |
      Lucas smoke tests Slice 1 (per Q3 default — full eval goldens defer Slice 2):
      - Cron run completes successfully for sample tenant
      - lucas_recommendations rows populated for 5 stages
      - attribution_matrix_snapshots row created
      - referrals_leaderboard_snapshots row created
      - Status fields set correctly (active / skipped_timeout / skipped_budget)
      - BudgetGuard exceeded → status='skipped_budget'

  - id: ae_cache_hit_rate_smoke
    must_pass: true
    surface: backend
    command: cd ${ws_root} && .venv/bin/pytest vitalia/backend/tests/agentic_evals/cache/test_vitalia_cache_hit_rate.py -v -x -q --tb=short
    description: |
      Cache hit rate validation per claude-api § Validation:
      - Adrián 5-turn conversation: cache_read_input_tokens > 0 from iter 2+
      - Valeria 5-slot confirm sequence: cache_read_input_tokens > 0 from iter 2+
      - If cache_read=0 across iter 2+ → silent invalidator → audit FAIL
      Cache hit rate target ≥60% (smoke threshold ≥40% to start — production ramp-up).

  - id: ae_cost_budget_smoke
    must_pass: true
    surface: backend
    command: cd ${ws_root} && .venv/bin/pytest vitalia/backend/tests/agentic_evals/cost_budget/test_vitalia_cost_budget.py -v -x -q --tb=short
    description: |
      Cost budget smoke per design § 1.8 + § 2.9 + § 3.8:
      - Wizard session p95 ≤ $0.10 USD (cap)
      - Adrián per turn p95 ≤ $0.05 USD (cap)
      - Adrián per conversation p95 ≤ $0.50 USD (BudgetGuard.check enforces)
      - Lucas per tenant daily p95 ≤ $0.25 USD (BudgetGuard.check enforces, agent_kind="copilot" Others pool)

  - id: ae_channel_guards_phi_blocking
    must_pass: true
    surface: backend
    command: cd ${ws_root} && .venv/bin/pytest vitalia/backend/tests/unit/modules/vitalia/sales_agent/test_channel_guards.py -v -x -q --tb=short
    description: |
      PHI on non-encrypted channels blocked per hipaa-lite.md § Voice patterns + § Compliance gates:
      - WhatsApp Business API tier paid + PHI → allow
      - WhatsApp tier free + PHI → BlockedChannelError → derive portal
      - SMS + PHI → BlockedChannelError → derive portal
      - Telegram + PHI → BlockedChannelError → derive portal
      - Email plaintext + PHI → BlockedChannelError → derive portal

  - id: ae_anti_duplication_no_observability_mirror
    must_pass: true
    surface: backend
    command: cd ${ws_root} && .venv/bin/pytest vitalia/backend/tests/architecture/test_no_observability_mirror_copilot.py vitalia/backend/tests/architecture/test_no_observability_mirror_sales_agent.py -v -x -q --tb=short
    description: |
      Anti-duplication §0 cardinal — Vitalia callback handlers subclass engine BaseAgentCallbackHandler.
      Assertions:
        - `VitaliaCopilotCallbackHandler.__bases__` includes `BaseAgentCallbackHandler` from `luana_core_observability.recording.base_callback_handler`
        - Subclass implements ONLY `_persist_llm_call_row` + `_persist_trace_event_row`
        - Subclass does NOT redefine plumbing methods (sanitize_payload, on_llm_start, on_llm_end, on_tool_start, on_tool_end, etc.)

  - id: ae_lucas_cron_tz_aware
    must_pass: true
    surface: backend
    command: cd ${ws_root} && .venv/bin/pytest vitalia/backend/tests/architecture/test_lucas_cron_tz_aware.py -v -x -q --tb=short
    description: |
      Per Fase A engine lift (TenantLocationContract 0.2.0, commit 5ca6101):
      - Lucas cron scheduler imports TenantLocationContract from luana_core_platform.contracts
      - APScheduler CronTrigger uses tenant.timezone (NOT hardcoded UTC)
      - Cron daily at 06:00 LOCAL tenant TZ

  - id: ae_screening_yaml_completeness
    must_pass: true
    surface: backend
    command: cd ${ws_root} && .venv/bin/pytest vitalia/backend/tests/architecture/test_screening_yaml_completeness.py -v -x -q --tb=short
    description: |
      vitalia/backend/src/modules/vitalia/agentic/screening/screening_questions_by_vertical.yaml MUST have:
        - 4 verticals (dental + estetica + psicologia + fertilidad)
        - Each vertical ≥ 2 questions (≤ 4 questions cap per design)
        - Each question has expected_contraindications list (≥1 entry for derivar_doctor outcome)
        - YAML schema validation against schema.json

# ============================================================
# Eval policy (consolidated reference for runners)
# ============================================================
eval_policy:
  trials_per_scenario: 3
  per_trial_threshold: 0.66      # ≥2/3 dimensions pass per trial
  pass_k_threshold: 0.5          # ≥50% goldens pass k=3
  k: 3
  rubrics:
    - voice-fidelity
    - no-hallucination
    - tool-trajectory
    - pii-redaction
    - safety
  voice_fidelity_min: 0.85
  cache_hit_rate_min: 0.40       # smoke threshold; ≥0.60 production target
  cost_budget_caps:
    wizard_session_usd_p95: 0.10
    adrian_per_turn_usd_p95: 0.05
    adrian_per_conversation_usd_p95: 0.50
    lucas_per_tenant_daily_usd_p95: 0.25

