# ============================================================
# Category 1 — NON-FUNCTIONAL (lint + format + arch fitness + duplication audit)
# ============================================================
non_functional:

  - id: be_lint_ruff_check
    must_pass: true
    surface: backend
    command: cd ${ws_root} && .venv/bin/ruff check vitalia/backend/src/modules/vitalia/{copilot,sales_agent,agentic,compliance}/ vitalia/backend/tests/{unit,integration,agentic_evals,architecture}/ --no-cache
    description: Ruff 70+ rules, 0 errors. Line 120.

  - id: be_format_ruff
    must_pass: true
    surface: backend
    command: cd ${ws_root} && .venv/bin/ruff format --check vitalia/backend/src/modules/vitalia/{copilot,sales_agent,agentic,compliance}/ vitalia/backend/tests/
    description: Ruff format check (double quotes, spaces).

  - id: be_arch_fitness_brand_scoped
    must_pass: true
    surface: backend
    command: cd ${ws_root} && .venv/bin/pytest vitalia/backend/tests/architecture/ -v --override-ini="addopts=" -x -q --tb=short
    description: |
      Brand arch fitness suite (must all pass — shrink-only allowlists).
      Existing gates (must keep green):
        - test_phi_dual_filter.py (tenant_id+clinic_id cardinal)
        - test_no_cross_brand_imports.py
        - test_no_legacy_paths.py (post multibrand reorg)
        - test_response_model_required.py (PII allowlist)
        - test_migrations_idempotent.py (IF NOT EXISTS)
        - test_extension_sdk_registration.py
        - test_audit_log_sync_write.py
        - test_pgcrypto_phi_columns.py
        - test_ddd_inside_out_boundaries.py
        - test_extraction_orchestrator_inheritance.py
        - test_vitalia_no_pii_in_cacheable_slots.py
        - test_vitalia_slot_4_safety_markers_present.py
        - test_vitalia_cost_bucket_invariant.py
        - test_vitalia_no_query_without_tenant_filter.py
        - test_vitalia_personas_yaml_completeness.py
        - test_vitalia_payment_inherits_core_base.py
        - test_vitalia_rubric_md_v1_schema.py
      NEW gates this story adds:
        - test_no_observability_mirror_copilot.py
        - test_no_observability_mirror_sales_agent.py
        - test_lucas_cron_tz_aware.py
        - test_screening_yaml_completeness.py

  - id: be_arch_fitness_engine_consult_readonly
    must_pass: true
    surface: backend
    command: cd ${ws_root} && .venv/bin/pytest core/luana-core-extension-sdk/tests/test_registry_brand_smoke.py -v --override-ini="addopts=" -x -q --tb=short
    description: Engine arch fitness smoke (READ-ONLY consult — no engine modifications proposed in this story; this gate detects accidental engine mutation).

  - id: anti_duplication_cross_module_audit
    must_pass: true
    surface: cross
    command: |
      cd ${ws_root} && bash -c '
      # Grep for mirror anti-patterns per .claude/rules/anti-duplication.md inventory.
      # Any class declared in vitalia/backend matching base names (BaseObservabilityContext, BaseAgentCallbackHandler,
      # FXResolver, PricingSnapshotRepository, TenantBillingConfigRepository, BaseExtractionOrchestrator)
      # MUST import its parent from luana_core_* (subclass pattern, NOT mirror reimplementation).
      VIOLATIONS=$(grep -rln "class.*\(BaseObservabilityContext\|BaseAgentCallbackHandler\|FXResolver\|PricingSnapshot\|TenantBillingConfig\|BaseExtractionOrchestrator\)" vitalia/backend/src/modules/vitalia/copilot/ vitalia/backend/src/modules/vitalia/sales_agent/ vitalia/backend/src/modules/vitalia/agentic/ 2>/dev/null | xargs grep -L "from luana_core_observability\|from luana_core_extraction\|from luana_core_billing\|from luana_core_platform" 2>/dev/null || true)
      if [ -n "$VIOLATIONS" ]; then
        echo "VIOLATION: shared abstractions mirrored without engine import:"
        echo "$VIOLATIONS"
        exit 1
      fi
      echo "OK: no cross-brand mirrors detected"
      '
    description: Anti-duplication §0 cardinal — observability/cost/turn_envelope/callback_handler patterns must subclass from engine.

  - id: cross_brand_mirror_scan
    must_pass: true
    surface: cross
    command: |
      cd ${ws_root} && bash -c '
      # For each NEW tool basename in this story, verify NO mirror in other brands.
      # If match found in {nicolify, comunify, lupulo} → STOP, escalate /pm-luana promotion proposal.
      TOOLS="extract_tenant_context confirm_slot simulate_personality complete_onboarding send_payment_link reschedule_appointment screening_questions compute_stage_recommendation compute_attribution_matrix compute_referrals_leaderboard"
      VIOLATIONS=""
      for tool in $TOOLS; do
        for B in nicolify comunify lupulo; do
          if [ -d "$B/backend/src" ]; then
            M=$(find $B/backend/src -name "${tool}.py" 2>/dev/null)
            if [ -n "$M" ]; then VIOLATIONS="$VIOLATIONS\n$tool found in $B at $M"; fi
          fi
        done
      done
      if [ -n "$VIOLATIONS" ]; then
        echo "VIOLATION: cross-brand mirror detected — lift to engine via /pm-luana proposal first:"
        echo -e "$VIOLATIONS"
        exit 1
      fi
      echo "OK: no cross-brand mirrors"
      '
    description: Cross-brand mirror scan per .claude/rules/anti-duplication.md § Multibrand awareness.

  - id: engine_boundary_no_modification_audit
    must_pass: true
    surface: cross
    command: |
      cd ${ws_root} && bash -c '
      # This story does NOT modify core/luana-core-*/src/. Verify diff scope.
      # If diff touches core/luana-core-*/src/ → escalate /pm-luana promotion proposal (story BLOCKED).
      git diff --name-only main...HEAD 2>/dev/null | grep -E "^core/luana-core-[^/]+/src/" || true
      if git diff --name-only main...HEAD 2>/dev/null | grep -qE "^core/luana-core-[^/]+/src/"; then
        echo "VIOLATION: engine src modified by this story — requires /pm-luana proposal."
        exit 1
      fi
      echo "OK: engine src untouched"
      '
    description: Engine boundary cardinal — core/luana-core-*/src/ READ-ONLY for this story.

  - id: spanish_neutro_voseo_check_chrome
    must_pass: true
    surface: cross
    command: |
      cd ${ws_root} && bash -c '
      # Voseo glossary scan per .claude/rules/spanish-text.md § R2 — applies to UI chrome (Valeria responses + Lucas card text),
      # NOT to sales_agent output (Adrián respects tenant voice per personality_profiles.system_instruction).
      # Files scanned: prompts MD for Valeria + Lucas + Lucas card structure outputs.
      VOSEO_PATTERNS="vos\|sos\|tenés\|querés\|podés\|sabés\|hacés\|venís\|decís\|mirá\|dejá\|poné\|usá\|elegí\|empezá\|configurá\|escribí\|cambiá\|fijate\|acordate"
      VIOLATIONS=$(grep -rEn "${VOSEO_PATTERNS}" vitalia/backend/src/modules/vitalia/copilot/prompts/ vitalia/backend/src/modules/vitalia/agentic/lucas/prompts/ vitalia/backend/src/modules/vitalia/agentic/lucas/personas/ 2>/dev/null | grep -v "# voseo-allowed" | grep -v "<!-- voseo-allowed" || true)
      if [ -n "$VIOLATIONS" ]; then
        echo "VIOLATION: voseo detected in UI chrome (Valeria/Lucas) — Spanish neutro tuteo required:"
        echo "$VIOLATIONS"
        exit 1
      fi
      echo "OK: no voseo in UI chrome"
      '
    description: Spanish neutro LatAm tuteo for Valeria + Lucas chrome (Adrián exempt — voice fidelity per tenant personality_profiles).

