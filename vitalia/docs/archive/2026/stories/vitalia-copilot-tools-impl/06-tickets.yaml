        Each golden YAML schema: golden_id + vertical + scenario + persona + input_conversation + expected_tools_trajectory + expected_voice_fidelity_score + expected_medical_guardrails + expected_channel_guards + expected_outcome

      Sub-task B — Wizard 4 goldens YAML + 4 personas YAML (Sonnet OK):
