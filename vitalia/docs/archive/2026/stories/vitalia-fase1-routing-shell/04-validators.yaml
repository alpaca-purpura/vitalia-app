# F1-S9 vitalia-fase1-routing-shell — validators (5 categorías ★ v4.1)
#
# Each validator: must_pass=true unless explicitly marked. Comando shell EJECUTABLE.
# ZERO Opus en build (FE+BE no-agentic puro). R23 NO aplica.
#
# Categorías v4.1:
#   1. non_functional      — typecheck, lint, format, vitest unit + coverage, pytest
#   2. functional          — E2E Playwright (1 spec per Gherkin scenario) + BE pytest mount test
#   3. visual              — Playwright visual goldens (not-found outer/inner + network fallback + responsive)
#   4. agentic_eval        — N/A (zero agentic surface)
#   5. architectural_validation — FSD-Lite boundaries, anti-dup scan, no-middleware-ts grep, no-(dashboard) grep, no-cross-brand, PHI dual filter exemption, response_model required

story_id: vitalia-fase1-routing-shell
brand: vitalia
phase: fase-1
last_modified: 2026-05-26
architect_iter: 1
playwright_required: true   # ui-story HARD per v4.1

scenario_coverage:
  total_scenarios: 8
  mapped: 8
  coverage_pct: 100
  scenarios:
    - id: SC-1
      title: "happy · login + default landing + navegación completa"
      validator_ids:
        - val-fe-e2e-happy-navigation
        - val-fe-tsc
        - val-fe-vitest-unit-agent-catalog
        - val-be-pytest-mount-test
    - id: SC-2
      title: "negative · agent slug inválido → outer not-found"
      validator_ids:
        - val-fe-e2e-not-found-outer
        - val-fe-visual-not-found-outer-light
        - val-fe-visual-not-found-outer-dark
    - id: SC-3
      title: "edge · subtab inválido dentro agent válido → inner not-found"
      validator_ids:
        - val-fe-e2e-not-found-inner
        - val-fe-visual-not-found-inner-light
        - val-fe-visual-not-found-inner-dark
    - id: SC-4
      title: "adversarial · cross-tenant access blocked → audit log + redirect"
      validator_ids:
        - val-fe-e2e-cross-tenant-blocked
        - val-fe-vitest-unit-audit-helper
    - id: SC-5
      title: "network_failure · BE tenant fetch timeout → fallback + Reintentar"
      validator_ids:
        - val-fe-e2e-network-failure
        - val-fe-visual-network-error
        - val-fe-vitest-unit-iam-api
    - id: SC-6
      title: "accessibility · keyboard nav + screen reader + axe WCAG 2.1 AA"
      validator_ids:
        - val-fe-e2e-a11y-keyboard
        - val-fe-axe-routing-shell
    - id: SC-7
      title: "i18n · microcopy Spanish neutro LatAm verificado"
      validator_ids:
        - val-fe-e2e-i18n-spanish-neutro
        - val-fe-arch-no-voseo
    - id: SC-8
      title: "edge · user autenticado sin tenants → sign-out + admin message"
      validator_ids:
        - val-fe-e2e-no-tenants-edge

sub_categories_coverage:
  race_condition:
    applies: false
    not_applicable_reason: "Routing puro — sin create/update concurrente con unique constraint."
  concurrent_users:
    applies: false
    not_applicable_reason: "Routing per-session; SC-4 cubre el caso adyacente (cross-tenant). No hay estado compartido cross-user."
  network_failure:
    applies: true
    covered_by: [val-fe-e2e-network-failure, val-fe-visual-network-error, val-fe-vitest-unit-iam-api]
  empty_state:
    applies: false
    not_applicable_reason: "Empty per sub-tab es responsabilidad de F1-S10. F1-S9 sólo cablea routing; placeholder F1-S10 es scope siguiente."
  large_dataset:
    applies: false
    not_applicable_reason: "Validators isValidAgent/isValidSubtab O(1) sobre arrays 6/22 elementos. No hay pagination/list rendering."
  accessibility:
    applies: true
    covered_by: [val-fe-e2e-a11y-keyboard, val-fe-axe-routing-shell, val-fe-arch-skip-link]
  i18n:
    applies: true
    covered_by: [val-fe-e2e-i18n-spanish-neutro, val-fe-arch-no-voseo]

iteration:
  max_iterations: 10
  on_fail: "fix targeted file (single file edit per iter, no scope creep)"
  cap_reached_action: "escalate Chris with T-{n}-impl-log.md cap_reached summary; do NOT auto-disable any validator"

test_construction_plan:
  playwright_required: true
  creation_order:
    - "T-1 BE: tests/test_main_iam_routes_mounted.py (RED 3 cases) → main.py wiring (GREEN). Delete vitalia/backend/src/modules/vitalia/iam/api/router.py + test_router.py."
    - "T-2 lib: lib/__tests__/agent-catalog.test.ts extend (~14 RED) → agent-catalog.ts EXTEND (GREEN). lib/iam/__tests__/api.test.ts NEW (5 RED) → lib/iam/api.ts + types.ts NEW (GREEN). lib/iam/__tests__/audit.test.ts NEW (2 RED) → lib/iam/audit.ts NEW (GREEN)."
    - "T-3 proxy + auth layer: write architecture test test-no-middleware-ts.test.ts (RED — passes already since middleware.ts absent, but ratchet locks in). Modify proxy.ts (docs anchor). Write _components/NetworkErrorFallback.tsx + RefreshButton.tsx (Server + Client leaf). Modify (shell-organism)/layout.tsx (add tenant validation block — TDD: layout test via next-router-mock if helpful, else cover via Playwright SC-5 + SC-8)."
    - "T-4 routing pages: write test-no-dashboard-route-group.test.ts (RED — initially failing because (dashboard) exists; GREEN after T-5). Modify (shell-organism)/page.tsx default. NEW [agent]/layout.tsx + page.tsx + not-found.tsx + [subtab]/page.tsx + outer not-found.tsx. DELETE [...slug]/page.tsx."
    - "T-5 legacy cleanup: rm -rf (dashboard)/ + (app)/. DELETE fidelizacion E2E POMs + specs. MODIFY 4 legacy specs (visual-smoke, dev-stack-baseline, mobile-smoke, a11y-smoke) — strip dashboard assertions. DELETE features/dashboard/ if zero remaining consumers. DELETE welcome-state.yaml capability. MODIFY 6 capability YAMLs (booking, compliance hipaa-lite-audit, brand_studio, offer_studio, patients records, treatments) — strip FE legacy path + add fe_planned_phase2. Verify nps-tracking + whatsapp-template-registry + hipaa-lite-defensive-stack are BE-only (no change). Run reconcile_capabilities.py --brand vitalia --check-mode."
    - "T-6 Playwright suite: POM RoutingShellPage.ts + fixture routing-shell.fixture.ts + 8 spec files (one per SC) + axe-core integration on SC-6. Run --update-snapshots iter 1 to seed visual goldens (not-found outer light/dark, not-found inner light/dark, network fallback light/dark). After Chris ratifies → snapshots become shrink-only ratchet."
  scenario_to_test:
    SC-1: "vitalia/frontend/e2e/regression/vitalia-fase1-routing-shell/happy-navigation.spec.ts"
    SC-2: "vitalia/frontend/e2e/regression/vitalia-fase1-routing-shell/not-found-outer.spec.ts"
    SC-3: "vitalia/frontend/e2e/regression/vitalia-fase1-routing-shell/not-found-inner.spec.ts"
    SC-4: "vitalia/frontend/e2e/regression/vitalia-fase1-routing-shell/cross-tenant-blocked.spec.ts"
    SC-5: "vitalia/frontend/e2e/regression/vitalia-fase1-routing-shell/network-failure-tenant-fetch.spec.ts"
    SC-6: "vitalia/frontend/e2e/regression/vitalia-fase1-routing-shell/a11y-keyboard-nav.spec.ts"
    SC-7: "vitalia/frontend/e2e/regression/vitalia-fase1-routing-shell/i18n-spanish-neutro.spec.ts"
    SC-8: "vitalia/frontend/e2e/regression/vitalia-fase1-routing-shell/no-tenants-edge.spec.ts"
  poms_required:
    - path: "vitalia/frontend/e2e/pages/RoutingShellPage.ts"
      methods:
        - gotoTenantRoot
        - gotoAgentRoot
        - gotoSubtab
        - gotoInvalidAgent
        - gotoInvalidSubtab
        - mockNetworkFailure
        - mockEmptyTenants
        - mockCrossTenantList
        - waitForRibbonActive
        - waitForSubTabActive
        - assertHttp404
        - assertNoChrome
        - assertChromeVisible
        - clickRetry
  fixtures_required:
    - "vitalia/frontend/e2e/auth.fixture.ts (REUSE F1-S3 Clerk auth — sign-in session)"
    - "vitalia/frontend/e2e/fixtures/routing-shell.fixture.ts (NEW — page.route() handlers for /api/v1/iam/users/me/tenants to mock {tenants:[]}, network timeout, cross-tenant list)"

# ──────────────────────────────────────────────────────────────
# Category 1 — non_functional (lint, format, tsc, vitest unit, pytest, coverage)
# ──────────────────────────────────────────────────────────────
non_functional:
  - id: val-fe-tsc
    description: "TypeScript strict typecheck pass (Next.js 16 params Promise, etc.)"
    command: "cd vitalia/frontend && npx tsc --noEmit"
    must_pass: true
  - id: val-fe-lint
    description: "ESLint 60+ rules pass on src/"
    command: "cd vitalia/frontend && npx eslint src/ --cache"
    must_pass: true
  - id: val-fe-prettier
    description: "Prettier format check"
    command: "cd vitalia/frontend && npx prettier --check 'src/**/*.{ts,tsx,js,jsx,json,md}'"
    must_pass: true
  - id: val-fe-vitest-unit-agent-catalog
    description: "agent-catalog.ts validators unit tests (isValidAgent + isValidSubtab edge cases)"
    command: "cd vitalia/frontend && npx vitest run src/lib/__tests__/agent-catalog.test.ts"
    must_pass: true
  - id: val-fe-vitest-unit-iam-api
    description: "lib/iam/api.ts fetchUserTenants unit tests (happy + 401 + 500 + timeout + empty array)"
    command: "cd vitalia/frontend && npx vitest run src/lib/iam/__tests__/api.test.ts"
    must_pass: true
  - id: val-fe-vitest-unit-audit-helper
    description: "lib/iam/audit.ts logCrossTenantAttempt + logNoTenantsAssigned unit tests"
    command: "cd vitalia/frontend && npx vitest run src/lib/iam/__tests__/audit.test.ts"
    must_pass: true
  - id: val-fe-vitest-coverage
    description: "Vitest run all + coverage 20% threshold (per .claude/rules/frontend-quality.md)"
    command: "cd vitalia/frontend && npx vitest run --coverage"
    must_pass: true
  - id: val-be-pytest-mount-test
    description: "Pytest verifies /api/v1/iam/users/me/tenants registered + vitalia local /me removed"
    command: "cd vitalia/backend && ${WS}/.venv/bin/pytest tests/test_main_iam_routes_mounted.py -v"
    must_pass: true
  - id: val-be-ruff
    description: "Ruff check + format pass on src/main.py change"
    command: "cd vitalia/backend && ${WS}/.venv/bin/ruff check src/main.py && ${WS}/.venv/bin/ruff format --check src/main.py"
    must_pass: true
  - id: val-be-arch-tests
    description: "BE arch fitness suite still green (response_model + redirect_slashes + PHI dual filter)"
    command: "cd vitalia/backend && ${WS}/.venv/bin/pytest tests/architecture/ -x -q"
    must_pass: true

