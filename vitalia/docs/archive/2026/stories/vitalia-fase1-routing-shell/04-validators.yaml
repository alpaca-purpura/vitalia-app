# ──────────────────────────────────────────────────────────────
# Category 4 — agentic_eval (N/A)
# ──────────────────────────────────────────────────────────────
agentic_eval:
  applies: false
  not_applicable_reason: "F1-S9 es routing puro FE + 1-line BE wiring. ZERO agentic surface (no copilot, no sales_agent, no LangGraph state, no prompts, no tools). R23 NO aplica."

# ──────────────────────────────────────────────────────────────
# Category 5 — architectural_validation (★ v4.1 mandatory ≥3 sub-tests)
# ──────────────────────────────────────────────────────────────
architectural_validation:
  sub_tests:
    - id: arch-fsd-imports
      description: "FSD-Lite boundaries: lib/iam/* + (shell-organism)/* NO importan de features/*; features/* NO importan cross-feature."
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test_fsd_boundaries.test.ts"
      must_pass: true
    - id: arch-no-middleware-ts
      description: "Grep guard: middleware.ts MUST NOT exist (Next.js 16 deprecated). proxy.ts is canonical."
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test-no-middleware-ts.test.ts"
      must_pass: true
      file_new: "vitalia/frontend/src/__tests__/architecture/test-no-middleware-ts.test.ts"
    - id: arch-no-dashboard-route-group
      description: "Grep guard: app/(dashboard)/ + app/(app)/ MUST NOT exist (Chris dictum no legacy)."
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test-no-dashboard-route-group.test.ts"
      must_pass: true
      file_new: "vitalia/frontend/src/__tests__/architecture/test-no-dashboard-route-group.test.ts"
    - id: arch-agent-catalog-ssot
      description: "isValidAgent/isValidSubtab exported from agent-catalog.ts (NO duplicate elsewhere)."
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test-agent-catalog-ssot.test.ts"
      must_pass: true
    - id: arch-no-cross-brand-mirror
      description: "Anti-duplication: proxy.ts + lib/iam pattern Vitalia-local — NO mirror to nicolify/comunify/lupulo."
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test-no-cross-brand-shell-mirror.test.ts"
      must_pass: true
    - id: arch-no-voseo
      description: "All user-facing strings in not-found + network fallback + sign-in error are Spanish neutro (no voseo)."
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test_no_voseo_in_copy.test.ts src/__tests__/architecture/test-vitalia-ui-strings-no-voseo.test.ts"
      must_pass: true
    - id: arch-no-hardcoded-colors
      description: "not-found + network fallback usan semantic tokens (text-muted-foreground, opacity-50) — NO hex hardcoded."
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test_no_hardcoded_colors.test.ts"
      must_pass: true
    - id: arch-server-first
      description: "All routing pages are Server Components except [agent]/not-found.tsx + RefreshButton.tsx (both justified)."
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test_server_first.test.ts"
      must_pass: true
    - id: arch-skip-link
      description: "Skip-link target inherited from F1-S4 ShellOrganismLayout still in place."
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test-skip-link-target.test.ts"
      must_pass: true
    - id: arch-no-clerk-organizations
      description: "NO Clerk Organizations usage (per memory file no-clerk-organizations.md)."
      command: "cd vitalia/frontend && npx vitest run src/__tests__/architecture/test-no-clerk-organizations.test.ts"
      must_pass: true
    - id: arch-be-response-model
      description: "BE response_model= required (core router already compliant; arch test re-verifies)."
      command: "cd vitalia/backend && ${WS}/.venv/bin/pytest tests/architecture/test_vitalia_response_models_required.py -v"
      must_pass: true
    - id: arch-be-redirect-slashes
      description: "BE FastAPI app instantiated with redirect_slashes=False."
      command: "cd vitalia/backend && ${WS}/.venv/bin/pytest tests/architecture/ -k 'redirect_slashes' -v"
      must_pass: true

# ──────────────────────────────────────────────────────────────
# Validators summary
# ──────────────────────────────────────────────────────────────
validators_summary:
  total: 30
  non_functional: 10
  functional: 9
  visual: 6
  agentic_eval: 0   # N/A category
  architectural_validation: 12
  zero_skips: true   # no validator marked must_pass=false in this story
