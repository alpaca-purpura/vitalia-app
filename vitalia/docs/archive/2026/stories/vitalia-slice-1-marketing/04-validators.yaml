# ────────────────────────────────────────────────────────────────────────
# Visual tests (E2E smoke + visual regression + performance budget)
# ────────────────────────────────────────────────────────────────────────
visual:
  - id: e2e_smoke_marketing
    must_pass: true
    description: Playwright smoke — load /marketing · bowtie SVG render · click stage tab · Lucas card visible · modal open+close
    command: cd ${ws_root}/vitalia/frontend && E2E_BASE_URL=http://localhost:3002 npx playwright test --project=smoke e2e/specs/smoke/marketing.smoke.spec.ts --reporter=list

  - id: visual_regression_bowtie_svg
    must_pass: true
    description: Chromatic visual regression bowtie SVG pixel-invariante (5 stages × 4 breakpoints = 20 baselines) + supporting components (Lucas card 4 states · AttributionMatrix 8 variants · ReferralsWidget 3 · ChannelBreakdownRow 20)
    command: cd ${ws_root}/vitalia/frontend && npx chromatic --exit-zero-on-changes --skip 'dependabot/**' --build-script-name=build-storybook --auto-accept-changes=false

  - id: visual_perf_budget_lighthouse
    must_pass: true
    description: Lighthouse CI perf budget LCP<2.5s · INP<200ms · CLS<0.1 on /marketing route
    command: cd ${ws_root}/vitalia/frontend && npx lighthouse-ci collect --url=http://localhost:3002/marketing --numberOfRuns=3 && npx lighthouse-ci assert --preset=lighthouse:recommended

  - id: visual_a11y_axe
    must_pass: true
    description: Axe a11y scan WCAG 2.1 AA on /marketing route
    command: cd ${ws_root}/vitalia/frontend && E2E_BASE_URL=http://localhost:3002 npx playwright test --project=smoke e2e/specs/a11y/marketing.a11y.spec.ts --reporter=list

  - id: visual_bowtie_bundle_size
    must_pass: true
    description: Bowtie SVG bundle size budget < 30KB gzipped
    command: cd ${ws_root}/vitalia/frontend && node scripts/check-bowtie-bundle.mjs

