  creation_order:
    # BE (T-BE-2..6)
    - 1: "domain AvailabilityBlock validation test (recurrence-end-condition-required) RED -> domain impl GREEN"
    - 2: "credential_validator test (PE/AR/MX/CL) RED -> impl GREEN"
    - 3: "AvailabilityProjectionService rrule test (weekly/biweekly/end_date/occurrences/one-off/open-ended-90d) RED -> impl GREEN"
    - 4: "DoctorRepository dual-filter + pgcrypto encrypt/decrypt test RED -> impl GREEN"
    - 5: "availability_block_mutable test (reproject future, delete preserves confirmed) RED -> impl GREEN"
    - 6: "bio_generation_service no-invent + fallback test RED -> impl GREEN"
    - 7: "doctors_api test (response_model, RBAC admin_clinic, masking, pagination, soft-deactivate) RED -> router GREEN"
    - 8: "cross_tenant + dni_race + public allowlist tests RED -> GREEN"
    - 9: "migration 036 idempotency test (clone DB 2x) RED -> migration GREEN"
    # FE (T-FE-*)
    - 10: "useStaffList/useDoctor/useAvailabilityBlocks hook tests (MSW) RED -> hooks GREEN"
    - 11: "EntitySubNavBar test (enabled/disabled leaves, a11y roving) RED -> component GREEN"
    - 12: "StaffCard/StaffDirectoryView/NuevoIntegranteModal vitest RED -> GREEN"
    - 13: "AvailabilityCalendar/BloquePopover vitest (drag-to-create, recurrence popover) RED -> GREEN"
    - 14: "BioRepoInputs/GeneratedBioSections/AvatarUploader vitest RED -> GREEN"
    - 15: "Playwright e2e SC-1..SC-11 + axe wcag2aa + visual goldens (6+1)"
  scenario_to_test:
    SC-1: [V-FN-1]
    SC-1b: [V-FN-2]
    SC-1c: [V-FN-3]
    SC-1d: [V-FN-4]
    SC-2: [V-FN-5]
    SC-3: [V-FN-6]
    SC-3b: [V-FN-7]
    SC-4: [V-NF-1]
    SC-5: [V-NF-2]
    SC-6: [V-NF-3]
