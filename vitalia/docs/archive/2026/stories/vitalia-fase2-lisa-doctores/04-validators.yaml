#   (audit /pm-vitalia 2026-06-11: verification_nature/technical_gates/demo_required/
#    business_rules/regression_guard were ABSENT — pre-proceso-v5 schema). Existing v4.1
#    validators CONSERVED below; delta validators (D3-*) APPENDED. NOT destroyed.
# 5 categories: non_functional / functional / visual / architectural_validation / agentic_eval(N/A — bio-gen NOT agentic, see 03-arch D-4)
story_id: vitalia-fase2-lisa-doctores
schema_version: v5
scenario_coverage: 100%   # SC-1..SC-11 (built) + SC-D3A/B/C/D/E/F (delta v3)

# ── D-X4 backfill (proceso v5 · top-level keys) ────────────────────────────────
verification_nature: ambas        # técnica (gates auto + efecto/logs) + funcional (anti-burbuja e2e + demo Chris)

demo_required: true               # funcional UI → demo manual Chris en G (chris_verify.signoff), ANTES del auditor
runtime_error_gate: required      # e2e fixtures/base.ts: 0 pageerror / 0 console-error / 0 /api ≥400 / 0 Next overlay
dev_app_verified:
  required: true
  evidence: ""                    # /dev-team llena tras live-verify dev-app (≥1 write real + logs BE + efecto DB)

technical_gates:
  baseline:                       # corren siempre (todas las superficies del delta)
    - tsc_noemit
    - eslint
    - ruff
    - mypy
    - arch_fitness                # incl test-no-native-select (D3-F) + test-no-div-layout + public allowlist
    - vitest_unit
    - pytest_unit
    - jscpd                       # no duplicación (FE consume occurrences SSoT — no re-expandir client-side)
  mutation:                       # mutmut BE / Stryker FE — diff-scoped sobre líneas NUEVAS
    mode_by_surface:
      - surface: "clinics/application/availability_projection_service.py (D3-C/D3-F: byweekday list + interval + range projection)"
        mode: hard                # 100% mutantes muertos sobre líneas nuevas — proyección = corazón del fix
      - surface: "alembic/versions/041_*.py + 042_*.py (D3-D/D3-F migración compat backfill)"
        mode: hard                # backfill compat es crítico (RN-D3F-3 legacy projects idéntico)
      - surface: "clinics/application/public_doctor_serializer.py (D3-D structured allow-list)"
        mode: hard                # allow-list = security boundary PHI
      - surface: "resto del delta (endpoints CRUD, FE componentes)"
        mode: advisory            # degrada si tool ausente (no rompe ci-parity)

regression_guard:
  # Tests existentes que NO deben cambiar de comportamiento (el delta es additive).
  backend_suites_must_stay_green:
    - "vitalia/backend/tests/modules/vitalia/clinics/**  (23 archivos test · suite clinics existente — D3-* es additive)"
    - "vitalia/backend/tests/architecture/**  (phi_dual_filter, response_model, migrations_idempotent, public_doctors_allowlist, clinics_domain_no_engine_imports)"
    - "core/@luana/ui-kit unit suite (EntitySubNavBar.test.tsx + EntityWorkspaceLayout.test.tsx — back-compat: optional picker slot NO rompe adrian/ICPs consumers)"
  frontend_suites_must_stay_green:
    - "vitalia/frontend vitest co-located staff/** (49+ tests existentes)"
    - "vitalia/frontend/src/__tests__/architecture/** (no-div-layout, no-native-select, ribbon-no-shadcn-tabs, fsd_boundaries)"
  must_not_regress:
    - "NuevoIntegranteModal infinite-loop fix (regression_2026-06-06) — ya FIXED; re-verify es de /dev-team, NO se re-rompe"
    - "Calendar week paint para bloques legacy single-day (RN-D3F-3 / SC-D3F-4)"
    - "Public endpoint existente GET /api/public/clinic/{tenant_slug}/doctors (lista) — el per-doctor route es additive"

business_rules:
  # RN delta → @rule-tag (gherkin) → SC que lo verifica. Cada RN tiene cobertura.
  - rule_id: RN-D3A-1
    tag: "@rule-D3A-picker-server-filter"
    desc: "Picker lista solo staff del tenant actual (filtro server, jamás client-side de colección completa)"
    scenarios: [SC-D3A-1, SC-D3A-2]
  - rule_id: RN-D3A-2
    tag: "@rule-D3A-inactive-hidden"
    desc: "Doctor inactivo no aparece en el picker (active=true)"
    scenarios: [SC-D3A-3]
  - rule_id: RN-D3B-1
    tag: "@rule-D3B-delete-not-alter-bio"
    desc: "Eliminar archivo NO altera la bio/perfil generado previo (snapshot)"
    scenarios: [SC-D3D-5]      # verif via overwrite-confirm path
  - rule_id: RN-D3B-2
    tag: "@rule-D3B-reject-inline"
    desc: "Archivo rechazado (tipo/tamaño) → feedback inline; jamás subida silenciosa fallida"
    scenarios: [SC-D3B-3]
  - rule_id: RN-D3B-3
    tag: "@rule-D3B-overwrite-confirm"
    desc: "Regenerar con perfil existente requiere confirmación explícita (pisa ediciones manuales)"
    scenarios: [SC-D3D-5]
  - rule_id: RN-D3B-4
    tag: "@rule-D3B-generated-at-ia-only"
    desc: "bio_generated_at se actualiza SOLO en generación IA (no en ediciones manuales)"
    scenarios: [SC-D3D-4]
  - rule_id: RN-D3D-1
    tag: "@rule-D3D-public-no-phi-no-insumos"
    desc: "Página pública expone solo perfil estructurado + datos no-PHI (jamás insumos crudos ni documentos)"
    scenarios: [SC-D3D-1]
  - rule_id: RN-D3D-2
    tag: "@rule-D3D-toggle-off-not-broken"
    desc: "URL estable (slug); toggle OFF → 'perfil no disponible' (no 404 roto, no leak)"
    scenarios: [SC-D3D-2]
  - rule_id: RN-D3D-4
    tag: "@rule-D3D-material-new-server"
    desc: "Detección de material nuevo = timestamps insumos vs bio_generated_at (server, no heurística client)"
    scenarios: [SC-D3D-4]
  - rule_id: RN-D3D-5
    tag: "@rule-D3D-idiomas-conditional"
    desc: "Sección Idiomas se renderiza pública solo si el doctor habla más de un idioma"
    scenarios: [SC-D3D-3]
  - rule_id: RN-D3D-6
    tag: "@rule-D3D-partial-profile-minimum"
    desc: "Página renderiza con las secciones que existan — mínimo garantizado (identidad); sección vacía se omite (nunca caja vacía)"
    scenarios: [SC-D3D-9]
  - rule_id: RN-D3D-7
    tag: "@rule-D3D-og-tags-whatsapp"
    desc: "Página emite Open Graph (og:title/description/image) → preview decente en WhatsApp (link de Adrián). Sin PHI en OG"
    scenarios: [SC-D3D-10]
  - rule_id: RN-D3D-8
    tag: "@rule-D3D-missing-photo-fallback"
    desc: "Sin foto → avatar iniciales + og:image fallback marca (nunca imagen rota)"
    scenarios: [SC-D3D-11]
  - rule_id: RN-D3D-9
    tag: "@rule-D3D-slug-anti-enumeration"
    desc: "Slug inexistente/apagado/cross-tenant → MISMA vista 'perfil no disponible' (anti-enumeración, indistinguible)"
    scenarios: [SC-D3D-12, SC-D3D-6]
  - rule_id: RN-D3E-1
    tag: "@rule-D3E-month-projection-exact"
    desc: "Vista mes refleja EXACTAMENTE las ocurrencias proyectadas por el BE (occurrences=2 → 2 fechas)"
    scenarios: [SC-D3E-1, SC-D3C-1]
  - rule_id: RN-D3E-2
    tag: "@rule-D3E-month-read-only"
    desc: "Sin escritura desde la vista mes (read + navegación) en este MVP"
    scenarios: [SC-D3E-2]
  - rule_id: RN-D3C-occurrences
    tag: "@rule-D3C-views-consume-be-projection"
    desc: "Ambas vistas (semana+mes) consumen la proyección BE; muere recurrentBlockVisibleInWeek + expansión client-side"
    scenarios: [SC-D3C-1, SC-D3C-2, SC-D3C-3, SC-D3C-4, SC-D3C-5, SC-D3C-6, SC-D3C-7, SC-D3C-8]
  - rule_id: RN-D3F-1
    tag: "@rule-D3F-summary-same-source"
    desc: "Resumen humano refleja EXACTAMENTE la regla persistida (misma fuente, no texto paralelo)"
    scenarios: [SC-D3F-3]
  - rule_id: RN-D3F-2
    tag: "@rule-D3F-count-occurrences-semantics"
    desc: "multi-día × occurrences → count cuenta OCURRENCIAS totales (no semanas) — semántica Google"
    scenarios: [SC-D3F-1]
  - rule_id: RN-D3F-3
    tag: "@rule-D3F-legacy-projects-identical"
    desc: "Bloques legacy (single day) siguen proyectando idéntico post-migración"
    scenarios: [SC-D3F-4]

