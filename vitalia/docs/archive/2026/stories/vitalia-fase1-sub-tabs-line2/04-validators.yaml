# Categorías v4.1:
#   1. non_functional       — tsc, lint, prettier, vitest unit + coverage
#   2. functional           — E2E Playwright (1 spec per Gherkin scenario funcional, 9 specs)
#   3. visual               — Playwright visual goldens (13 PNGs mockup ratchet shrink-only)
#   4. agentic_eval         — N/A (declarar razón explícita)
#   5. architectural_validation — FSD-Lite + arch tests EXTEND + spanish neutro + no-hex + no-vt-classes + server-first allowlist

story_id: vitalia-fase1-sub-tabs-line2
brand: vitalia
phase: fase-1
last_modified: 2026-05-25
architect_iter: 1
playwright_required: true   # ui-story HARD per v4.1

scenario_coverage:
  total_scenarios: 9
  mapped: 9
  coverage_pct: 100
  scenarios:
    - id: SC-1
      title: "happy · click sub-tab navega correctly"
      validator_ids: [val-fe-e2e-nav, val-fe-visual-active-lisa, val-fe-visual-active-lisa-dark]
    - id: SC-2
      title: "happy · cambio de agente re-renderiza sub-tabs"
      validator_ids: [val-fe-e2e-agent-change, val-fe-visual-active-lucas, val-fe-visual-active-lucas-dark]
    - id: SC-3
      title: "happy · deep link a sub-tab arbitraria marca active state"
      validator_ids: [val-fe-e2e-deeplink, val-fe-visual-active-camila, val-fe-visual-active-camila-dark]
    - id: SC-4
      title: "negative · activeAgent null → SubTabsBar oculto"
      validator_ids: [val-fe-e2e-null-agent]
    - id: SC-5
      title: "edge · sub-tab URL inválida → ningún SubTab active"
      validator_ids: [val-fe-e2e-invalid-subtab]
    - id: SC-6
      title: "edge · viewport mobile 375px → horizontal scroll Lucas (5 sub-tabs)"
      validator_ids: [val-fe-e2e-mobile-overflow, val-fe-visual-mobile-lucas-375]
    - id: SC-7
      title: "adversarial · XSS en sub-tab segment → safe"
      validator_ids: [val-fe-e2e-xss-guard]
    - id: SC-8
      title: "a11y · keyboard navigation roving tabindex"
      validator_ids: [val-fe-e2e-keyboard, val-fe-axe]
    - id: SC-9
      title: "i18n · microcopy Spanish neutro renderizado correcto"
      validator_ids: [val-fe-e2e-i18n]

sub_categories_coverage:
  race_condition:
    applies: false
    not_applicable_reason: "SubTabsBar es UI navegacional pura: sin create/update, sin unique constraint. router.push es idempotente. Sin DB writes ni concurrent state mutation. Data viene de constante estática import + URL."
  concurrent_users:
    applies: false
    not_applicable_reason: "Sin shared state cross-user, sin list/detail filterable. Cada user navega su URL propia client-side derived. RIBBON_SUBTABS es constante module-level (zero per-user state)."
  network_failure:
    applies: false
    not_applicable_reason: "SubTabsBar NO hace fetch FE — solo router.push (next-routing local). Cero network dependency (no avatar PNG load — emojis nativos unicode). Diferencia clave con F1-S7 Ribbon que sí depende de thumbnail PNG."
  large_dataset:
    applies: false
    not_applicable_reason: "Máximo 5 sub-tabs por agente (Lucas). Bounded constante. Sin pagination posible. Lookup directo RIBBON_SUBTABS[agent] retorna array fijo ≤5 elementos."
  empty_state:
    applies: false
    not_applicable_reason: "RIBBON_SUBTABS siempre populated para los 6 ribbon tab slugs válidos. SC-4 (activeAgent null) NO es empty data state — es ausencia de surface (return null total). SC-5 (invalid subtab) NO es empty — sub-tabs renderizan, solo ninguno active."
  accessibility:
    applies: true
    covered_by: [val-fe-e2e-keyboard, val-fe-axe]
  i18n:
    applies: true
    covered_by: [val-fe-e2e-i18n]

iteration:
  max_iterations: 10
  on_fail: "fix targeted file (single file edit per iter, no scope creep beyond § 5 files_in_scope of 05-guidelines.md)"
  cap_reached_action: "escalate Chris with T-{n}-impl-log.md cap_reached summary; do NOT auto-disable any validator"

