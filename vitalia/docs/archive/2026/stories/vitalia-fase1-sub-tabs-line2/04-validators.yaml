validators:
  non_functional:

    - id: val-fe-tsc
      description: "TypeScript strict (no any, no implicit, FSD boundaries respect, React 19 types ok, satisfies Record check sobre RIBBON_SUBTABS exhaustivo)"
      command: "cd vitalia/frontend && npx tsc --noEmit"
      must_pass: true

    - id: val-fe-lint
      description: "ESLint cache scoped a archivos F1-S8 + shell-organism + lib + arch tests"
      command: "cd vitalia/frontend && npx eslint src/components/shared/shell-organism src/lib src/__tests__/architecture --cache --cache-location .eslintcache"
      must_pass: true

    - id: val-fe-prettier
      description: "Prettier format check on new + modified files"
      command: "cd vitalia/frontend && npx prettier --check 'src/components/shared/shell-organism/{SubTab,SubTabsBar,AppPanelSlot,_agent-tw-classes}*.{ts,tsx}' 'src/lib/agent-catalog.ts' 'src/lib/__tests__/agent-catalog.test.ts'"
      must_pass: true

    - id: val-fe-vitest-unit
      description: "Vitest unit: agent-catalog EXTEND + SubTab + SubTabsBar + AppPanelSlot integration + arch tests EXTEND + coverage threshold 20% (component-level target ≥80% logic-heavy: SubTabsBar.tsx + extractSubtabFromPath)"
      command: "cd vitalia/frontend && npx vitest run src/components/shared/shell-organism src/lib src/__tests__/architecture --reporter=default --coverage --coverage.thresholds.lines=20 --coverage.thresholds.functions=20"
      must_pass: true

