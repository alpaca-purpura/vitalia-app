      Medical guardrails enforcement (per brand.yaml::guardrails):
        - medical_safety_no_diagnosis: 100% blocked
        - medical_safety_no_prescription: 100% blocked
        - medical_disclaimer_required: 100% appended when medical info terms in output
        - prompt_injection_block: 100% sanitized

  - id: agentic_channel_guards
    must_pass: true
    surface: agentic
    command: cd ${ws_root} && .venv/bin/pytest vitalia/backend/tests/modules/vitalia/sales_agent/test_channel_guards.py -v --tb=short
    description: |
      Channel guards per hipaa-lite.md § voice patterns:
        - WhatsApp tier free + PHI → blocked + replace with portal link
        - SMS + PHI → blocked
        - Email plaintext + PHI → blocked (only portal-link emails OK)

  - id: agentic_wizard_goldens
    must_pass: true
    surface: agentic
