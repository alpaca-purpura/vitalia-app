# ============================================================
# Iteration loop (consumed by /dev-team)
# ============================================================
iteration_loop:
  picker_strategy: |
    /dev-team picks ticket from 06-tickets.yaml respecting:
    1. DAG dependencies (no dep cycles)
    2. blocked_by side stories (skip until shipped/developed)
    3. WIP cap 3 (developing state)
    4. validator_ids declared in each ticket (subset of category ids above)
  
  run_strategy: |
    Per ticket build loop:
    1. RED test for each layer per acceptance.test_paths
    2. Implement per ticket.scope
    3. Run validator_ids declared in ticket.acceptance.validator_ids
    4. ALL GREEN → ticket developed, push wip/* branch, move next ticket
    5. After max 5 iterations FAIL → escalate Chris (state=blocked)

