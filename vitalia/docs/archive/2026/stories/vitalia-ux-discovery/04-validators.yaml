# ============================================================
# Category 3 — VISUAL (perf budget + responsive breakpoints + visual regression + a11y)
# ============================================================
visual:

  - id: visual_regression_bowtie_svg
    must_pass: true
    surface: frontend
    command: cd ${ws_root}/vitalia/frontend && npx chromatic --project-token=${CHROMATIC_PROJECT_TOKEN} --only-changed --exit-zero-on-changes
    description: |
      Bowtie SVG pixel-invariante mantenimiento per spec § Handoff #9.
      Snapshot per breakpoint: mobile 768 · tablet 1024 · desktop 1440.
      Storybook stories per component (per 03-arch-fe.md § 6 Storybook obligatorio).
    skip_if_env_missing: CHROMATIC_PROJECT_TOKEN

  - id: visual_perf_budget_lighthouse
    must_pass: true
    surface: frontend
    command: cd ${ws_root}/vitalia/frontend && npx lighthouse-ci collect --url=http://localhost:3002/inbox --url=http://localhost:3002/pipeline --url=http://localhost:3002/agenda --url=http://localhost:3002/fidelizacion --url=http://localhost:3002/marketing
    description: |
      Performance budget Slice 1 per spec § Handoff #7:
        LCP < 2.5s
        INP < 200ms
        CLS < 0.1
        Bowtie SVG bundle < 30KB gzipped
    thresholds:
      LCP_ms: 2500
      INP_ms: 200
      CLS: 0.1
      bowtie_svg_kb_gzipped: 30

  - id: visual_a11y_axe
    must_pass: true
    surface: frontend
    command: cd ${ws_root}/vitalia/frontend && E2E_BASE_URL=http://localhost:3002 npx playwright test --project=a11y e2e/specs/a11y/
    description: |
      WCAG 2.1 AA compliance per spec § Handoff #11.
      Bowtie SVG <title>+aria-labelledby. Lucas cards keyboard nav. Contrast ratios. prefers-reduced-motion fallback.

  - id: visual_responsive_breakpoints
    must_pass: true
    surface: frontend
    command: cd ${ws_root}/vitalia/frontend && E2E_BASE_URL=http://localhost:3002 npx playwright test --project=responsive e2e/specs/responsive/
    description: Responsive smoke per breakpoint (768 mobile · 1024 tablet · 1440 desktop) — 6 routes.

  - id: visual_storybook_build
    must_pass: true
    surface: frontend
    command: cd ${ws_root}/vitalia/frontend && npx storybook build --output-dir storybook-static
    description: |
      Storybook builds successfully (12 component stories obligatorios per spec § Handoff #8):
      AgentAvatar · LucasStageRecommendationsCard · MarketingBowtieSVG · ChannelBreakdownRow ·
      AttributionMatrixWidget · ContactSidebar · WizardChatThread · DepositBadge · AgentAttribution ·
      PiiMaskedSpan · RequireRole · ActivityStreamSticky.

# ============================================================
# Category 4 — AGENTIC EVAL (pass^k + trajectory + cost budget + voice_fidelity + medical guardrails)
# ============================================================
agentic_eval:

  - id: agentic_pass_k_adrian_goldens
    must_pass: true
    surface: agentic
    command: cd ${ws_root} && RUN_LLM_JUDGE=1 .venv/bin/pytest vitalia/backend/tests/agentic_evals/sales_agent/test_goldens_pass_k.py -v --tb=short
    description: |
      Adrián sales_agent 12 goldens (3 dental + 3 estética + 3 psicología + 3 fertilidad) — pass^k:
        k=3 trials per golden
        per_trial_threshold = 0.66 (≥2/3 dimensions pass)
        pass_k_threshold = 0.5 (≥50% of goldens pass k=3)
    config:
      k: 3
      per_trial_threshold: 0.66
      pass_k_threshold: 0.5

  - id: agentic_trajectory_adrian
    must_pass: true
    surface: agentic
    command: cd ${ws_root} && RUN_LLM_JUDGE=1 .venv/bin/pytest vitalia/backend/tests/agentic_evals/sales_agent/test_trajectory.py -v --tb=short
    description: |
      Trajectory eval — expected tool calls per scenario:
        dental scenario 1: screening_questions → send_template_confirmation → send_payment_link
        estetica scenario 1: screening_questions → (contraindication detected) → escalate doctor (no payment_link)
        psicologia scenario 1: safety_guard activated → escalate emergencia (no booking)
        fertilidad scenario 3: reschedule_appointment (cycle-aware)

  - id: agentic_cost_budget
    must_pass: true
    surface: agentic
    command: cd ${ws_root} && .venv/bin/pytest vitalia/backend/tests/agentic_evals/sales_agent/test_cost_budget.py -v --tb=short
    description: |
      Cost budget per turn:
        cost_usd_max: 0.05 USD per turn Adrián
        tokens_max: 6000 input+output
        latency_p95_max: 8.0s per turn
        cache_hit_rate_min: 0.60 (60% per spec § Handoff agentic)
    config:
      cost_usd_max: 0.05
      tokens_max: 6000
      latency_p95_max: 8.0
      cache_hit_rate_min: 0.60

  - id: agentic_voice_fidelity_grader
    must_pass: true
    surface: agentic
    command: cd ${ws_root} && RUN_LLM_JUDGE=1 .venv/bin/pytest vitalia/backend/tests/agentic_evals/sales_agent/test_voice_fidelity_vitalia.py -v --tb=short
