# vitalia-ux-discovery — Validators
# ★ CRITICAL ★ tests ejecutables, must_pass:true c/u
# Owner: /architect Opus 4.7 · 2026-05-17
# Consumer: /dev-team build loop iterates against these · /auditor C1-C5 reviews

version: 1
story_id: vitalia-ux-discovery
brand: vitalia
ws_root: /home/chalreme/Proyectos/luana-platform
brand_root: vitalia
state_target: developing → developed when ALL validators GREEN

# Iteration cap: /dev-team max 5 iterations per ticket before escalate
iteration_cap: 5

# ============================================================
# Category 1 — NON-FUNCTIONAL (lint + format + arch fitness + duplication + circular deps)
# ============================================================
non_functional:

  # ---- Backend ----

  - id: be_lint_ruff_check
    must_pass: true
    surface: backend
    command: cd ${ws_root} && .venv/bin/ruff check vitalia/backend/src/ vitalia/backend/tests/ --no-cache
    description: Ruff 70+ rules, 0 errors. Line 120.

  - id: be_format_ruff
    must_pass: true
    surface: backend
    command: cd ${ws_root} && .venv/bin/ruff format --check vitalia/backend/src/ vitalia/backend/tests/
    description: Ruff format check (double quotes, spaces).

  - id: be_arch_fitness_brand
    must_pass: true
    surface: backend
    command: cd ${ws_root} && .venv/bin/pytest vitalia/backend/tests/architecture/ -v --override-ini="addopts=" -x -q --tb=short
    description: |
      Brand arch fitness suite. Includes:
        - test_phi_dual_filter.py (tenant_id+clinic_id cardinal)
        - test_no_cross_brand_imports.py
        - test_no_legacy_paths.py (post-multibrand-reorg)
        - test_response_model_required.py (PII allowlist)
        - test_migrations_idempotent.py (IF NOT EXISTS)
        - test_extension_sdk_registration.py
        - test_audit_log_sync_write.py (NEW Slice 1)
        - test_pgcrypto_phi_columns.py (NEW Slice 1)
        - test_no_observability_mirror.py (anti-duplication §0)
        - test_ddd_inside_out_boundaries.py

  - id: be_arch_fitness_engine_consult_readonly
    must_pass: true
    surface: backend
    command: cd ${ws_root} && .venv/bin/pytest core/luana-core-extension-sdk/tests/test_registry_brand_smoke.py core/luana-core-observability/tests/architecture/ -v --override-ini="addopts=" -x -q --tb=short
    description: Engine arch fitness smoke (READ-ONLY consult — no engine modifications proposed; this gate detects accidental engine mutation by builder).

  - id: be_pip_audit
    must_pass: true
    surface: backend
    command: cd ${ws_root} && .venv/bin/pip-audit -r vitalia/backend/pyproject.toml --ignore-vuln GHSA-* || true
    description: Dependency vulnerability scan (non-blocking warns; blocking on CRITICAL).
    treat_warnings_as: warn

  # ---- Frontend ----

  - id: fe_typecheck_tsc
    must_pass: true
    surface: frontend
    command: cd ${ws_root}/vitalia/frontend && npx tsc --noEmit
    description: TypeScript strict, 0 errors.

  - id: fe_lint_eslint
    must_pass: true
    surface: frontend
    command: cd ${ws_root}/vitalia/frontend && npx eslint src/ --cache --cache-location .eslintcache --max-warnings 0
    description: ESLint 60+ rules + boundaries plugin (FSD), sonarjs, react-perf, prettier.

  - id: fe_arch_fitness
    must_pass: true
    surface: frontend
    command: cd ${ws_root}/vitalia/frontend && npx vitest run src/__tests__/architecture/ --reporter=default
    description: |
      FE arch fitness suite (vitalia/frontend/src/__tests__/architecture/):
        - test_no_hardcoded_colors.test.ts (HEX literales forbidden outside globals.css)
        - test_no_hardcoded_strings.test.ts (user-facing strings in copy.ts)
        - test_fsd_boundaries.test.ts (FSD boundary matrix)
        - test_no_cross_feature_imports.test.ts (Public API via index.ts)
        - test_server_first.test.ts ("use client" only on leaf nodes — allowlist shrinks)
        - test_phi_pii_components_used.test.ts (PHI surfaces wrapped)
        - test_no_voseo_in_copy.test.ts (Spanish neutro per spanish-text.md)
        - test_page_padding.test.ts (design tokens consistency)

  - id: fe_jscpd_dup
    must_pass: true
    surface: frontend
    command: cd ${ws_root}/vitalia/frontend && npx jscpd src/ --threshold 5 --reporters consoleFull,html
    description: Duplication detector (threshold 5%).

  - id: fe_madge_cycle
    must_pass: true
    surface: frontend
    command: cd ${ws_root}/vitalia/frontend && npx madge --circular src/
    description: Circular dependency check.

  # ---- Cross ----

  - id: anti_duplication_cross_module_audit
    must_pass: true
    surface: cross
    command: |
      cd ${ws_root} && bash -c '
      # Grep for mirror anti-patterns per .claude/rules/anti-duplication.md inventory
      VIOLATIONS=$(grep -rln "class.*\(BaseObservabilityContext\|BaseAgentCallbackHandler\|FXResolver\|PricingSnapshot\|TenantBillingConfig\|BaseExtractionOrchestrator\)" vitalia/backend/src/modules/vitalia/copilot/ vitalia/backend/src/modules/vitalia/sales_agent/ 2>/dev/null | xargs grep -L "from luana_core_observability\|from luana_core_extraction\|from luana_core_billing\|from luana_core_platform" 2>/dev/null || true)
      if [ -n "$VIOLATIONS" ]; then
        echo "VIOLATION: shared abstractions mirrored without engine import:"
        echo "$VIOLATIONS"
        exit 1
      fi
      echo "OK: no cross-brand mirrors detected"
      '
    description: Anti-duplication §0 cardinal — shared abstractions must heredancia from engine.

  - id: spanish_neutro_voseo_check
    must_pass: true
    surface: cross
    command: |
      cd ${ws_root} && bash -c '
      # Voseo glossary scan per .claude/rules/spanish-text.md § R2 (UI chrome only — not sales_agent output)
      COPY_FILES=$(find vitalia/frontend/src/features/*/copy.ts vitalia/frontend/src/components/shared/microcopy/ -name "*.ts" 2>/dev/null)
      VOSEO_PATTERN="(vos|sos|tenés|querés|podés|sabés|hacés|venís|decís|mirá|dejá|poné|usá|hacé|elegí|seleccioná|arrancá|agregá|configurá|revisá|escribí|guardá|abrí|volvé|andá|cambiá|ofrecés|cobrás|activás|listá|probá|mostrá|compartí|contá|explicá|fijate|acordate|dale)"
      VIOLATIONS=""
      for FILE in $COPY_FILES; do
        if [ -f "$FILE" ]; then
          if ! grep -qE "voseo-allowed" "$FILE"; then
            if grep -qiE "$VOSEO_PATTERN" "$FILE"; then
              VIOLATIONS+="$FILE\n"
            fi
          fi
        fi
      done
      if [ -n "$VIOLATIONS" ]; then
        echo -e "Voseo detected in:\n$VIOLATIONS"
        exit 1
      fi
      echo "OK: no voseo in user-facing copy"
      '
    description: Voseo glosario scan en copy.ts files (magic comment escape per spanish-text.md R25).

  - id: anti_default_flip_audit_zero_slice1
    must_pass: true
    surface: cross
    command: |
      cd ${ws_root} && bash -c '
      # Slice 1 explicitly introduces ZERO default flag flips. Verify no commits propose flips.
      DIFF=$(git diff --name-only HEAD~5..HEAD 2>/dev/null | xargs grep -l "USE_OUTBOX_PATTERN_\|USE_DEEPAGENTS_\|LITELLM_PROXY_ENABLED" 2>/dev/null || true)
      if [ -n "$DIFF" ]; then
        echo "WARN: feature flag files modified — verify no default flip per anti-default-flip-audit.md"
        echo "$DIFF"
      fi
      echo "OK"
      '
    description: Anti-default-flip audit (zero flips Slice 1 per architect ratification).

  - id: capability_yaml_freshness_post_merge
    must_pass: false  # post-merge action, not pre-merge gate
    surface: cross
    command: cd ${ws_root} && python scripts/reconcile_capabilities.py vitalia
    description: |
      Post-merge SSoT reconciliation (per pm-redesign-2026-05). Updates expected at merge:
      - vitalia/docs/product/capabilities/inbox/conversational-segmented.yaml
      - vitalia/docs/product/capabilities/pipeline/consultive-funnel-6stages.yaml
      - vitalia/docs/product/capabilities/agenda/4origins-3layers-cobro.yaml
      - vitalia/docs/product/capabilities/fidelizacion/4patterns-reengagement.yaml
      - vitalia/docs/product/capabilities/marketing/bowtie-5stages-lucas.yaml
      - vitalia/docs/product/capabilities/onboarding/wizard-agentic-voz-clonada.yaml
      - vitalia/docs/product/modules/{inbox,pipeline,agenda,fidelizacion,marketing,onboarding}.md

