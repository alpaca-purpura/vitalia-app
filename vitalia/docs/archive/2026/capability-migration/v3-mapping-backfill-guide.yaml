# Schema: <tech_module>/<slug>:
#   agent_owner: lisa | valeria | adrian | lucas | camila | config | infra
#   functional_area: <agent>.<area-kebab>
#   user_visible: true | false
#   nature: feature | scaffold | extension-point
#   user_facing_name: <human-readable>
#   user_facing_description_seed: <1-2 sentences seed · subagent expands>
#   merge_to: <optional · slug del cap final si parte de un merge>

