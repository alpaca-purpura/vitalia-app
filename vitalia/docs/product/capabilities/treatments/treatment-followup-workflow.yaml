## Dependencies

- `core/luana-core-platform` (LangGraph 2.0 base + RedisSaver)
- `core/luana-core-scheduling` (cron_worker + calendar EXTEND)
- `core/luana-core-llm` (LLM router para tool reasoning)
- `vitalia.agentic.tools.*` (4 tools consumidos por workflow)

## Scenarios live

- Cron dispara secuencia de follow-up para plan de tratamiento activo
- Workflow checa pago prepaid → si bajo, prompt al paciente para top-up
- Workflow requesta consentimiento → paciente firma vía consent_signature_modal
- Workflow detecta reschedule needed → busca slot doctor → notifica ambas partes
- Doctor toma handoff manual → workflow pausa → conversación humana
- Doctor libera handoff → workflow resume desde checkpoint
- Follow-up check loop cubre 7 acciones (status, vitals, adherence, side-effects, satisfaction, next steps, escalation)
