# Embudo de Adrián — pipeline de leads clínicos

Capacidad brand-local de Vitalia (módulo `crm`, EXTEND) que materializa la sub-tab
**Embudo** del empleado-IA vendedor (Adrián). Es una **superficie de supervisión**:
Adrián opera el funnel (califica, puntúa, mueve), la coordinadora supervisa (tomar
control, instrucción oculta, override de etapa con razón que alimenta al agente,
recuperación de leads congelados). Valeria coordina.

Sigue ADR-vitalia-004 (shell-feature architecture) + ADR-vitalia-003 (mockup-per-component,
ratificado `embudo-v3.html`). Lead es **non-PHI** (prospecto de marketing) → tenant-isolation
+ audit log, sin full-set HIPAA-lite.

## Estado

`live` — mergeado 2026-06-11 (Fase F). Auditor APPROVED (Auditor Responsable v5,
Carril R cerró sync-fix gaps) + `chris_verify.signoff: SATISFIED` (demo Chris:
spinner crear-lead · canal persiste en detalle · /recuperar empty-state). Live-verify
DoD #37: e2e 13/13 contra dev real + writes con efecto en DB (POST 201 + PATCH 200 +
fila `channel=whatsapp`). 8/15 scenarios `live` con test PASS; 7 `wip` (e2e
T-E2E-1 deferred ratificado 2026-06-04 — follow-up).

## Surface (confirmado por /architect — se materializa al build)

- BE: `vitalia/backend/src/modules/vitalia/crm/` (EXTEND: Lead + lead_service + lead_repository
  + FunnelService/ScoreService/DiagnoseService + transition con optimistic lock `version`→409 + activity/audit)
- FE: `vitalia/frontend/src/features/adrian/components/embudo/` (post-rename inbox→adrian) + reuse `crm-shared`/`use-leads`
  + `EntitySubNavBar` (de doctores) + `ChannelBadge` **EXTEND** (ya existe de adrian-inbox, NO new) + `@dnd-kit/core`
- Engine: CONSUME `core/luana-core-sales-agent/closer_studio` **read-only** (corre sync con su propia
  auth — NO mount, NO edit de schema engine). Override-context (RN-4.1) = wire brand-local (event
  subscriber a sales_agent) que escribe contexto del próximo turno — ticket agentic separado (T-AG-1, Opus R23).

