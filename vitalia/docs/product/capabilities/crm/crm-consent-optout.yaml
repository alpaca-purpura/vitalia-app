# vitalia-crm-consent-optout

Consent + marketing opt-out service para pacientes. Audit log obligatorio en cada cambio (HIPAA-lite + reg LatAm Ley 25.326 / 1581 / 19.628 / 29733 / LGPD). Endpoint `POST /patients/{id}/opt-out` y endpoints consent (granular consent flags) bajo RBAC `admin_clinic` only.

Foundation T-2 de Ola 1 fidelización — sin esto el `ProactiveOutboundService` no puede decidir si template MARKETING está permitido (gate per [[whatsapp-template-registry]]).

## Surface

### Domain
- `Patient.marketing_opt_in: bool` (existente en [[crm-scaffold-slice-1]], dual filter tenant+clinic)
- `Patient.consent_flags: dict` — granular consent (data_processing, voice_recording, photos, etc.) — campos nullable JSONB.

### Application service (`vitalia/backend/src/modules/vitalia/crm/application/services/`)
- **`patient_consent_service.py`** — `PatientConsentService`:
  - `grant_consent(patient_id, consent_type, granted_by, reason)` — toggle ON granular flag + audit row + return DTO.
  - `revoke_consent(patient_id, consent_type, revoked_by, reason)` — toggle OFF + audit row.
  - `set_marketing_opt_in(patient_id, opt_in: bool, actor, reason)` — flip patient.marketing_opt_in atomic + audit row.
  - `get_current_consents(patient_id)` — read-only summary current consent state.
  - `@require_phi_access(roles=["admin_clinic"])` decorator en TODOS los métodos write.

### Application DTOs (`application/dto/consent_dtos.py`)
- `GrantConsentRequest`, `RevokeConsentRequest`, `MarketingOptInRequest`, `ConsentSummaryResponse`.

### API routes (`api/consent_endpoints.py`)
- `POST /api/v1/crm/patients/{id}/consents` — grant/revoke granular consent.
- `GET /api/v1/crm/patients/{id}/consents` — read current.
- `POST /api/v1/crm/patients/{id}/opt-out` — flip marketing_opt_in (legacy alias).

Todos endpoints:
- `response_model=` mandatory.
- RBAC `admin_clinic` only (per HIPAA-lite rule § RBAC).
- Dual filter tenant + clinic enforced.
- Audit log row SYNC write antes response (no async fire-forget).

