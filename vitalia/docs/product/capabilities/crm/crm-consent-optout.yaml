## Dependencies

- `vitalia/backend/src/modules/vitalia/crm/domain/patient.py` — Patient entity ([[crm-scaffold-slice-1]])
- `vitalia/backend/src/modules/vitalia/compliance/` — AuditLogRepository + `@require_phi_access` decorator + sanitize_payload ([[compliance-hipaa-lite-audit]])
- `vitalia/backend/src/modules/vitalia/iam/` — VitaliaRole + ClinicContext
- `core/luana-core-iam` — role enforcement engine

## Scenarios live

- Granular consent grant con `admin_clinic` role → audit row con actor + timestamp + reason persisted.
- Granular consent grant con `nurse` role → 403 Forbidden (RBAC enforcement).
- Cross-tenant consent (`tenant_A` solicita `tenant_B` patient) → 404 (no leak).
- Marketing opt-out flip → consumido downstream por [[adrian-reengagement-tool]] vía `ProactiveOutboundService` (T-9). Sin opt-in MARKETING templates bloqueados; UTILITY templates pasan ([[whatsapp-template-registry]]).
- SC-02 absence_optin_guard — paciente sin consent → compliance block (golden eval verificado).

