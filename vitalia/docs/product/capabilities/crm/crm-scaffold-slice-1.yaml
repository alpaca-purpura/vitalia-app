- `vitalia/backend/src/modules/vitalia/compliance/` (PhiRepositoryBase, @require_phi_access, AuditLogRepository)
- `vitalia/backend/src/modules/vitalia/iam/` (VitaliaRole, ClinicContext, decoder)
