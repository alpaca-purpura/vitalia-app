# vitalia-crm-scaffold-slice-1

CRM module Slice 1 scaffold para Vitalia. Patient (PHI dual-filter) + Lead (non-PHI single tenant) + repositories + services con RBAC + endpoints. Raw SQL Slice 1, ORM models pending Slice 2. **Extended Ola 1 (2026-05-20):** Conversation + Message + ActionReceipt + ActivityEvent domain entities + repositories (inbox foundation) + lead-conversation linking.

## Surface

### Domain entities
- **`Patient`** (`domain/patient.py`) — PHI entity, dual filter (tenant_id + clinic_id). Fields: id, tenant_id, clinic_id, name (PHI), dni (PHI), phone (PHI), email (PHI), date_of_birth (PHI), address (PHI), status_tag, nps_score, last_access_at, created_at, updated_at
- **`Lead`** (`domain/lead.py`) — non-PHI entity, single filter tenant_id. Fields: id, tenant_id, email, source_channel, stage, conversation_id (FK opcional post Ola 1), created_at
- **`Conversation`** (`domain/conversation.py`) — ★ NEW Ola 1 — Patient/Lead chat thread. Fields: id, tenant_id, clinic_id, patient_id, lead_id, channel, handler_mode (3-state: agent | human | paused), version (OCC), last_message_at, created_at
- **`Message`** (`domain/message.py`) — ★ NEW Ola 1 — Single message in conversation. Fields: id, conversation_id, direction (in|out), sender_type (patient|adrian|human), body, audio_url, transcription_confidence, retracted_at, created_at
- **`ActionReceipt`** (`domain/action_receipt.py`) — ★ NEW Ola 1 — 5min undo lifecycle for Adrián tool calls. Fields: id, conversation_id, action_type, payload, status (active|undone|expired), expires_at (NOW + 5min), created_at
- **`ActivityEvent`** (`domain/activity_event.py`) — ★ NEW Ola 1 — Agent activity stream events (tool_invoked, mode_changed, message_sent). Fields: id, conversation_id, event_type, actor, payload_redacted, created_at

### Infrastructure repositories
- **`PatientRepository`** extends `PhiRepositoryBase` — dual filter enforced + audit log sync write on every PHI read/write
- **`LeadRepository`** (NOT PhiRepositoryBase — Lead non-PHI per spec) — single tenant filter
- **`ConversationRepository`** (`infrastructure/persistence/conversation_repository.py`) — ★ NEW Ola 1 — dual filter tenant+clinic, OCC version-check on UPDATE handler_mode
- **`MessageRepository`** (`infrastructure/persistence/message_repository.py`) — ★ NEW Ola 1
- **`ActionReceiptRepository`** (`infrastructure/persistence/action_receipt_repository.py`) — ★ NEW Ola 1 — 5min TTL sweep job-friendly
- **`ActivityEventRepository`** (`infrastructure/persistence/activity_event_repository.py`) — ★ NEW Ola 1

### Application services
- **`PatientService`** — `@require_phi_access(roles=["doctor","nurse","admin_clinic"])` decorator on get_by_id / update / opt_out. `opt_out` restricted `roles=["admin_clinic"]` only
- **`LeadService`** — no RBAC (Lead non-PHI, all roles)
- **`PatientConsentService`** (`application/services/patient_consent_service.py`) — ★ NEW Ola 1 — consent + marketing opt-out + audit log (see [[crm-consent-optout]])

### API routes (4 endpoints + Ola 1 consent endpoints, all `response_model=` mandatory)
- `GET /api/v1/crm/patients/{id}` — fetch patient (PHI dual filter + RBAC + audit log)
- `PATCH /api/v1/crm/patients/{id}` — update patient (PHI dual filter + RBAC + audit log)
- `POST /api/v1/crm/patients/{id}/opt-out` — marketing opt-out (admin_clinic only + audit log)
- `GET /api/v1/crm/leads` — list leads (no RBAC, single tenant filter)
- Ola 1 consent endpoints — see [[crm-consent-optout]] (api/consent_endpoints.py)

