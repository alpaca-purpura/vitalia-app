## Scenarios live

- Get patient con role=marketing → 403 PHIAccessDeniedError
- Get patient con role=doctor sin clinic_id en context → 500 MissingClinicFilterError (architectural protection)
- Get patient cross-tenant (tenant_A solicita tenant_B patient) → 404 (NO leak)
- Patch patient con admin_clinic en role → audit_log row creada antes 200 response
- Opt-out con role=doctor → 403 (admin_clinic only)
- List leads con cualquier role → 200 (no RBAC, single tenant filter aplica)
- AsyncMock repos en API tests Slice 1 (FastAPI Depends injection pending Slice 2)

