# Camila · reactivación y fidelización de pacientes

Capacidad brand-local de Vitalia que orquesta la reactivación de pacientes
dormidos. Sigue el patrón shell-feature (ADR-vitalia-004) y DDD Inside-Out:
entidad `ReEngagementEvent`, value objects (`re_engagement_pattern`,
`urgency_level`, `re_engagement_outcome`), repositorio, servicios de aplicación
(re-engagement, opt-out, pausa de paciente, salida proactiva, llamada manual) y
sweeps de detección programados (ausencia, follow-up vencido, mantenimiento
vencido, gap multi-sesión, timeout de respuesta de re-engagement).

## Surface

### Backend
- `vitalia/backend/src/modules/vitalia/fidelizacion/domain/` (entities, events, value_objects)
- `vitalia/backend/src/modules/vitalia/fidelizacion/infrastructure/` (models, repositories)
- `vitalia/backend/src/modules/vitalia/fidelizacion/application/services/`
- `vitalia/backend/src/modules/vitalia/fidelizacion/application/workers/` (sweeps)
- `vitalia/backend/src/modules/vitalia/fidelizacion/api/`

### Frontend
- `vitalia/frontend/src/lib/zod-schemas/re-engagement-event.ts`

## Estado

`wip` — código presente, sin e2e verde ni verificación live. Escenarios + access
+ business_rules a poblar cuando la story `vitalia-fase2-camila-reactivar` cierre merge.

