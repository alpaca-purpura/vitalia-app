- `vitalia/backend/src/modules/vitalia/fiscal/domain/fiscal_document.py`
- `vitalia/backend/src/modules/vitalia/fiscal/infrastructure/models/fiscal_document_model.py`
- `vitalia/backend/src/modules/vitalia/fiscal/infrastructure/repositories/fiscal_document_repository.py`
