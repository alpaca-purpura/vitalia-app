# Emisión fiscal (boleta/factura) Perú

Capacidad brand-local de Vitalia para emitir comprobantes fiscales asociados a
cobros de la clínica. Sigue DDD Inside-Out: `FiscalDocument` (domain), modelo +
repositorio (infrastructure), puerto de emisión con stub (application), router de
reintento (api). Idempotencia ante reintentos de red + patrón saga compensation
(cobro OK / emisión fallida → estado `failed` → reintento standalone sin re-cobrar).

