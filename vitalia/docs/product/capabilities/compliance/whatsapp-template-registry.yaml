# vitalia-whatsapp-template-registry

SSoT brand-local de WhatsApp HSM templates Meta-approved para Vitalia (5 templates Ola 1) con clasificación canónica UTILITY vs MARKETING + flag `requires_marketing_opt_in`. T-8 de Ola 1 fidelización. Foundation que habilita el gate compliance en [[adrian-reengagement-tool]] (`ProactiveOutboundService` consulta `requires_marketing_opt_in` para decidir si bloquear envío sin opt-in marketing).

HIPAA-lite: template `body_text` usa SOLO `{{N}}` placeholders (patient_name, clinic_name, appointment_date). NUNCA PHI embedded literally en template body.

Anti-duplication: registry brand-specific vitalia — NUNCA mirrorear cross-brand (per `.claude/rules/anti-duplication.md`). Otras brands tienen su propio registry en su connections module.

## Surface

### Domain — WhatsAppTemplateDef dataclass (`vitalia/backend/src/modules/vitalia/connections/whatsapp/registry.py`)

```python
@dataclass(frozen=True)
class WhatsAppTemplateDef:
    slug: str                          # Brand-internal id (e.g. 'recordatorio_proxima_sesion')
    template_name: str                 # Meta-registered template name
    category: str                      # 'UTILITY' | 'MARKETING'
    language: str                      # ISO 639-1 ('es' LatAm)
    body_text: str                     # con {{N}} placeholders, NO PHI
    requires_marketing_opt_in: bool    # True solo MARKETING
    components_raw: list[dict[str, Any]]  # full JSON Meta API
    metadata: dict[str, Any]           # extensible
```

### 5 Templates registered Ola 1

| Slug | Category | requires_marketing_opt_in | Purpose |
|---|---|---|---|
| `recordatorio_proxima_sesion` | UTILITY | False | Appointment reminder |
| `recordatorio_control_doctor` | UTILITY | False | Follow-up control reminder (★ fix iter 2 F1: ahora pasa sin opt-in) |
| `invitacion_mantenimiento` | MARKETING | True | Maintenance session invite |
| `re_engagement_ausencia` | MARKETING | True | Lapsed patient re-engagement |
| `nps_post_tratamiento` | UTILITY | False | Post-treatment NPS survey trigger |

### Template JSON definitions (`vitalia/backend/src/modules/vitalia/connections/whatsapp/templates/fidelizacion/`)

5 JSON files con `components_raw` per Meta-approved registration.

### Compliance gate enforcement

`ProactiveOutboundService` (consumer, en `vitalia/backend/src/modules/vitalia/fidelizacion/application/services/proactive_outbound_service.py`):
```python
template = WHATSAPP_TEMPLATE_REGISTRY.get(template_slug)
if template is None:
    raise ComplianceError("template_unknown")
if template.requires_marketing_opt_in and not patient.marketing_opt_in:
    raise ComplianceError("marketing_opt_in_required")
```

