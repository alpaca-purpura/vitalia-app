## Scenarios live

- UTILITY `recordatorio_control_doctor` con paciente sin opt-in marketing → SEND OK (iter 2 F1 fix: no más false-positive block).
- MARKETING `re_engagement_ausencia` con paciente sin opt-in → BLOCK con `reason: marketing_opt_in_required` (gate enforced).
- Unknown slug → BLOCK con `reason: template_unknown` (defense-in-depth, no silent pass).
- Template body_text scan — assertion en arch test: ningún `{{patient_name|dni|email|diagnosis|...}}` literal (solo placeholders posicionales {{1}}-{{N}}).

## KPIs

- Templates registered: 5/5 Meta-approved Ola 1
- Compliance gate hit rate: 100% (no bypass possible — service layer enforce + no direct dispatch)
- Audit log row per send attempt (success o block): sync write 100%

