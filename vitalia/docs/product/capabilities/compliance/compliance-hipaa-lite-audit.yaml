# vitalia-compliance-hipaa-lite-audit

HIPAA-lite LATAM posture: PII scanner pre-persistencia + PII masking en response models + audit log de operaciones sensibles + UI dashboard de eventos de compliance + consent records + export CSV. NO es hipaa_full (D7 ratificado: stripe_healthcare disabled, no business associate agreement).

## Surface

### Backend (`vitalia/backend/src/modules/vitalia/`)

- **`application/services/pii_scanner_service.py`** — scanea PHI patterns antes de persistir
- **`application/services/compliance_event_service.py`** — audit trail de ops sensibles
- **`application/services/consent_service.py`** — gestiona consent records (firma + revocación)
- **`infrastructure/models/medical_audit_log_model.py`** + **`infrastructure/repositories/medical_audit_log_repository.py`**
- **`infrastructure/models/consent_record_model.py`** + **`infrastructure/repositories/consent_repository.py`**
- **API endpoints** (`api/routes.py`):
  - `GET /api/v1/vitalia/medical-compliance/events` — log eventos filtrable
  - `GET /api/v1/vitalia/medical-compliance/export-csv` — export audit log
  - `GET /api/v1/vitalia/medical-compliance/consent-records` — consents firmados
- **DTOs con PII masking**: `api/dtos/compliance_dtos.py`, `api/dtos/consent_dtos.py` — enforcement: `phone_masked`, `email_masked`, `name_last_initial`

### Frontend (`vitalia/frontend/`)

- **Ruta dashboard**: `src/app/(dashboard)/medical-compliance/page.tsx`
- **Componentes** (`features/vitalia/components/`):
  - `compliance-page-client.tsx`
  - `compliance-stats-cards.tsx`
  - `compliance-event-row.tsx`
  - `consent-signature-modal.tsx`
  - `medical-disclaimer-banner.tsx`
- **Schemas + hooks**: `schemas/compliance-schema.ts`, `schemas/consent-schema.ts`, `api/use-compliance-events.ts`

### Config

```yaml
compliance_level: hipaa_lite   # D7 ratificado
features:
  medical_compliance_audit_log: true
```

