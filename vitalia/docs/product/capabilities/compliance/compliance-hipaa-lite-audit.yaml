## Dependencies

- `core/luana-core-platform` (audit base + observability)
- `core/luana-core-iam` (tenant context required en todas las queries)
- `core/luana-core-events` (DomainEvent outbox para compliance events)

## Scenarios live

- PHI detectado en campo free-text → PiiScanner flagea antes de persistir
- Response model devuelve teléfono/email/nombre masked
- Acceso a medical record → ComplianceEvent registrado con doctor_id + timestamp + patient_id
- Paciente firma consentimiento → ConsentRecord persistido con hash + timestamp
- Admin exporta audit log CSV (filtrable por fecha + tipo evento + doctor)
- Cross-tenant query attempt → bloqueado por tenant_id filter (arch fitness enforced)
- Disclaimer banner visible en UI cuando LLM discute tratamientos

## Known gaps vs `vitalia/.claude/rules/hipaa-lite.md` (aspirational vs shipped)

La rule overlay describe constraints más estrictos que lo actualmente shipped en Story 11. Diff:

| Constraint en rule | Shipped Story 11 | Gap |
|---|---|---|
| `clinic_id` como segundo filter obligatorio (dual `tenant_id + clinic_id`) | Solo `tenant_id` filter enforced en `test_vitalia_no_query_without_tenant_filter.py` | Falta arch test `test_phi_dual_filter.py` + refactor queries |
| `vitalia/backend/src/modules/vitalia/compliance/phi_fields.py` (SSoT PHI fields) | No existe | Crear módulo + extender PiiScanner para consumir |
| Postgres encryption-at-rest column-level via `pgcrypto` para `diagnosis/treatment_plan/medical_notes` | No implementado | Migration + key rotation policy |
| Retention 10y + cron `vitalia_phi_retention_sweep` mensual | No implementado | Definir cron + anonymization service |
| Decorator `@require_phi_access(roles=["doctor","nurse","admin_clinic"])` RBAC strict | No implementado | Crear decorator + audit endpoints PHI |
| `ComplianceService.validate_outbound_message(message, channel)` bloqueo mensajes PHI por canales no-encriptados | No verificable en repo actual | Integrar guard con `core/luana-core-compliance` |
| Voice patterns: `medical_results_only_in_portal: true` en sales_agent persona | No verificable en personas YAMLs vitalia | Validar persona vitalia |

**Implicación:** Story 11 dejó la posture base (`compliance_level: hipaa_lite` config + PiiScanner + audit log skeleton + PII masking en responses + 4 guardrails + cross-tenant test), pero los hardening claims de la rule overlay requieren stories futuras (candidate Story 11.bis o nuevo outcome `vitalia-hipaa-hardening`).

