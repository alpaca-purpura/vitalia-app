# vitalia-inbox-tools-extensions

Adrián inbox extensions Ola 1 — `retract_last_message` agentic tool + 4 callback handlers que orquestan acciones Adrián desde la UI inbox + brand voice slot integration cuando Adrián sugiere mensajes para el operador humano. Operador puede aceptar/editar/rechazar sugerencia → tool dispara → ActionReceipt 5min undo lifecycle (ver [[inbox-handler-mode-occ]]).

## Surface

### Agentic tool (`vitalia/backend/src/modules/vitalia/sales_agent/tools/`)
- **`retract_last_message.py`** — LangChain `@tool` async. Adrián cancela el último mensaje saliente activo (mientras `ActionReceipt.status == active` y `expires_at > NOW()`). Marca `messages.retracted_at = NOW()` + ActionReceipt → undone + emite `MessageRetracted` domain event.

### Inbox application services (`vitalia/backend/src/modules/vitalia/inbox/application/services/`)
4 services que actúan como callback handlers desde la UI (cada uno gateway a un Adrián action):

- **`send_message_service.py`** — operador envía mensaje (puede ser sugerencia Adrián aceptada). Crea `Message` + dispara `MessageSent` + crea `ActionReceipt` con 5min TTL para undo.
- **`retract_message_service.py`** — operador (o Adrián vía tool) retracta mensaje. Verifica `ActionReceipt.expires_at > NOW()` (sino 410 Gone). Atomic update message + receipt.
- **`pause_adrian_service.py`** — operador pausa el agente (transition handler_mode → `paused`). OCC version check evita race conditions.
- **`tools_state_service.py`** — operador inspecciona estado tools Adrián (read-only sheet, ver SC-01 Tools Sheet golden). NO ejecuta — solo display.
- **`activity_event_service.py`** — emite `ActivityEvent` rows (last 8 visible en UI sidebar).
- **`whisper_transcribe_service.py`** — audio fallback con Whisper. Confianza baja → `handler_mode → human + help_needed` badge (SC-02).
- **`proactive_outbound_service.py`** — outbound proactive (UTILITY / MARKETING gate, ver [[whatsapp-template-registry]]).
- **`inbox_orchestrator.py`** — orquestador unificado list/detail/wire de Adrián con conversation state.

### Brand voice slot integration
- Adrián recibe el SAME `personality_profile.system_instruction` que sale del Brand Studio (Slot 5 `BRAND_VOICE` cache prefix). Voz tenant respetada per `.claude/rules/sales-agent-brand-voice.md` (excepción a `spanish-text.md` — sales_agent NO voseo-forzado).
- Slot 5 sub-slot 2 lee `WHATSAPP_TEMPLATE_REGISTRY.requires_marketing_opt_in` (ver [[whatsapp-template-registry]]).

### API routes (api/router.py)
- `POST /api/v1/inbox/conversations/{id}/messages` — operador envía (`send_message_service`)
- `POST /api/v1/inbox/messages/{id}/retract` — retract con ActionReceipt
- `POST /api/v1/inbox/conversations/{id}/pause` — pausa Adrián (OCC 409 si version mismatch)
- `GET /api/v1/inbox/conversations/{id}/tools-state` — read-only Tools Sheet
- `POST /api/v1/inbox/audio/transcribe` — Whisper audio fallback
- `POST /api/v1/inbox/conversations/{id}/proactive-outbound` — UTILITY/MARKETING outbound

