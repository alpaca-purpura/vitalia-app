## Scenarios live

- SC-01 — Happy send + ActionReceipt 5min undo (operador acepta sugerencia Adrián, envía, recibe receipt con countdown)
- SC-02 — Audio fallback (Whisper low confidence → handler_mode=human + help_needed badge)
- SC-03 — OCC 409 rollback (concurrent SetMode pausa)
- SC-04 — Adversarial (cross-tenant 404 + XSS escape + marketing role 403 + PHI mask)
- SC-01 Tools Sheet read-only + ActivityStream events (8 last visible scroll)

