# vitalia-medical-kb-rag

3 KB packs médicos con Qdrant tenant-filtering: dental (~150 chunks procedures/materials/recovery/Q&A/complications), psychology (~200 chunks + crisis boundary protocol), psychiatry (131 chunks + forced disclaimer top-1 en cada respuesta). Registrados vía Extension SDK EP-14.

## Surface

### KB Packs (`vitalia/backend/src/modules/vitalia/copilot/kb/`)

- **`medical_kb_dental_v1/`** — 150 chunks
  - `manifest.yaml` (collection: vitalia_medical_kb_dental_v1, embedding text-embedding-3-large 1536, top_k 5, threshold 0.72)
  - `01_procedures.md` · `02_materials.md` · `03_recovery.md` · `04_common_questions.md` · `05_complications.md`
- **`medical_kb_psychology_v1/`** — ~200 chunks + crisis boundary (suicidal ideation → escalate)
- **`medical_kb_psychiatry_v1/`** — 131 chunks + forced retrieval top-1 con disclaimer obligatorio ("consult licensed psychiatrist")

### Config (`vitalia/config/brand.yaml`)

```yaml
medical_kb_packs: [medical_kb_dental_v1, medical_kb_psychology_v1, medical_kb_psychiatry_v1]
```

### Module registry (`vitalia/backend/src/modules/vitalia/copilot/`)

- **`module_registry_entry.py`** — registra KB packs en copilot ModuleDescriptor

## Test coverage

- `vitalia/backend/tests/agentic_evals/kb_packs/test_medical_kb_dental_retrieval.py`
- `vitalia/backend/tests/agentic_evals/kb_packs/test_medical_kb_psychology_boundary_chunks.py`
- `vitalia/backend/tests/agentic_evals/kb_packs/test_medical_kb_psychiatry_forced_disclaimer.py`

## Dependencies

- `core/luana-core-platform` (Qdrant adapter + tenant filtering)
- `core/luana-core-extension-sdk` EP-14 (KbPackDef registration)
- `core/luana-core-copilot` (consumer del KB packs registrados)

## Scenarios live

- Consulta dental → recupera chunks dental KB tenant-filtered
- Consulta psicología detecta patrón de crisis → protocolo de boundary disparado (escalate humano)
- Consulta psiquiatría → siempre append disclaimer forzado ("consult licensed psychiatrist")
- Tenant_scope: `brand` (chunks compartidos cross-tenant — referencia médica, NO PHI per-tenant)
- Bump `version` field → reseed completo vía stable_id rotation

