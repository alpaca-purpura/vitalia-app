- `vitalia/frontend/src/features/mateo/api/` — React Query hooks (useAgendaGrid + useChargeAppointment + useEmitFiscalDoc + useSendReminder + useCreateAppointment + usePatchAppointmentStatus)
- `vitalia/frontend/src/features/mateo/store/` — zustand UI state (agenda-store + agenda-filters-store)
- `vitalia/frontend/src/features/mateo/types/` — agenda.types.ts + agenda-schema.ts (Zod)
