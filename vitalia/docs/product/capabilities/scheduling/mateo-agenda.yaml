# Capability — Mateo Agenda (scheduling)

> Brand: vitalia
> Vertical: Salud + Bienestar (clínicas con reservas prepagadas + cobro inline)
> Owner agente: Mateo (Operar — operativa scheduling)
> Status: live (post F2-S1 merge 2026-05-27)
> Pattern: ADR-vitalia-004 shell-feature-architecture (source story)

## Goal

Sub-tab Agenda de Mateo operativa. Calendario día/semana/mes con celdas-slot por estado de pago (pagado · depósito · sin-pago · no-show) y por origen (walk-in · teléfono · proactivo Adrián · existing patient). Click slot → Drawer derecho inline con datos paciente PHI-masked + turno + subform "Cobrar saldo" que emite comprobante fiscal sin salir del flujo.

## Surfaces

### Config
- `vitalia/config/brand.yaml` — `compliance_level: hipaa_lite`, `auto_emit_invoice` per tenant
- `vitalia/.claude/rules/hipaa-lite.md` (overlay)

### Backend (Inside-Out DDD)
- `vitalia/backend/src/modules/vitalia/scheduling/domain/` — enums + dataclasses (AgendaSlot, AppointmentPayment, AppointmentOrigin, etc.)
- `vitalia/backend/src/modules/vitalia/scheduling/infrastructure/repositories/` — AgendaGridRepository + AppointmentPaymentRepository (optimistic lock + idempotency)
- `vitalia/backend/src/modules/vitalia/scheduling/application/services/` — agenda_grid_service + appointment_detail_service + create_appointment_service + appointment_status_service + notify_service + charge_orchestrator (saga compensation)
- `vitalia/backend/src/modules/vitalia/scheduling/application/ports/` — payment_charge_port + fiscal_emit_port (ABC interfaces)
- `vitalia/backend/src/modules/vitalia/scheduling/api/` — agenda_router (5 endpoints) + notify_router
- `vitalia/backend/src/modules/vitalia/payments/` — payment_charge_port_impl + stubs (service-blocker Option A) + charge_router
- `vitalia/backend/src/modules/vitalia/fiscal/` — fiscal_emit_port_impl + stubs (PE boleta/AR factura/MX factura) + emit_router
- `vitalia/backend/src/modules/vitalia/_shared/phi_masking.py` — mask_name + mask_dni + mask_phone + mask_email
- `vitalia/backend/src/modules/vitalia/_shared/telemetry/` — growth_studio_emitter + amount_bucket
- `vitalia/backend/alembic/versions/032_f2_s1_vitalia_agenda.py` — migration idempotent (4 tables: vitalia_appointment_payments + vitalia_fiscal_documents + vitalia_appointment_clinic_map + vitalia_growth_studio_event)

### Frontend (FSD-Lite, Server-First)
- `vitalia/frontend/src/app/[tenantId]/(shell-organism)/mateo/agenda/page.tsx` — Server Component SSR initial state
