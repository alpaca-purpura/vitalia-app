# vitalia-lisa-marca

Sub-tab Marca de Lisa dentro del shell-organism agéntico: workspace administración brand-identity con salud-overlay. Reemplaza dashboard legacy `/(dashboard)/brand-studio/[section]/`.

3 sub-sub-tabs N3-static:
1. **Identidad** — datos básicos · vertical read-only · logo · paleta · tipografía · equipo preview
2. **Voz y tono** — 4 archetypes salud (Caregiver/Sage/Healer/Hero) · 6 voice blocks compiler v2 · prohibited phrases soft warning · brand voice preview
3. **Presencia** — sitio web · redes sociales · trust hybrid catalog · ubicaciones

## Surface

### Config (`vitalia/config/brand.yaml`)

Brand-extension consumer de engine `core/luana-core-brand-studio` (PersonalityProfile + BrandIdentity + BuyerPersona aggregates) via existing API. NO modifica engine.

### Backend (`vitalia/backend/src/modules/vitalia/brand_studio/`)

