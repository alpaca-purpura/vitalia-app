## Architecture decisions (verbatim from 03-arch.md)

- **D1-arch**: ADR-vitalia-004 v1.1 compliance:full
- **D2-voice**: NUNCA `health_voice_validator.py`. Reuse compiler v2 sales-agent + tabla `vitalia_prohibited_phrases` soft warning
- **D3-clinic**: `clinic_vertical` + `primary_specialties` read-only desde onboarding-clinica
- **D4-extract**: Visual extraction = STUB disabled hasta /pm-luana proposal accept (`docs/promotion-protocol/proposals/2026-05-26-lift-brand-visual-extraction-to-core.md`)
- **D5-archetype**: 4 archetypes salud (Caregiver default / Sage / Healer / Hero). Omit Outlaw/Magician/Lover/Innocent
- **OQ-A → resolved v2**: N3-static SubSubTabsBar (ADR-004 v1.1)
- **OQ-B → resolved**: 4 archetypes salud
- **OQ-C → resolved**: BE endpoint `/lisa/marca/voice-preview` server-side compile + LRU+Redis cache key `(tenant_id, profile_id, compiler_version, hash(blocks))`
- **OQ-D → resolved**: Hybrid trust catalog cerrado per país (PE seed shipped: DIGESA, MINSA, SUSALUD, Colegio Odontólogos PE, Colegio Médico PE, SUNAT, ISO 9001, ESSALUD) + free-text "Otra"
- **OQ-E → resolved**: BrandVoicePreview footer único debajo card Tratamiento+idioma · refresh on autosave 600ms debounce

## Gherkin scenarios (verbatim from 01-spec.md — 11 scenarios)

1. happy paths × 3 sub-sub-tabs (Identidad/Voz/Presencia)
2. negative invalid input (URL malformada, logo > 5MB, archetype invalid)
3. edge race condition (autosave durante typing rapido)
4. edge concurrent users (last write wins or 409)
5. edge network failure (500/503 + retry banner)
6. edge empty state (sin certificaciones, sin redes, sin sedes)
7. edge large dataset (50+ prohibited phrases, 10+ sedes)
8. adversarial cross-tenant (tenant_A user para tenant_B → 404)
9. adversarial XSS (sanitization en text inputs)
10. a11y axe WCAG 2.1 AA
11. i18n locale (PE/AR/CL/MX, no voseo)

