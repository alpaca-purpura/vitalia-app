# vitalia-idempotent-cron-arq-scaffold

ARQ workers scaffold con `idempotent_cron` decorator que wraps engine `luana_core_idempotency.IdempotentStore` + OTel cron_span + structlog audit + Sentry capture/re-raise. 11 cron job scaffolds raise NotImplementedError (fail-loud, no silent no-op).

## Surface

- **`workers/base.py::idempotent_cron`** decorator — wraps async cron jobs con:
  - Idempotency via `luana_core_idempotency.IdempotentStore` (TTL 600s = 10min dedup window per cron guard)
  - OTel `cron_span` context manager (from T-infra-5)
  - structlog audit trail (info-level antes/después execution + error capture)
  - Sentry capture/re-raise para production alerting
  - Soft-fail si Redis unavailable (via `_get_idem_store()` mockable function)
- **`workers/arq_settings.py::WorkerSettings`** — 11 functions + 11 cron_jobs + `redis_settings` from env + `keep_result=3600` + `max_jobs=50` + `health_check_interval=30`. Todas las `arq.cron()` calls usan explicit `name=` (avoids default `cron:fn_name` prefix breaking test assertions)
- **11 scaffold job files** (`workers/jobs/*.py`) — todos raise NotImplementedError con story citations:
  - `followup_24h` (fidelizacion story)
  - `reactivation_45d` (fidelizacion story)
  - `maintenance_90d` (treatments story)
  - `deposit_reminder_24h` (agenda story)
  - `appointment_reminder_24h` (agenda story)
  - `appointment_reminder_2h` (agenda story)
  - `nps_request_24h` (fidelizacion story)
  - `brand_studio_audit_30d` (marketing story)
  - `lucas_weekly_recommendations` (copilot story)
  - `channel_sync_state_15min` (inbox story)
  - `audit_log_retention_sweep_monthly` (compliance — this story's enforcer)

## Test coverage

- 8 base decorator tests (`test_idempotent_cron.py`)
- 9 arq_settings tests (`test_arq_settings.py`)
- 55 parametrized job scaffold tests (`test_jobs_scaffolds.py` — verifies each raises NotImplementedError con story citation)
- Total: 73 tests PASS

## Dependencies

- `luana-core-idempotency` (engine — IdempotentStore wrapped)
- `vitalia/.../observability/cron_spans.py` (T-infra-5 — cron_span context manager)
- `arq` (async Redis-backed job queue)
- `redis` (graceful fallback if unavailable)

## Scenarios live

- Job invocation con misma idem key dentro 600s window → no-op + structlog log "duplicate cron invocation, skipping"
- Job exception → Sentry capture + structlog error + re-raise (arq retries per policy)
- Redis unavailable → `_get_idem_store()` returns SoftFailIdemStore (allows invocation, logs warning)
- Sentry SDK absent → `_SentrySentinel` no-op fallback (no test failure)
- arq invokes a job not-yet-implemented (NotImplementedError) → fail-loud con story citation visible en traceback

## Cron schedule (declarative, env-configurable)

```yaml
followup_24h:                 "0 9 * * *"      # daily 9am
reactivation_45d:             "0 10 * * 0"     # weekly Sun 10am
maintenance_90d:              "0 11 1 * *"     # monthly 1st 11am
deposit_reminder_24h:         "0 8 * * *"      # daily 8am
appointment_reminder_24h:     "0 7 * * *"      # daily 7am
appointment_reminder_2h:      "*/15 * * * *"   # every 15min (windowed lookup)
nps_request_24h:              "0 12 * * *"     # daily 12pm
brand_studio_audit_30d:       "0 0 1 * *"      # monthly 1st midnight
lucas_weekly_recommendations: "0 9 * * 1"      # Monday 9am
channel_sync_state_15min:     "*/15 * * * *"   # every 15min
audit_log_retention_sweep_monthly: "0 1 1 * *" # monthly 1st 1am
```

