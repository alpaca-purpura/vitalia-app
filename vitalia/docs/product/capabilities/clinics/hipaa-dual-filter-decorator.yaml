# Decorator @require_phi_access dual filter

Componente técnico HIPAA-lite que protege todo endpoint con acceso a PHI. Verifica que la consulta incluya tenant + clínica y que el rol tenga permiso; si falta algún filtro bloquea con HTTP 403 + audit log row.
