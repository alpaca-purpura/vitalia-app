# v3.2 (cement 2026-05-28): access + business_rules
access:
  roles: [owner, admin_clinic]
  entry_point: "Ribbon Lisa → Staff (N2) · pública: /d/{clinica}/{doctor} sin auth (solo visible ON)"
business_rules:
  - id: RN-D3A-2
    rule: "Doctor inactivo no aparece en el picker"
    enforcement: "filtro active=true server-side"
    code_ref: "vitalia/frontend/src/features/lisa/api/staff.ts::doctorPickerSearchFn"
  - id: RN-D3B-4
    rule: "bio_generated_at SOLO se actualiza en generación IA (no en ediciones manuales)"
    enforcement: "PATCH public-profile no toca el timestamp (test assert)"
    code_ref: "vitalia/backend/src/modules/vitalia/clinics/infrastructure/repositories/doctor_repository.py::update_public_profile_sections"
  - id: RN-D3D-9
    rule: "Anti-enumeración: toggle OFF / slug desconocido / colisión → respuesta idéntica"
    enforcement: "404 genérico único en public router + tests ×3 casos"
    code_ref: "vitalia/backend/src/modules/vitalia/clinics/api/public_doctors_router.py"
  - id: RN-D3F-2
    rule: "'N repeticiones' = N ciclos COMPLETOS del patrón (cada repetición incluye todos los días); multi-día → occurrences × len(days). Single-día = N (round-6, Chris 2026-06-15)"
    enforcement: "rrule(count = occurrences × len(days_of_week)) + SC-D3F-1/2 + bug7-r5 #R6"
    code_ref: "vitalia/backend/src/modules/vitalia/clinics/application/availability_projection_service.py"
  - id: RN-D3F-4
    rule: "El bloque se pinta en la columna del día REAL seleccionado (lunes→Lun, nunca Dom); semana anclada en el lunes real sin drift TZ"
    enforcement: "calendarDates SSoT (componentes locales, nunca toISOString) + occurrenceDayOfWeek descarta out-of-[0,6]"
    code_ref: "vitalia/frontend/src/lib/format/calendarDates.ts"
  - id: RN-D3G-1
    rule: "Borrar bloque recurrente ofrece 'Solo este turno' (excluye esa fecha) / 'Este y los siguientes' (trunca); confirmados nunca se borran; one_off borra directo"
    enforcement: "DELETE ?scope=occurrence|this_and_future + excluded_dates JSONB (migr 044) + has_confirmed_appointment guard"
    code_ref: "vitalia/backend/src/modules/vitalia/clinics/application/availability_block_service.py"
  - id: RN-D3G-2
    rule: "No se pueden crear bloques en fechas/horas pasadas (celdas grisadas + BE 422)"
    enforcement: "FE isCellPast data-past + onMouseDown no-op · BE create_block ValueError→422"
    code_ref: "vitalia/frontend/src/features/lisa/components/staff/workspace/horarios/AvailabilityCalendar.tsx"

