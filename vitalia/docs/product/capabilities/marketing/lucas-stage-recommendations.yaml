# vitalia-marketing-lucas-stage-recommendations

Lucas (agentic copilot) genera top-3 actionable recomendaciones per Bowtie stage daily. Owner aprueba/rechaza con RBAC + Idempotency-Key + audit_log SYNC write + 5min undo window. Core MUST visible MVP per spec § Diferenciadores.

## Surface

### Domain
- `LucasRecommendation` entity (status state machine: pending → approved/rejected/expired; undo_until 5min)
- `RecommendationStatus` enum
- `RejectReason` enum (5 values per spec)
- 5 domain events: `LucasRecommendationGenerated`, `Approved`, `Rejected`, `Undone`, `Expired`

### Persistence (migration 028)
- `vitalia_lucas_recommendations` table — partition por month + dual filter `(tenant_id, clinic_id)` enforced via `CompoundScopeRepositoryBase`

### Application
- `LucasRecommendationsService` (marketing CRUD wrapper)
  - `list(stage, status_filter)` — paginated read by stage
  - `approve(rec_id, action_payload, idempotency_key)` — state→approved + 5min undo + audit_log SYNC + outbox event
  - `reject(rec_id, reason, idempotency_key)` — state→rejected + audit_log + event
  - `undo(rec_id)` — state→pending if within 5min window
- Action payload range validation (SC-MK-04: out-of-range rejected with Spanish neutro error)

### Cron (daily 06:00 UTC)
- `lucas_daily_analysis_sweep` worker calls agentic `LucasOrchestratorService.run_daily_analysis(tenant_id, clinic_id, locale)` then filters via `cooldown_kinds` post-call. Emits `LucasRecommendationGenerated` events with `stage: BowtieStage` (enum).
- Wired via `make_orchestrator()` factory in `vitalia/backend/src/modules/vitalia/agentic/lucas/application/services/__init__.py`

### API
- `GET /api/v1/vitalia/marketing/recommendations` — list w/ filters
- `POST /api/v1/vitalia/marketing/recommendations/{rec_id}/approve` — Idempotency-Key required
- `POST /api/v1/vitalia/marketing/recommendations/{rec_id}/reject` — Idempotency-Key required
- `POST /api/v1/vitalia/marketing/recommendations/{rec_id}/undo` — Idempotency-Key required

### FE Components
- `vitalia/frontend/src/features/marketing/components/LucasStageRecommendationsCard.tsx` — top 3 cards sticky inline + "Ver todas" expand
- `LucasRecommendationDetailModal.tsx` — analysis + projection + audit trail + Aprobar/Rechazar/Posponer 7d
- `LucasApprovalModal.tsx` — warning reversible + Idempotency-Key (`crypto.randomUUID`) + action receipt 5min countdown
- `LucasUndoChip.tsx` — 5min countdown reads marketing-store
- `LucasRejectModal.tsx` — RHF + Zod reason enum

### Hooks
- `useLucasRecommendations` · `useApproveRecommendation` · `useRejectRecommendation` · `useUndoRecommendation`

