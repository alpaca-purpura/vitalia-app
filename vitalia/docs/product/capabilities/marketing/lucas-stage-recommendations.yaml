## Dependencies

- ENGINE: `core/luana-core-platform.workers.cron_envelope` (v0.4.0 — wraps cron in OTel + audit + sentry)
- ENGINE: `core/luana-core-platform.repositories.compound_scope_repository.CompoundScopeRepositoryBase` (dual filter)
- ENGINE: `core/luana-core-events.outbox` (event publish)
- BRAND: `vitalia-copilot-tools-impl` story (shipped 2026-05-18) — `LucasOrchestratorService` consumed by cron
- BRAND: `vitalia-marketing-bowtie-funnel-5-stages` (stage filter)

## Compliance

- **HIPAA-lite:** action_payload NO contiene PHI (solo metric value + channel slug). `audit_log` SYNC write antes response (NOT async fire-forget). Dual filter `tenant_id + clinic_id`.
- **RBAC:** role `doctor` + `admin_clinic` aprueban; `recepcion` ve cards pero approve button disabled con tooltip; `marketing` role NO ve PHI references.
- **Idempotency:** Idempotency-Key (UUID v4) generated client-side + dedup via engine `luana_core_idempotency`.

## KPIs

- Time to approval ≤ 2 clicks (card → modal → approve button)
- 5min undo window respected (countdown UI + service-side timestamp check)
