# Servicio admin Streamlit

Panel de administración interno (Streamlit) para el equipo de Vitalia: gestiona tenants, clínicas y usuarios de forma transversal. Corre en un servicio Docker separado (puerto 8502), con autenticación por contraseña de administrador.
