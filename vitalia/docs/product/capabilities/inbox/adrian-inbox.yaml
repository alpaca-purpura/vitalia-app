# inbox.adrian-inbox

Inbox unificado cross-canal de Adrián en el shell-organism (2-modos · pausa · composer dock · glass-box · firewall PHI). Cap canónica que **reconstruye + supera** el slice-1 `sales_agent.inbox-handler-mode-occ` (deprecated).

## Por qué existe esta cap (input del architect)

Es el **mapa code↔cap** que el architect consume ANTES de modificar el inbox: `code_pointers` lista los archivos reales (BE + FE), `regression_tests` mapea cada comportamiento a su batería de tests REAL, y `business_rules` cita el `code_ref` exacto. Si el architect toca cualquier `code_pointer`, corre los `regression_tests` correspondientes y/o actualiza esta cap (scenarios + change_log).

## Lección cementada — HB-50 (verificación ≠ 200)

Las 6 mutaciones del inbox devolvían 200 pero **nunca commiteaban** (`get_async_session` no commitea; ningún service commitea) → el write se perdía en silencio y el optimistic-update de React Query lo ocultaba en la UI. Lo cazó el golden e2e (el efecto en DB), no el check de 200. Regla de regresión: toda mutación nueva usa `get_async_session_committing` + tiene un test de **persistencia** (read-back DB / live-verify), no solo status 200. Ver `business_rules.inbox-mutation-commits`.

## Cómo verificar (reproducible)

```bash
WS=$(git rev-parse --show-toplevel)
cd ${WS}/vitalia/backend && ${WS}/.venv/bin/pytest tests/modules/vitalia/inbox/ -q          # 103 passed
cd ${WS}/vitalia/frontend && npx vitest run src/features/adrian/                              # 344 passed
set -a; source ../.env.dev; set +a; E2E_BASE_URL=https://dev-app.vitalialat.com \
  npx playwright test e2e/shell-organism/adrian-inbox-modes.spec.ts --project=smoke --no-deps --workers=1   # 7 passed
```

