user_facing_name: "Adrián · Inbox unificado cross-canal (2-modos + pausa + glass-box)"
user_facing_description: >
  Bandeja unificada de conversaciones (WhatsApp · Instagram · Email · Web) operada por Adrián.
  Cada conversación tiene un modo de atención de 2 estados — "Adrián decide" (responde solo) o
  "Adrián consulta" (redacta y el operador aprueba) — y se puede PAUSAR a Adrián (60 min o
  permanente) para que el operador escriba a mano desde el composer (siempre montado al pie).
  El thread es glass-box: el Activity stream muestra cronológicamente lo que hace Adrián
  (mensajes, herramientas, cambios de modo, pausas). La ficha de contacto muestra el lead
  (visible por defecto, interim) + servicio de interés + etapa de la venta. El firewall PHI
  (HIPAA-lite) impide que Adrián discuta datos clínicos por canal no-encriptado.

