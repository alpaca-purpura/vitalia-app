business_rules:
  - id: inbox-mutation-commits
    rule: >-
      ★ HB-50: TODA mutación del inbox (mode/pause/send/proactive/nudge/retract) DEBE usar
      get_async_session_committing en su factory DI — get_async_session NO commitea (delega
      al caller) y ningún service del inbox commitea → el write se pierde en silencio aunque
      el endpoint devuelva 200. Regla de regresión: cualquier endpoint de mutación nuevo en
      el inbox usa la sesión committing + tiene un test de PERSISTENCIA (no solo 200).
    enforcement:
      - ".claude/rules/definition-of-done-live-verify.md"
      - "docs/process/harness-backlog.md (HB-50)"
    code_ref: "vitalia/backend/src/modules/vitalia/inbox/api/router.py"   # _get_*_service factories
    severity: critical
    audit_trail: false
  - id: inbox-operator-rbac
    rule: "Las mutaciones del inbox se gatean a _INBOX_OPERATOR_ROLES = _PHI_ROLES ∪ {owner, receptionist}. marketing/sales/patient → 403."
    enforcement:
      - "vitalia/.claude/rules/hipaa-lite.md"
    code_ref: "vitalia/backend/src/modules/vitalia/inbox/api/router.py"   # _assert_phi_access(_INBOX_OPERATOR_ROLES)
    severity: critical
    audit_trail: true
  - id: occ-version-check
    rule: "PATCH /mode requiere expected_updated_at coincidente; mismatch → 409 con la fila fresca para que el cliente refresque."
    enforcement:
      - ".claude/rules/backend-ddd.md"
    code_ref: "vitalia/backend/src/modules/vitalia/inbox/application/services/set_mode_service.py"
    severity: high
    audit_trail: false
  - id: phi-firewall-outbound
    rule: "ComplianceService valida cada outbound; PHI por canal no-encriptado → bloqueado + deriva a portal. Adrián opera datos comerciales, nunca clínicos por chat."
    enforcement:
      - "vitalia/.claude/rules/hipaa-lite.md"
    code_ref: "vitalia/backend/src/modules/vitalia/inbox/application/policies/phi_channel_policy.py"
    severity: critical
    audit_trail: true
  - id: tenant-clinic-dual-filter
    rule: "Toda query del inbox filtra tenant_id AND clinic_id; cross-tenant → 404 sin leak."
    enforcement:
      - ".claude/rules/tenant-isolation.md"
      - "vitalia/.claude/rules/hipaa-lite.md"
    code_ref: "vitalia/backend/src/modules/vitalia/crm/infrastructure/persistence/conversation_repository.py"
    severity: critical
    audit_trail: true
  - id: action-receipt-5min-ttl
    rule: "ActionReceipt (undo) expira 5 min post-creación; revert después → 410 Gone."
    enforcement:
      - "vitalia/docs/architecture/ADR-vitalia-004.md"
    code_ref: "vitalia/backend/src/modules/vitalia/inbox/application/services/retract_message_service.py"
    severity: high
    audit_trail: false

