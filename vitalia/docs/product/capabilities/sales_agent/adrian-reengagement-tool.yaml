# vitalia-adrian-reengagement-tool

`send_proactive_reengagement` — agentic tool LangChain `@tool` async (Adrián) que dispara mensaje WhatsApp HSM proactivo de re-engagement (paciente con tratamiento incompleto, ausencia prolongada, mantenimiento vencido, follow-up doctor). Hereda HIPAA-lite + compliance gate UTILITY vs MARKETING gating per consent. T-9 de Ola 1 fidelización.

**Fix iter 3 (post BE audit):** consume `WHATSAPP_TEMPLATE_REGISTRY.requires_marketing_opt_in` ([[whatsapp-template-registry]]) en lugar de hardcodear lista MARKETING — UTILITY templates pasan sin opt-in (recordatorios appointment, follow-up doctor, NPS); MARKETING templates (re-engagement absence, invitación mantenimiento) gated por opt-in marketing del paciente.

## Surface

### Agentic tool (`vitalia/backend/src/modules/vitalia/sales_agent/tools/`)
- **`send_proactive_reengagement.py`** — `@tool` async. Inputs (Pydantic args_schema): `tenant_id`, `clinic_id`, `patient_id`, `template_slug`, `template_params` (dict para `{{N}}` placeholders), `pattern` (multi_session|follow_up|maintenance|absence|nps). Outputs: `{status: sent|blocked, reason, message_id}`.

### Application service (`vitalia/backend/src/modules/vitalia/fidelizacion/application/services/`)
- **`proactive_outbound_service.py`** — `ProactiveOutboundService.send()`:
  - Step 1: dual filter tenant + clinic load Patient.
  - Step 2: lookup `WHATSAPP_TEMPLATE_REGISTRY[template_slug]` → template def.
  - Step 3: ★ ITER 2 F1 FIX ★ if `template.requires_marketing_opt_in and not patient.marketing_opt_in: raise 403 (or return blocked status)`. UTILITY templates skip esta verificación.
  - Step 4: WhatsApp Business adapter dispatch + persist message + ActivityEvent + ActionReceipt (5min undo via [[inbox-handler-mode-occ]]).
  - Step 5: sync audit log row.

### Persistence — re-engagement event tracking (`vitalia/backend/src/modules/vitalia/fidelizacion/`)
- `domain/entities/re_engagement_event.py` — entity audit
- `infrastructure/repositories/re_engagement_event_repository.py` — dual filter
- `domain/value_objects/re_engagement_pattern.py` — Enum 5 patrones
- `domain/value_objects/re_engagement_outcome.py` — Enum outcomes (sent|delivered|read|replied|opted_out)

