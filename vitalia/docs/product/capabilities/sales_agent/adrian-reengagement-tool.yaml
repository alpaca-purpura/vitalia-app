## Scenarios live

- SC-01 happy multi-session — paciente con tratamiento incompleto recibe sugerencia → operador acepta → tool envía → mensaje delivered.
- SC-02 absence sin opt-in — paciente con ausencia prolongada pero sin marketing_opt_in → tool block (golden `absence_optin_guard.yaml` cubre).
- SC-03 follow-up doctor vencido — UTILITY template `recordatorio_control_doctor` → pasa sin opt-in marketing (iter 2 F1 fix).
- Voice fidelity per Slot 5 BRAND_VOICE ≥ 0.85.
- SC-04 adversarial cross-tenant — request con `tenant_A` + `patient_id` de tenant_B → 404 sin leak.

## KPIs

- Pass^k threshold: ≥ 0.5 (goldens reengagement/)
- Per-trial threshold: ≥ 0.66
- Voice fidelity min: 0.85
- Daily re-engagement quota per tenant: configured in `vitalia/config/brand.yaml` (default 50)
- Audit log sync write success rate: 100% (no fire-forget)

