# vitalia-medical-guardrails

4 medical guardrails reales (no_diagnosis, no_prescription, disclaimer_required, prompt_injection_block_reuse) orquestados por `MedicalGuardrailsService` — defense-in-depth per HIPAA-lite vitalia overlay. Replaza placeholders T-infra-2 con callables reales.

## Surface

### Service (`vitalia/backend/src/modules/vitalia/sales_agent/application/services/medical_guardrails_service.py`)

- `MedicalGuardrailsService.prevent_diagnosis_disclosure_on_unencrypted_channel(message, channel) -> bool` — channel guard (WhatsApp tier free, SMS block)
- `redirect_results_to_portal(message) -> str` — substitution to portal seguro link
- `block_unauthorized_phi_access(role, requested_field) -> bool` — RBAC dual filter (doctor/nurse/admin_clinic only)
- `validate_compliance_outbound(payload, channel) -> ComplianceVerdict` — wraps engine `ComplianceService.validate_outbound_message`

### Guardrail callables (`vitalia/backend/src/modules/vitalia/compliance/guardrails/`)

- `medical_safety_no_diagnosis.py` — RE-EXPORT canonical `agentic/guardrails/medical_safety_no_diagnosis.py` (regex + sandbox markers DQ2)
- `medical_safety_no_prescription.py` — RE-EXPORT canonical
- `medical_disclaimer_required.py` — NEW callable
- `prompt_injection_block_reuse.py` — NEW callable

Anti-duplication: SHIMS re-export canonical agentic/guardrails (single source enforced).

