## Scenarios live

- SC-01 happy — operador envía → ActionReceipt 5min countdown visible → undo chip renderiza.
- SC-03 — OCC 409 rollback frontend: 2 tabs cambian mode simultáneo, segunda obtiene 409 con `current_version`, optimistic update rolls back.
- SC-03 — retract después 5min → 410 Gone, UI muestra mensaje "no se puede deshacer".
- Audio low confidence (SC-02) → set_mode(handler_mode → human + help_needed flag).

