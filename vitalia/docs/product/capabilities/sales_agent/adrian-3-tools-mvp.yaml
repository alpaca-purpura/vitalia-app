# vitalia-adrian-3-tools-mvp

Adrián sales agent MVP — 3 production tools + 5 personas YAML brand-default + 6-slot prompt architecture (incluye Slot 4 MEDICAL_SAFETY_RAILS canonical j2 + Slot 2 medical_vertical). Voz respeta tenant per sales-agent-brand-voice rule (excepción spanish-text).

## Surface

### Tools (`vitalia/backend/src/modules/vitalia/sales_agent/tools/`)

- `screening_questions.py` — LangChain @tool async, wraps existing `screening_questions_service`
- `payment_link.py` (exports `send_payment_link`) — wraps `payment_link_service`
- `reschedule_appointment.py` — wraps `reschedule_appointment_service`

### Prompts (`vitalia/backend/src/modules/vitalia/sales_agent/prompts/`)

- `medical_safety_rails.md` — Slot 4 pointer to canonical `agentic/prompts/slot_4_medical_safety_rails.j2`
- `medical_vertical.md` — Slot 2 medical context
- `adrian_persona_base.md` — Slot 5 base persona (brand-default; tenant overrides via personality_profile.system_instruction)

### Personas (`vitalia/backend/src/modules/vitalia/sales_agent/personas/`)

- `warm_close_default.yaml` — fallback archetype
- `warm_close_dental.yaml`
- `warm_close_estetica.yaml`
- `warm_close_psicologia.yaml`
- `warm_close_fertilidad.yaml`

Schema cada persona: archetype, dialect (es-AR neutro), voice_constraints (formality, opening, common_objections), red_flags.

## Test coverage

- Unit: `tests/unit/modules/vitalia/sales_agent/tools/test_{screening_questions,payment_link,reschedule_appointment}.py`
- Agentic eval: `tests/agentic_evals/sales_agent/goldens/{dental,estetica,psicologia,fertilidad}/` (12 goldens × 3 trials = 36 trial-grades)
- Voice fidelity: `tests/agentic_evals/sales_agent/test_voice_fidelity_vitalia.py` (engine grader consumed READ-ONLY)
- pass^k runner: `tests/agentic_evals/sales_agent/test_pass_k_evaluation.py`

## Dependencies

- `core/luana-core-sales-agent` (engine state base — extended via `state_overlay.py`)
- `core/luana-core-observability` (callback subclass)
- `core/luana-core-brand-studio` (voice_fidelity grader engine READ-ONLY)
- `core/luana-core-extension-sdk` (EP-3 ToolDef + EP-13 GuardrailDef registration)
- LangChain `@tool` async + Pydantic v2 args_schema

## KPIs

- Pass^k threshold: ≥ 0.5
- Per-trial threshold: ≥ 0.66 (≥2/3 rubric dimensions)
- Voice fidelity min: 0.85
- Cost budget per-tenant daily: $0.25

## Scenarios live

- SC-A1 Dental happy curious (screening → payment link)
- SC-A2 Adversarial PHI via WhatsApp (derive to portal — channel guard)
- SC-A4 Estética adversarial contraindicación (escalate doctor)
- SC-A5 Psicología adversarial crisis (suicidal ideation handoff)
- SC-A6 Fertilidad happy sensitive (screening before payment)
- SC-V1 Voice fidelity per Slot 5 BRAND_VOICE ≥ 0.85

