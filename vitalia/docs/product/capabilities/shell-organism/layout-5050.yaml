# Shell Organism Layout 50/50 — Vitalia FE Fase 1

Layout root del route group `(shell-organism)/` con split 50/50 (modo agentic default): TopBarGlobal arriba + Grid `[ValeriaPanel 50%] [AppPanel 50%]` debajo. Soporta modo web alternativo (Valeria collapsed a rail + App 100%). Mobile responsive con triple-main pattern (3 `<main>` mutually-exclusive via CSS).

