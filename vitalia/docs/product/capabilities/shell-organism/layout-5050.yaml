## Scenarios (verbatim 01-spec.md)

### SC-1 happy — render 50/50 default modo agentic

```gherkin
Given el usuario navega a /test-stack/shell-layout en viewport 1280×800
When la página hidrata client-side
Then TopBarGlobal renderiza (h-12=48px) con LogoMark + TenantSwitcher + ThemeToggle
  And el split inicial es 50/50 (ValeriaPanel + AppPanel)
  And el Separator (Redimensionar paneles) está visible entre paneles
  And ShellModeToggle "Agéntico" chip disabled sobre TopBar
  And el skip-link "Saltar al contenido principal" → #main-content focusable
```

### SC-2 negative — viewport < md (375x667) colapsa a 1 columna

```gherkin
Given el viewport es 375x667 (mobile)
When la página hidrata
Then solo el <main md:hidden> renderiza (mobile fallback)
  And AppPanelSlot visible 100% width (no split)
  And ValeriaSidebarSlot oculto via CSS (md:flex hidden → visibleCount = 0)
  And hint "Valeria — abrir desde menú" presente en DOM (CSS-hidden)
```

### SC-3 edge — resize boundary clamp + persistencia + snap-up (DEFERRED last assertion)

```gherkin
Given el usuario en shell agentic con valeriaState='full' (min Valeria 620px)
When arrastra el resize handle hacia la izquierda hasta posición < 620px
Then el handle clamp en min calculated (ResizeObserver-driven percentage)
  And localStorage[vitalia-shell-split-agentic] persiste el ratio post-drag

Given el usuario en estado anterior (Valeria=620, state='full')
When cambia valeriaState a 'rail'
Then el min Valeria baja a 360px
  And el width actual (620) se mantiene (más espacio para chat, no auto-shrink)
```

> **DEFERRED 2026-05-23:** última assertion (`400 < min 620 → snap-up automático a 620` después de transition rail→full + drag inmediato) requiere refactor del lifecycle hydration race condition. Tracking: story `vitalia-fase1-shell-layout-5050-race-fix` state=parked. F1-S5/S6 lifecycle work podrá resolverlo cuando refactor Panel hydration.

### SC-4 adversarial — a11y keyboard nav + axe wcag2aa

```gherkin
Given el usuario navega con keyboard (Tab + Enter + Esc)
When pulsa Tab desde inicio
Then primer tab focus → skip-link visible (clic envía focus a #main-content)
  And ResizeHandle es focusable + Arrow keys cambian width 1% per press
  And axe-core scan retorna 0 violations wcag2aa
```

