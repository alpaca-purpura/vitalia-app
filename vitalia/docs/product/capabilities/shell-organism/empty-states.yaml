# Empty States — Vitalia FE Fase 1 (F1-S10)

Última story Fase 1 · puebla los 22 sub-tab pages con placeholders. `SubTabContent` dispatcher mapea cada combo `{agent}.{subtab}` → placeholder React via `PLACEHOLDER_MAP` type-safe que consume `RIBBON_SUBTABS` SSoT de `agent-catalog.ts`. 16 sub-tabs genéricas usan `EmptyState` molécula (icon + label del catalog). 6 sub-tabs especiales replican structure rica del mockup ratificada (Lisa Servicios catálogo + Adrián Embudo Kanban + Adrián Inbox sales_studio parity + Takeover UX + Valeria Agenda enriquecida + Camila Voz 3 cards + Config Conexiones grid).

Cierra el outcome `vitalia-mvp-ui-foundation` — shell vacío navegable production-ready. Fase 2 (22 stories sub-tab funcionales) puede arrancar.

## Surfaces

### Backend (`vitalia/backend/`)

N/A — F1-S10 es FE only (mock-only placeholder · no API endpoints · no DB writes · no agentic surface).
Fase 2 (`vitalia-fase2-{agent}-{subtab}` × 22 stories) cablea backend real por sub-tab.

