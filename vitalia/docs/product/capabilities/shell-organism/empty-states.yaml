## Scenarios (verbatim 01-spec.md § 5)

### SC-1 happy · 22 sub-tabs navegables sin error

**Given:** Usuario autenticado en `/{tenantId}` con shell montado
**When:** Click cada ribbon tab (5 agents + Config) → click cada sub-tab disponible
**Then:** Cada combo `{agent}.{subtab}` renderiza su placeholder sin console error · 22 transiciones sin 404 · SubTabHeader visible con label correcto del catalog SSoT

### SC-2 happy · placeholder especial Lisa Servicios

**Given:** URL `/{tenantId}/lisa/servicios`
**When:** Página carga
**Then:** TogglePill "Catálogo•Escalera" visible · Grid 5 PlaceholderCards (Limpieza/Blanqueamiento/Implante/Mantenimiento/+ Nuevo) · click Escalera → state local cambia → "Escalera de valor — próximamente"

### SC-3 happy · placeholder especial Adrián Embudo

**Given:** URL `/{tenantId}/adrian/embudo`
**When:** Página carga
**Then:** TogglePill "Kanban•Lista" (Kanban default) · 6 columnas Pipeline con leads mock (Interesado 12·$84k / Calificando 8·$62k / Considerando 5·$41k / Listo 3·$28k / Reservado 2·$15k / Decidió no 4·—) · 14 leads ficticios LATAM (María G./Carlos P./Sofía R./Ana V./Pedro M./Lucía R./JP Méndez/Marta L./Diego F./Rosa V./Felipe T./Camila B./Mateo L./Iván S./Patricia C.) · horizontal scroll <1280px

### SC-4 happy · placeholder especial Valeria Agenda (enriquecido batch 2)

**Given:** URL `/{tenantId}/valeria/agenda`
**When:** Página carga
**Then:** AgendaToolbar period nav (‹ Semana 26-31 May 2026 ›) + Día/Semana/Mes toggle + Hoy + CTA Crear cita dropdown 3 origins · AgendaFilters 6 chips disabled · 6 day headers Lun26-Sáb31 con Lun26 today highlight · grid 6d×9h con 10 slots mock LATAM (paciente·service·doctor·origin·status pill 4 variants) · lunch-time 13:00 con pattern stripe · AgendaSummaryFooter "Adrián propuso 4 · 3 sin pago · Lucas: 3 leads"

### SC-4.bis happy · placeholder Adrián Inbox (sales_studio parity + takeover UX)

**Given:** URL `/{tenantId}/adrian/inbox`
**When:** Página carga + click "✋ Tomar el control"
**Then:** 3-col layout 320/flex/288 (widths shipped sales_studio) · 5 ConversationItem mock con CampaignTag/temp-dot/stage-badge/channel-abbr · Carlos Pérez handler_mode='human' → YouChip "✋ Tú" + border-l verde · default state A=Adrián con chip + botón Tomar · MessageInput disabled · click Tomar → state B=usuario · TakeoverBanner amarillo visible · MessageInput enabled · click "🤖 Devolver" → back A · click × → ContactSidebar collapse

### SC-5 negative · sub-tab inválido en URL → 404 dentro del shell

**Given:** URL `/{tenantId}/lisa/xxxnotvalid`
**When:** Página carga
**Then:** not-found.tsx jerárquico (F1-S9 cementado) renderiza dentro del shell · Ribbon + ValeriaSidebar visibles · SubTabContent vacío

### SC-6 edge · 22 sub-tabs render sin re-mount completo del shell

**Given:** Usuario en `/{tenantId}/lisa/marca`
**When:** Click 21 sub-tabs en secuencia rápida
**Then:** Ribbon DOM node NO re-mounts · ValeriaSidebar DOM node NO re-mounts · Solo SubTabContent se re-renderiza per route change · No errores "Maximum update depth"

### SC-7 adversarial · XSS payload en URL subtab → safe

**Given:** URL `/{tenantId}/lisa/<script>alert(1)</script>`
**When:** Página carga
**Then:** isValidSubtab (F1-S9 cementado) bloquea → not-found.tsx · DOM NO contiene script tag inyectado · NO alert() fires (page.on('dialog')=never assertion)

### SC-8 sub-cat empty_state · 16 sub-tabs genéricas

**Given:** URL `/{tenantId}/{agent}/{subtab}` donde subtab ∈ 16 genéricas
**When:** Página carga
**Then:** EmptyState renderiza con icon catalog + title "{label} — próximamente" + description uniforme

### SC-9 sub-cat accessibility · heading hierarchy + keyboard

**Given:** Cualquier sub-tab
**When:** axe scan + keyboard Tab navigation
**Then:** SubTabHeader uses h2 · PlaceholderCard internal headings h3 · TogglePill role=tablist + role=tab + aria-selected · axe wcag2aa 0 violations

### SC-10 sub-cat i18n · Spanish neutro LatAm + tenant_locale

**Given:** Cualquier sub-tab + tenant `currency: PEN` + `timezone: America/Lima`
**When:** Página carga
**Then:** Spanish neutro (sin voseo) · Valeria Agenda horarios 24h America/Lima · Adrián Embudo values S/ PEN

### SC-11 sub-cat network_failure — N/A justified
F1-S10 NO fetch API (mock-only). Fase 2 cablea cada sub-tab story.

### SC-12 sub-cat race_condition + concurrent_users + large_dataset — N/A justified
F1-S10 NO DB writes + no pagination. Mock data constante hardcoded. Fase 2 cablea.

## HIPAA-lite compliance

F1-S10 NO maneja PHI real (mock data ficticia). Arch test `test_no_phi_real_data.test.ts` enforce:
- Mock data files (`features/*/components/placeholders/*.tsx` + .test.tsx) scan: 0 PHI real leaks
- Patrones masked permitidos: `+51 9** ***-4321` · `m***@gmail.com` (visual masking only F1)
- F2-S3 adrian-inbox + F2-S1 valeria-agenda + F2-S2 valeria-pacientes wiran RBAC `@require_phi_access` server-side per `vitalia/.claude/rules/hipaa-lite.md`

