# Wizard Brand Studio Onboarding — Slice 1

> Wizard conversacional agentic chat-LEFT 50/50 con Valeria + voz Adrián REAL backend wire + slot-filling adaptativo NLU + extracción URL/doc (audio Whisper DEFERRED Slice 2 per Chris OQ-3 2026-05-18).

## Goal

Primer login Owner Vitalia → asistente Valeria conduce setup conversacional 5 slots (3 required: name + vertical + location · 2 opcionales: brand.tone_default + offer[0]) + bonus NLU extraídos (team + values + differentiators + contact + offer_catalog_full) en ~10-20 minutos. Voz Adrián simulada REAL (no stub) desde primer setup via personality_service backend. Salida del wizard → app shell operación con tenant.is_onboarded=True.

