## KPIs (Slice 1 target)

- **Wizard completion rate**: target ≥95% of Owner first-login sessions reach `tenant.is_onboarded=True` within 20 minutes
- **Cost per session**: ≤$0.10 USD (LLM-token costs including extract + simulate + complete)
- **Cache hit rate**: ≥30% on iter 2+ within same wizard session (prompt cache 5-slot architecture, _CACHE_BREAKPOINT_INDEX=3)
- **PII safety**: 100% of `adversarial.yaml` golden scenarios sanitize PII pre-trace (sanitize_payload)
- **Voice fidelity**: Adrián grader ≥0.85 on `simulate_personality` samples (heredado sales_agent 12 personas evaluation)

