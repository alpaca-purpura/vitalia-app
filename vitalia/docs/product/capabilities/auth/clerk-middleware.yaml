# Clerk middleware — Vitalia FE

Protección de rutas mediante `clerkMiddleware` + `createRouteMatcher`. Default deny — todo route protegido excepto los explícitamente públicos.

## Surfaces

- **Config:** `vitalia/frontend/src/proxy.ts`
- **Backend:** n/a (FE only)
- **Frontend:** `vitalia/frontend/src/proxy.ts` ejecuta en edge runtime de Next.js 16
- **Tests:** `vitalia/frontend/src/__tests__/architecture/` (arch fitness ratchet)
- **Docs:** Story 01-spec.md SC-01, SC-02

## Rutas públicas (matcher)

- `/sign-in(.*)` — Clerk SignIn page
- `/sign-up(.*)` — Clerk SignUp page
- `/public(.*)` — Landing pública por clínica (futuro Slice 1)
- `/api/v1/vitalia/webhooks(.*)` — Webhooks BE (HMAC validation server-side)
- `/api/health` — Health check endpoint

## Comportamiento

- Sin sesión + ruta protegida → Clerk redirige a `/sign-in` (302/307)
- Con sesión + ruta protegida → pasa a handler
- Ruta pública → bypass middleware
- Matcher excluye `_next` y static assets (`/((?!_next|.*\\..*).*)`)

