# cuenta

Área **Cuenta del tenant** de la caja **Configuración** (zona Plataforma). Vista user-facing de uso poco
frecuente (admin) con los datos del propio tenant/clínica: identidad legal/fiscal, contacto,
especialidades (editables, D3-revoked), preferencias regionales y referencia al DPO.

## Arquitectura

- **BE** (`clinics/`): `account_router` (4 endpoints, prefix `/api/v1/clinics/account` — trailing slash
  obligatorio, `redirect_slashes=False`) → `ClinicAccountService` → `ClinicRepository` +
  `ClinicConfigRepository` (RMW de `tenant.config_json.clinic_config.primary_specialties` — engine-boundary,
  CERO columnas nuevas en engine). Unit-of-work atómico con `get_async_session_committing`
  (clinic fields + specialties + audit row commitean juntos — fix C9-1). Migración 039.
- **FE** (`features/config/`): N3-static `SubSubTabsBar` (Datos/Preferencias/Responsable) ·
  autosave 600ms (`use-autosave`) · `useAccountQuery` (GET client canónico) · camelize/decamelize
  boundary (BE Pydantic snake sin alias) · rol per-tenant via `useTenants()` (NO `/me` — drift engine).
- **Catálogos brand-local** (lift candidates): `fiscal_id_validator` + `specialty_catalog` (Tier 1-3 por país).

## Decisiones cardinales

- D1: sin billing (defer pricing) · D2: sin equipo/RBAC CRUD (caja Acceso) · D3-revoked: especialidades editables.
- Clinic = non-PHI (sin PhiRepositoryBase — rationale en 03-arch § Architecture Decisions, ADR-004 partial).
- RBAC alineado al canónico de la plataforma ({owner, admin_clinic}).

