    rule: "Solo el administrador de la clínica edita (roles owner/admin_clinic — set canónico ALLOWED_BRAND_OWNER_ROLES); otros roles ven read-only y reciben 403 al PATCH."
    enforcement: "service fail-closed _WRITE_ROLES"
    code_ref: "vitalia/backend/src/modules/vitalia/clinics/application/clinic_account_service.py (_WRITE_ROLES + patch_account)"
  - id: RN-2
    rule: "ID fiscal validado por país (AR CUIT/UY RUT con checksum mód-11; PE RUC/MX RFC/CL-CO NIT formato+longitud; país no soportado → texto libre degradado)."
    enforcement: "validator pre-persist → 422"
    code_ref: "vitalia/backend/src/modules/vitalia/_shared/validation/fiscal_id_validator.py"
  - id: RN-3
    rule: "País/idioma/tipo de clínica read-only post-alta. Especialidades EDITABLES (D3-revoked) validadas contra el catálogo del país."
    enforcement: "PatchRequest sin campos read-only + validate_specialties → 422"
    code_ref: "vitalia/backend/src/modules/vitalia/_shared/catalogs/specialty_catalog.py (validate_specialties)"
  - id: RN-4
    rule: "Todo write a datos del tenant escribe fila de auditoría SYNC pre-response, DURABLE (commit garantizado en el mismo unit-of-work atómico)."
    enforcement: "get_async_session_committing + caller-owned unit-of-work + integration test"
    code_ref: "vitalia/backend/src/modules/vitalia/clinics/api/account_router.py (_get_db) + tests/modules/vitalia/clinics/test_account_audit_durability.py"
  - id: RN-5
    rule: "Datos tenant-scoped; request cross-tenant → 404 sin leak."
    enforcement: "repo tenant-scoped en toda query"
    code_ref: "vitalia/backend/src/modules/vitalia/clinics/infrastructure/repositories/clinic_repository.py (get_active_for_tenant)"
  - id: RN-6
    rule: "Preferencias regionales sin hardcode: moneda/zona desde clinic.currency con fallback TenantLocale; selectores canónicos del ui-kit."
    enforcement: "FE canon + master-data rule"
    code_ref: "vitalia/frontend/src/features/config/components/cuenta/PreferencesView.tsx"

