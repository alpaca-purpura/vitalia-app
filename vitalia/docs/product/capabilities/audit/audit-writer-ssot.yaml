# Writer SSoT del audit log

Único punto de escritura del audit log de Vitalia (`audit_writer.py`). Toda mutación sobre datos sensibles pasa por este helper con redacción PHI y escritura sincrónica antes del retorno. Consumido por admin de tenants/usuarios/clínicas y el servicio de clínicas.
