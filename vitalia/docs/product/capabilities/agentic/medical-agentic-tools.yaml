## Dependencies

- `core/luana-core-sales-agent` (consumidor: orquesta tools en turnos conversacionales)
- `core/luana-core-llm` (LLM router para reasoning)
- `core/luana-core-extension-sdk` EP-3 (ToolDef registration)
- `vitalia.application.services.prepaid_payment_service` + `consent_service` + `booking_service` + `treatment_followup_service`

## Scenarios live

- Paciente pregunta "¿cuánto me queda del paquete?" → sales_agent invoca `prepaid_payment_check`
- Sales agent detecta que próximo procedimiento requiere consent → invoca `medical_consent_request`
- Paciente pide reagendar por WhatsApp → sales_agent invoca `appointment_reschedule_with_doctor`
- TreatmentFollowupWorkflow cron-driven invoca `treatment_followup_check(action=vitals)` weekly
- Todas las invocaciones registran trace en `copilot_trace_event` + cost en `copilot_llm_call`

