# vitalia-medical-agentic-tools

4 tools agentic registradas vía Extension SDK EP-3, consumidas por `core/luana-core-sales-agent` y por `TreatmentFollowupWorkflow`. Habilitan el bucle conversacional médico end-to-end: validar pago → solicitar consentimiento → reagendar → checkin follow-up.

## Surface (`vitalia/backend/src/modules/vitalia/agentic/tools/`)

- **`prepaid_payment_check.py`** — verifica balance/quota prepaid para próximo tratamiento. Inputs: `patient_id`, `treatment_id`. Outputs: `balance_remaining`, `sufficient`, `topup_recommended_amount`
- **`medical_consent_request.py`** — genera formulario de consentimiento + envía al paciente + registra firma. Inputs: `patient_id`, `procedure_id`. Outputs: `consent_record_id`, `signed`, `signed_at`
- **`appointment_reschedule_with_doctor.py`** — 4 acciones (search_slots, hold_slot, confirm_reschedule, notify_parties). Inputs: `booking_id`, `action`, `payload`
- **`treatment_followup_check.py`** — 7 acciones (status, vitals, adherence, side_effects, satisfaction, next_steps, escalation). Inputs: `treatment_id`, `action`, `payload`

### Prompts compose

- **`agentic/prompts/compose.py`** — helpers para composición de slot 4 MEDICAL_SAFETY_RAILS

### Config (`vitalia/config/brand.yaml`)

```yaml
agentic_tools:
  - prepaid_payment_check
  - treatment_followup_check
  - medical_consent_request
  - appointment_reschedule_with_doctor
```

