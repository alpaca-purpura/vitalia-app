- `core/luana-core-extension-sdk` EP-13 (GuardrailDef registration)
- `core/luana-core-events` (eventos de guard hits para observability)

## Scenarios live

- LLM intenta diagnóstico médico → bloqueado + safe fallback ("consulte con doctor")
- LLM intenta prescripción → bloqueado + redirect a consulta presencial
- LLM discute tratamiento sin disclaimer → output guard appendea disclaimer obligatorio
- Intento de prompt injection (jailbreak escenario 4) → bloqueado vía Story E sandbox markers
- Cada guard hit emite evento → registrado en trace + dashboard compliance

