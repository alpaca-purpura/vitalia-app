# vitalia-lucas-recommendation-tool

`compute_re_engagement_recommendation` — Lucas agentic tool (R23 `production_code=true` AGENTIC → **Opus 4.7 EXCLUSIVE**). Composite ReAct-like pipeline que agrega patrones de fidelización per clinic+stage y produce recomendaciones accionables (multi_session, follow_up, maintenance, absence, nps). Output aggregate-only — NUNCA PHI per-patient en respuesta.

Soporta Lucas Daily Analysis cron job + Lucas analysis state graph (LangGraph) — ver [[lucas-daily-analysis]] para orquestación pipeline completo. T-10 de Ola 1 fidelización.

## Surface

### Agentic tool (`vitalia/backend/src/modules/vitalia/agentic/lucas/tools/`)
- **`compute_re_engagement_recommendation.py`** — LangChain `@tool` async. Inputs (Pydantic args_schema): `tenant_id`, `clinic_id`, `period_start`, `period_end`. Outputs aggregate-only:
  ```json
  {
    "tenant_id": "<uuid>",
    "clinic_id": "<uuid>",
    "stage": "fidelizacion",
    "recommendations": [
      {"pattern": "multi_session|follow_up|maintenance|absence|nps", "priority": "high|medium|low", "action": "<accion espanol neutro>", "expected_impact_pct": 1-100, "rationale": "<por que>"}
    ]
  }
  ```

### Pipeline (3 steps, deterministic + 1 LLM call)
1. **Tenant boundary check** — `ctx_tenant_id == input.tenant_id` (defensive guard, RaiseTenantMismatchError).
2. **`LucasReEngagementService.run()`** (`application/services/lucas_re_engagement_service.py`):
   - `aggregate_patterns()` — DB query via `stage_recommendation_repository` (dual filter tenant + clinic).
   - `detect_clusters()` — Python deterministic (no LLM). Heurística por umbrales (ej: >40% pacientes con tratamiento incompleto → cluster multi_session).
   - `generate_recommendations()` — 1 LLM call (Kimi vía LiteLLM proxy) + `sanitize_payload` defense-in-depth post-LLM.
3. **Best-effort trace event emission** — NUNCA breaks tool turn (R23 resilience). Trace payload omits recommendation bodies (action/rationale); solo counts + period + clinic_id + status.

### Application service (`vitalia/backend/src/modules/vitalia/agentic/lucas/application/services/`)
- **`lucas_re_engagement_service.py`** — `LucasReEngagementService` (Opus 4.7 production code).
- **`lucas_stage_recommendation_service.py`** — sibling para stage attribution.

### Persistence (`vitalia/backend/src/modules/vitalia/agentic/lucas/infrastructure/repositories/`)
- `stage_recommendation_repository.py` — dual filter tenant + clinic.

### Prompt + workflow (`vitalia/backend/src/modules/vitalia/agentic/lucas/{prompts,workflows}/`)
- `prompts/` — Lucas slot architecture (heredada de [[lucas-daily-analysis]])
- `workflows/lucas_analysis_state.py` + `lucas_daily_analysis_graph.py` — LangGraph state + graph
- `workflows/lucas_prompt_compiler.py` — compila slots con cache prefix

