## Scenarios live

- Happy aggregate — clínica con 40% pacientes multi_session incompleto → tool detecta cluster + recomienda follow_up campaign con `expected_impact_pct: 35`.
- Adversarial cross-tenant — request con `tenant_A` + `clinic_id` de tenant_B → 404 (dual filter enforced at repo layer).
- Smoke eval: golden produce output schema válido + ningún PHI per-patient en payload.

## KPIs

- Tool execution latency p95: < 30s (1 LLM call + DB aggregates)
- Cost budget per-clinic daily: Opus 4.7 × cron job once/day = configurado en `vitalia/config/brand.yaml`
- Trace event success rate: 100% best-effort (failures NUNCA rompen turn)
- Recommendation accuracy (manual review sample): target ≥ 70% actionable

