## Dependencies

- ENGINE: `core/luana-core-extension-sdk.extension_points::ExtensionPointRegistry` (EP-8 channel providers)
- BRAND: `vitalia/backend/src/modules/vitalia/_shared/encryption/kek_client.py` (pgcrypto helpers)

## Compliance

- **HIPAA-lite:** OAuth tokens encrypted at rest via pgcrypto symmetric (KEK rotated annually). NO PHI in UTM payload. Audit log SYNC write on connect + sync trigger. Cross-tenant isolation enforced (CompoundScopeRepositoryBase dual filter).
- **Security:** OAuth state param verified anti-CSRF. Redirect URIs whitelisted per provider. No tokens in URLs or logs (sanitize_payload).
- **Resilience:** Soft-fail per tenant — one provider error ≠ all tenants fail. Circuit breaker bounded in-memory (single-pod adequate Slice 1; multi-pod Slice 2 follow-up — non-blocking WARN in audit).

## KPIs

- Sync latency ≤ 30s per tenant per provider (timeout enforced)
- Circuit breaker recovery ≤ 1h (cool-down)
- OAuth flow completion rate ≥ 90% (excluding user-aborted)
