# vitalia-connections-oauth-meta-google-ads

Meta Ads + Google Ads OAuth adapters with resilience patterns (timeout 30s + retry 3× exponential backoff + per-tenant circuit breaker). Registered via Extension SDK EP-8 (channel providers). OAuth tokens encrypted at rest via pgcrypto (KEK rotated annually).

## Surface

### Adapters
- `vitalia/backend/src/modules/vitalia/connections/meta_ads/adapter.py::MetaAdsAdapter`
  - `authorize_url()` → Facebook OAuth dialog URL with state param
  - `callback(code, state)` → exchanges code for `access_token` (long-lived)
  - `list_ad_accounts(token)` → ad accounts pickable post-auth
  - `fetch_insights(account_id, since, until)` → Marketing API v18.0
- `vitalia/backend/src/modules/vitalia/connections/google_ads/adapter.py::GoogleAdsAdapter`
  - Same interface using Google Ads REST API v13 + GAQL queries
  - `access_type=offline` for refresh_token

### Resilience
- Timeout 30s per HTTP call (httpx.AsyncClient)
- Exponential backoff retry 3× (0.5s, 1s, 2s)
- Per-tenant circuit breaker (in-memory dict + asyncio.Lock): threshold 5 consecutive failures → status='error' + 1h cool-down
- `CircuitBreakerOpenError` raised in Spanish neutro

### Persistence (migration 026)
- `vitalia_channel_sync_state.oauth_token_encrypted BYTEA` — pgcrypto symmetric encrypt via KEK
- KEK from `vitalia/backend/src/modules/vitalia/_shared/encryption/kek_client.py` (shipped infra story)

### Registration (Extension SDK EP-8)
- `vitalia/backend/src/modules/vitalia/extensions.py::register_all` adds:
  ```python
  registry.channel_adapter_register(ChannelAdapterDef(
      channel_slug="vitalia/meta_ads",
      adapter=MetaAdsAdapter(),
      ...
  ))
  registry.channel_adapter_register(ChannelAdapterDef(
      channel_slug="vitalia/google_ads",
      adapter=GoogleAdsAdapter(),
      ...
  ))
  ```

### Cron consumers
- `channel_metrics_sync_meta` (c/4h) calls `MetaAdsAdapter.fetch_insights` → upserts `vitalia_channel_metrics`
- `channel_metrics_sync_google` (c/4h) idem for Google Ads

### API
- `POST /api/v1/vitalia/marketing/channels/{provider}/connect` — start OAuth flow
- `POST /api/v1/vitalia/marketing/channels/{provider}/sync` — manual sync trigger (Idempotency-Key required)
- `GET /api/v1/vitalia/marketing/channels/{provider}` — channel detail + sync status

### FE Components
- `ChannelConnectionWizard.tsx` — 3 pasos: selector canal → OAuth redirect full-page → confirm test sync
- `ChannelDetailSidebar.tsx` — KPIs principales + campañas top 3 + Lucas recommendations canal-specific + cross-link external Ads Manager `target=_blank`
- `ConnectionBadge.tsx` — 4 estados (idle/running/error/disconnected) con tokens vt-text-success/warning/danger
- `ChannelBreakdownRow.tsx` — row per provider in AttractionStage

### Hooks
- `useChannelDetail` · `useSyncChannel`

