## Idempotency invariants

✅ Toda migration usa raw SQL `CREATE TABLE IF NOT EXISTS` / `ALTER TABLE ADD COLUMN IF NOT EXISTS`
✅ pgcrypto access via raw SQL (no SA-level encryption)
✅ NO `op.create_table()` (verified arch test PASS)
✅ NO `sa.Enum(create_type=True)` (SA 2.0.27 known bug — use raw SQL instead)
✅ Apply twice idempotent (verified manually + tests)

## HIPAA-lite enforcement

- audit_log PARTITION BY RANGE monthly facilita retention 10y compliance + cleanup eficiente per mes
- payload_redacted BYTEA en audit_log permite encrypted storage de payload sanitized (no plain PHI)
- treatment_plans.notes BYTEA pgcrypto encryption-at-rest mandatory para `medical_notes` HIPAA-lite PHI field
- channel_sync_state.oauth_token_encrypted BYTEA evita oauth tokens plain en DB (encrypt via KEK at write time)

## Promotion candidate (cross-brand)

Status: NO — schema brand-specific. Pero patterns son cross-brand reusable:
- `vitalia_audit_log` PARTITION BY RANGE pattern aplica a otras brands healthcare (fitflow, guestly regulated).
- Si segunda brand opta-in HIPAA-lite stack → lift schema pattern (no contenido tables) via engine migration generator.

