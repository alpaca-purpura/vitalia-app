# vitalia-migrations-slice-1-schema

15 Alembic migrations idempotentes (002-016) que establecen el schema foundation Slice 1: 12 nuevas tablas + 4 column additions + pgcrypto BYTEA columns + vitalia_audit_log PARTITIONED BY RANGE monthly.

## Surface

### Migration files (`vitalia/backend/alembic/versions/`)

15 migrations cubrieron (orden cronológico):
- **002** appointments table (booking + slot + clinic_id dual filter)
- **003** payments table (capture + payment_method dispatch via PAYMENT_PROVIDER_REGISTRY)
- **004** fiscal_emissions table (gated `vitalia-fiscal-emission-pe` story future)
- **005** treatment_plans table (PHI — pgcrypto BYTEA notes column)
- **006** re_engagement_events table (PHI — pgcrypto BYTEA payload_phi column)
- **007** channel_sync_state table (oauth_token_encrypted BYTEA + tenant_id + clinic_id)
- **008** brand_studio_metrics table (analytics support)
- **009** lucas_recommendations table (copilot agent suggestions for clinics)
- **010** referrals table (NPS-derived patient referrals)
- **011** onboarding_progress table (wizard state machine)
- **012** brand_studio_audit table (compliance audit)
- **013** vitalia_audit_log table — **PARTITIONED BY RANGE monthly 2026-04 .. 2026-08** + `payload_redacted BYTEA` + NO `deleted_at` (immutable per 10-year HIPAA-lite retention)
- **014** tenants table column additions (location_country, location_state, location_city — via promotion proposal `2026-05-17-platform-tenants-location-columns.md`)
- **015** offer adherence + maintenance_schedule_enum (via promotion proposal `2026-05-17-offer-studio-multi-session-maintenance.md`)
- **016** marketing_consent table additions (patients.marketing_consent_at, marketing_opt_out_at, marketing_consent_source)

### Tables introduced (12 NEW)
appointments, payments, fiscal_emissions, treatment_plans, re_engagement_events, channel_sync_state, brand_studio_metrics, lucas_recommendations, referrals, onboarding_progress, brand_studio_audit, vitalia_audit_log

### Column additions (4)
- `tenants`: location_country, location_state, location_city (engine schema extension via promotion proposal)
- `patients`: marketing_consent_at, marketing_opt_out_at, marketing_consent_source
- `offers`: adherence + maintenance_schedule_enum (engine schema extension via promotion proposal)

### pgcrypto BYTEA encryption-at-rest columns (3)
- `treatment_plans.notes`
- `re_engagement_events.payload_phi`
- `channel_sync_state.oauth_token_encrypted`

