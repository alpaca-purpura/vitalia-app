# vitalia-topbar-global

Top bar thin 48px persistente cross-route con brand LogoMark izq + ThemeToggle (F1-S1 reuse) + TenantSwitcherSlot placeholder (F1-S3 drop-in). Skip link a11y + main#main-content landmark + axe WCAG 2.1 AA. CSS-based dark mode swap dual `<Image>` (SSR-safe zero JS). Mobile responsive @media <768px switch a variant="mark" (libélula sola).

## Surface

### Components (`vitalia/frontend/src/components/shared/shell-organism/`)

- `LogoMark.tsx` — átomo Server Component, 6 combinations 3 sizes (sm/md/lg = 24/32/40px) × 2 variants (full/mark). Dark mode via dual `<Image>` con `block dark:hidden` / `hidden dark:block` — no JS, no FOUC.
- `LogoMark.test.tsx` — 9 Vitest tests (cover all 6 combinations + a11y aria-label + Image lazy/priority).
- `TenantSwitcherSlot.tsx` — placeholder returns null. Props declared for F1-S3 forward-compat.
- `TenantSwitcherSlot.test.tsx` — 3 tests (renders null, no console errors, forward-compat props).
- `TopBarGlobal.tsx` — organismo Server Component. `<header role="banner" h-12 border-b bg-background>` compose 2 LogoMark instances (full hidden below md, mark visible below md responsive) + ThemeToggle + TenantSwitcherSlot.
- `TopBarGlobal.test.tsx` — 6 tests (banner role + composition + responsive classes + data-testid).

### Layout integration (`vitalia/frontend/src/app/layout.tsx`)

- MODIFY agrega skip-link visual sr-only/focus + `<main id="main-content">` landmark.

