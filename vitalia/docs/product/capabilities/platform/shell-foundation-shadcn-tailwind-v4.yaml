### Arch fitness test (`vitalia/frontend/src/__tests__/architecture/`)

- `test-no-vt-classes-in-new-features.test.ts` (NEW) — recursive scan `SHELL_PATHS = ['src/app/[tenantId]/(shell-organism)', 'src/components/shared/shell-organism']` con `VT_PATTERN = /\bvt-[a-z]/`. Initial GREEN by emptiness (paths no existen aún — F1-S4 los crea). Ratchet shrink-only: cuando F1-S1+ poblean shell-organism, test sigue GREEN porque builders NO usan `.vt-*`.

### ADR (`vitalia/docs/architecture/`)

- `ADR-vitalia-002-vt-deprecation-plan.md` (NEW, 273 LOC, 8 secciones obligatorias) — contexto + inventario `.vt-*` + estrategia compatibility temporal + migration policy progresiva + final drop story (Fase 2 final) + arch fitness test enforcement + post-install audit checklist supply-chain (diff review 8 primitives vs ui.shadcn.com/r/) + riesgos+mitigaciones.

