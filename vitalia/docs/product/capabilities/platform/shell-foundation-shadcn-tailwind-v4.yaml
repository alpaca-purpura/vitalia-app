# vitalia-shell-foundation-shadcn-tailwind-v4

Fundación técnica del shell-organism agéntico — Tailwind v4 + Shadcn UI vendored + 8 primitivos base + 7 agent tokens (Lisa/Lucas/Adrián/Valeria/Camila/Mateo/Config) + ADR plan deprecación `.vt-*` progresiva. Blocker hard que desbloquea Fase 1 + Fase 2 completas (`vitalia-fase1-{design-tokens-theme,topbar-global,tenant-switcher,shell-layout-5050,...}` + Fase 2 ×22 stories).

## Surface

### Tailwind v4 + PostCSS infra (`vitalia/frontend/`)

- `postcss.config.mjs` (NEW) — invoca `@tailwindcss/postcss` plugin para procesar directives Tailwind v4. Sin este archivo el `@tailwind base/components/utilities` syntax legacy se servía literal al browser sin generar utilities.
- `src/app/globals.css` (MODIFIED) — migrado a Tailwind v4 syntax: `@import "tailwindcss"` + `@config "../../tailwind.config.ts"`. Preserva bloque `:root` + `.dark` con CSS vars Shadcn standard + 7 agent tokens HSL. Bloque `.vt-*` legacy intacto para compatibility temporal per ADR-vitalia-002 § 3.
- `tailwind.config.ts` (already existed, sin cambios F1-S0) — extends theme.extend.colors con agent palette consumida via `hsl(var(--agent-{slug}))`. F1-S0 valida que el @config directive permite Tailwind v4 leer config legacy.
- `package.json` — added `@tailwindcss/postcss` devDep.

### 8 Shadcn primitivos vendored (`vitalia/frontend/src/components/ui/`)

Copy-paste vendored desde `npx shadcn@latest add` (NO npm package consumption). Cada primitivo es editable in-place:

- `button.tsx` — 6 variants (default/destructive/outline/secondary/ghost/link) × 4 sizes (default/sm/lg/icon). **Fix F1-S0**: agregado `cursor-pointer` base + `disabled:cursor-not-allowed` + defensive `hover:text-{*}-foreground` para evitar white-on-gray contrast bug.
- `avatar.tsx` — Radix Avatar.{Root,Image,Fallback} wrapper con size class.
- `dropdown-menu.tsx` — Radix DropdownMenu.* full set (Root, Trigger, Content, Item, Label, Separator, Group, Sub, Portal). **Fix F1-S0**: agregado `hover:bg-accent hover:text-accent-foreground` (antes solo `focus:`), destructive variant `hover:bg-destructive/10 hover:text-destructive`, `cursor-pointer` + `disabled:cursor-not-allowed`.
- `input.tsx` — single-line text input con focus-visible ring.
- `badge.tsx` — 4 variants (default/secondary/destructive/outline) con anchor-only hover (`[a&]:hover:`).
- `textarea.tsx` — multi-line autoresize textarea.
- `tabs.tsx` — Radix Tabs.{Root,List,Trigger,Content}. **Fix F1-S0**: agregado `cursor-pointer` + `hover:text-foreground` defensive + `disabled:cursor-not-allowed`.
- `tooltip.tsx` — Radix Tooltip.{Provider,Root,Trigger,Content} con primary bg + white text + Arrow.

`components.json` config: `style=new-york`, `baseColor=slate`, `cssVariables=true`, `tailwindConfig=existing`, `importAlias=@/`.

### 7 Agent tokens (`vitalia/frontend/src/app/globals.css`)

`:root` block extiende Shadcn standard con 7 tokens HSL format (sin función `hsl()`, consumido via `hsl(var(--agent-{slug}))`):

| Token | HSL | Hex | Agent | Rol |
|---|---|---|---|---|
| `--agent-lisa` | `156 100% 41%` | #00D084 | Lisa | Estratega marca + offer ladder |
| `--agent-lucas` | `0 0% 7%` | #111111 | Lucas | Setter growth viral |
| `--agent-adrian` | `198 99% 49%` | #01b2f8 | Adrián | Closer integral leads+reactivación |
| `--agent-valeria` | `287 53% 37%` | #7b2d91 | Valeria | Coordinadora general día-a-día |
| `--agent-camila` | `244 84% 32%` | #180d95 | Camila | Post-venta CLTV+engagement |
| `--agent-mateo` | `53 99% 51%` | #fee209 | Mateo | Especialista tech+diseño IA |
| `--agent-config` | `240 4% 46%` | gris | Config | Configuración (no agente identidad) |

`.dark` block contiene 5 soft variants (lisa-soft, lucas-soft, adrian-soft, valeria-soft, camila-soft) — placeholders hasta F1-S1 introduce theme toggle real.

### Agent SSoT TypeScript (`vitalia/frontend/src/lib/agents.ts`)

`AgentMeta` type + `AGENTS` Record con 6 entries (Lisa, Valeria, Adrián, Lucas, Camila, Mateo) y `AGENT_LIST` ordered (Valeria primero — agente principal). Cada entry: `slug`, `name`, `role`, `colorHex`, `thumbnail` path, `transparent` path.

Consumido por:
- `/test-stack/primitives` (F1-S0 showcase)
- F1-S1+ TopBar / ValeriaRail / Ribbon agent tabs
- Brand Studio voice presets (futuro)
- Sales agent specialist routing (futuro)

### Agent imagery (`vitalia/frontend/public/agents/{slug}/`)

6 subdirectorios con 2 archivos cada uno:
- `thumbnail.png` — retrato cuadrado 500x500 (avatars, ribbon tabs)
- `transparent.{png,jpeg}` — body completo transparent background (hero usage, larger viewport)

Imágenes canónicas copiadas desde `/home/chalreme/Trabajo/Vitalia/agentes/{Lisa-Estratega,Valeria-Ejecutiva,Adrian-Closer,Lucas-Setter,Camila-Fidelizacion,Mateo-Desarrollador}/` (Chris SSoT 2026-05-22).

### Test pages preview (`vitalia/frontend/src/app/test-stack/`)

Rutas Next.js dev-only para visual baseline + iteración manual:
- `/test-stack/primitives` — renderiza 8 primitivos × todas variantes con datos LatAm realistas (clínica AR + OSDE/IOMA/Swiss Medical badges)
- `/test-stack/agent-tokens` — renderiza 7 swatches color base + soft variant con labels HSL + 8 surface tokens (background, primary, accent, muted, card, destructive, secondary, ring)

Ambas marcadas public en `proxy.ts` (no Clerk auth gating — sin datos sensibles).

### Playwright visual project (`vitalia/frontend/playwright.config.ts`)

`@project=visual` block agregado:
- Viewport 1440×900
- `maxDiffPixelRatio: 0.001` (0.1% tolerance per Design Contract § 9.4)
- `animations: 'disabled'` + `caret: 'hide'` para determinismo
- `storageState: 'playwright/.clerk/user.json'` + `dependencies: ['setup']` — dashboard goldens necesitan Clerk auth real

