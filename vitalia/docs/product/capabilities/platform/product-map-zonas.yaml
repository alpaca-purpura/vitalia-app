business_rules:
  - id: halt-no-silent
    rule: >
      La migración NUNCA asigna una caja por defecto a una cap sin mapeo.
      Si una cap no puede ser mapeada → exit 1 + lista explícita.
    enforcement:
      - "vitalia/docs/product/stories/vitalia-paradigm-map-zones/03-arch.md § 2.1"
    code_ref: "scripts/map_zones_migration.py"
    severity: critical
    audit_trail: false
  - id: zone-derivation
    rule: >
      La zona (Agentes/Plataforma/Infraestructura) se DERIVA del map_box vía
      SYSTEM-MAP.yaml zones[].boxes — NUNCA se escribe por cap.
      user_visible se alinea automáticamente (Infra → false, resto → true).
    enforcement:
      - "vitalia/docs/architecture/ADR-vitalia-005-capability-model-4-dimensions.md"
    code_ref: "scripts/map_zones_migration.py"
    severity: high
    audit_trail: false
  - id: idempotent-migration
    rule: >
      Re-ejecutar el script de migración en cualquier estado debe ser un no-op
      si los caps ya tienen los valores correctos. Re-run = cero diffs.
    enforcement:
      - "scripts/tests/test_map_zones_migration.py::test_rerun_is_noop"
    code_ref: "scripts/map_zones_migration.py"
    severity: high
    audit_trail: false

