# Mapa de zonas del producto — Vitalia

Taxonomía cementada 2026-05-30 (ADR-vitalia-005 v2). Define las 3 zonas y 12 cajas
que organizan todas las capabilities del producto.

## Zonas y cajas

| Zona | Cajas | user_visible |
|---|---|---|
| **Agentes** | lisa · mateo · adrian · lucas · camila | true |
| **Plataforma** | acceso · onboarding · configuracion | true |
| **Infraestructura** | seguridad-cumplimiento · observabilidad · plataforma-tecnica · motor-agentico | false |

## Scripts

- `scripts/map_zones_migration.py` — Re-tag idempotente de caps con map_box
- `scripts/generate_actions_index.py` — Generador del índice de acciones (SC-7)
- `scripts/validate_system_map.py` — Validador SYSTEM-MAP map_box-aware

## SSoT

- `vitalia/docs/architecture/SYSTEM-MAP.yaml` — zones[].target_boxes[].absorbs
- `vitalia/docs/architecture/ADR-vitalia-005-capability-model-4-dimensions.md` — v2.0
- `vitalia/docs/product/stories/vitalia-paradigm-map-zones/02-impact.md` — mapeo verbatim
