# vitalia-nps-tracking

NPS (Net Promoter Score) tracking post-tratamiento — submit individual respuestas paciente + summary aggregate por tenant+clinic+periodo. PHI-aware: comment text libre paciente cifrado en DB via `pgcrypto` (★ post iter 2 F2 audit fix). Dual filter tenant+clinic obligatorio. Audit log sync write en cada submit.

Foundation Ola 1 fidelización — alimenta Lucas analysis (ver [[lucas-recommendation-tool]] pattern `nps`) + Adrián reengagement decisions ([[adrian-reengagement-tool]]).

## Surface

### Domain entity (`vitalia/backend/src/modules/vitalia/fidelizacion/domain/entities/`)
- **`nps_response.py`** — `NPSResponse` entity. Fields: `id`, `tenant_id`, `clinic_id`, `patient_id`, `score` (0-10), `band` (detractor|passive|promoter), `comment` (PHI cifrado BYTEA), `submitted_at`, `treatment_plan_id` (FK opcional).

### Value object (`vitalia/backend/src/modules/vitalia/fidelizacion/domain/value_objects/nps_band.py`)
- **`NPSBand`** Enum: `detractor` (0-6), `passive` (7-8), `promoter` (9-10). Derivation pure function.

### Application service (`vitalia/backend/src/modules/vitalia/fidelizacion/application/services/`)
- **`nps_service.py`** — `NPSService`:
  - `submit(tenant_id, clinic_id, patient_id, score, comment, treatment_plan_id?)` — almacena respuesta (comment cifrado por trigger pgcrypto) + audit row sync + emite `NPSResponseSubmitted` outbox event.
  - `summary(tenant_id, clinic_id, period_start, period_end)` — agregados (avg score, distribution by band, total responses) — SIN PHI per-patient.
  - Dual filter tenant + clinic enforced en TODAS las queries.

### Application DTOs (`application/dtos/nps_dtos.py`)
- `NPSResponseRequest`, `NPSResponseResponse` (response NO incluye `comment` raw — sanitize), `NPSSummaryResponse`.

### Infrastructure persistence (`vitalia/backend/src/modules/vitalia/fidelizacion/infrastructure/`)
- **`models/nps_response_model.py`** — SQLAlchemy model. Column `comment` typed BYTEA (encrypted).
- **`repositories/nps_response_repository.py`** — `NPSResponseRepository` con dual filter tenant + clinic. Reads usan `pgp_sym_decrypt(comment, current_setting('app.encryption_key'))` cuando role autorizado.

### API routes (`api/nps_endpoints.py`)
- `POST /api/v1/fidelizacion/nps` — submit (paciente o sistema post-tratamiento).
- `GET /api/v1/fidelizacion/nps/summary` — read-only summary aggregate.

Todos endpoints:
- `response_model=` mandatory.
- Dual filter tenant + clinic enforced.
- `@require_phi_access(roles=["doctor","nurse","admin_clinic"])` para reads que incluyan `comment` decrypted.

### Migration ★ POST ITER 2 F2 FIX ★
- **`vitalia/backend/alembic/versions/025_vitalia_pgcrypto_nps_comment.py`** — idempotent:
  - Adds `pgcrypto` extension `IF NOT EXISTS`.
  - Trigger `trg_encrypt_nps_comment` BEFORE INSERT/UPDATE encrypta `comment` plaintext → BYTEA via `pgp_sym_encrypt()` con `current_setting('app.encryption_key')` GUC.
  - Arch test allowlist closed in `tests/architecture/test_pgcrypto_phi_columns.py`.

