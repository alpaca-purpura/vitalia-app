Per auditor-backend WARNs (non-blocking):
1. `generate_admin_password_hash.sh` env-var refactor (replace shell interpolation)
2. envFrom least-privilege secrets refactor (admin pod scope only)
3. Streamlit XSRF + nginx proxy headers gap

