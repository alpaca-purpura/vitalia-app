# Live Reconciliation Sweep — ops

Suite Playwright de diagnostico cross-surfaces. Produce `vitalia/docs/domains/ops/live-reconciliation.md` (matriz viva cap por cap).

## Surfaces

- **E2E spec:** `vitalia/frontend/e2e/regression/live-reconciliation/sweep.spec.ts`
- **Catalogo superficies:** `vitalia/frontend/e2e/regression/live-reconciliation/surface-catalog.ts`
- **Matriz output:** `vitalia/docs/domains/ops/live-reconciliation.md`
- **Evidencia screenshots:** `vitalia/frontend/e2e/regression/live-reconciliation/.evidence/`

## Ejecucion

```bash
cd vitalia/frontend
E2E_BASE_URL=http://localhost:3002 npx playwright test e2e/regression/live-reconciliation/ --reporter=line
```

## Promotable

Patron candidato a lift cross-brand cuando comunify o lupulo necesiten reconciliar su propio ledger post mass-merge.
