## Live verification (DoD #37)
Ejercida por Chris en dev-app vitalia (tenant Sanaré · dr.demo@vitalialat.com): crear servicio (POST 201) · autosave nombre+campo rico (PATCH 200, persiste) · activar (POST 200, products.status=active, growth_studio_event) · plan de pago 3-cobros · especialistas con nombre · FAQ par completo. Evidencia: `checkpoint.md § dod_evidence` + `.live-verify/`.

## Decisiones cardinales
- Servicio = `Offer` del engine (NO modelo nuevo) · peldaño = `OfferValueLevel` · consume EP-2.
- Plan de pago = 3 cobros distintos (RN-6), NO mezclar reserva/anticipo/financiamiento.
- Autosave: value SIEMPRE de RHF local (ADR-vitalia-009) — el binding al server congela el ciclo.
- BE serializa Decimal money como string JSON (precisión) → el FE parsea en el borde wire→form.

## Anti-objetivos cementados
- NO tocar `core/luana-core-offer-studio` (lift vía /pm-luana).
- RAG runtime (indexer Qdrant + tool retrieval) = Sub-phase B, engine-lift /pm-luana (STOP-2).
- A/B pricing · imports bulk · AI suggested-pricing · landing pública · analítica Stats = otras stories.

