# Catálogo de servicios de Lisa (`offer.lisa-servicios`)

Sub-tab **Servicios** del agente Lisa. Es la **keystone del catálogo**: desbloquea
canal-inbound, propuestas (Adrián) y landing pública. Construida sobre **Offer Studio
engine** (`core/luana-core-offer-studio`) vía Extension SDK EP-2 — los servicios son
`Offer`s y el peldaño es `OfferValueLevel`; **cero edit del engine**.

Dos vistas (toggle): **Catálogo** (grid de cards) y **Escalera de valor** (peldaños
fijos: lead-magnet / tripwire / core / profit-max / return-path). Cada servicio abre un
**workspace de 5 leaves**: Resumen · Para Adrián (argumentario) · Especialistas · Plan
de pago · Prueba social. Todo autoguarda (sin botón "Guardar"). Un panel transversal
"Fuentes & conocimiento" permite autocompletar campos desde documentos.

## Surface

### Backend
- `vitalia/backend/src/modules/vitalia/offer/` — domain (pricing_calc, completeness, vos) · application (catalog/biblioteca/link/proof/sales_brief services) · infrastructure (repos dual-tenant) · api (servicios_router)
- Consume engine vía `luana_core_platform.links.ports.offer` (port) + `TenantKnowledgeBuilder` (keystone, consume-only)

### Frontend
- `vitalia/frontend/src/features/lisa/components/servicios/` — LisaServiciosView, CatalogoView, EscaleraView, ServicioWorkspaceShell + leaves/{ResumenView, ParaAdrianView, EspecialistasView, PlanPagoView, PruebaSocialView}
- Route group `(shell-organism)/lisa/servicios/[offer-id]/[leaf]`

