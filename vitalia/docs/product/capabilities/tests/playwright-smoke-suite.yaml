# Playwright smoke suite — vitalia

Suite Playwright cubriendo auth + dashboard + admin + a11y + mobile + visual baseline + audit script. Ejecutable LOCAL (T-6.a) y LIVE contra `dev-app.vitalialat.com` (T-6.b).

## Surfaces

- **E2E specs:**
  - `vitalia/frontend/e2e/auth/sign-in-redirect.spec.ts` (SC-01, SC-02)
  - `vitalia/frontend/e2e/auth/sign-in-form.spec.ts` (SC-03, SC-04)
  - `vitalia/frontend/e2e/dashboard/welcome.spec.ts` (SC-06, SC-07)
  - `vitalia/frontend/e2e/admin/tenants-users.spec.ts` (SC-08, SC-09)
  - `vitalia/frontend/e2e/a11y/a11y-smoke.spec.ts` (SC-14)
  - `vitalia/frontend/e2e/mobile/mobile-smoke.spec.ts` (SC-15)
  - `vitalia/frontend/e2e/visual/visual-smoke.spec.ts` (SC-16, screenshot baselines en `e2e/visual/screenshots/`)
- **Config:** `vitalia/frontend/playwright.config.ts` (projects: smoke, mobile=iPhone 13)
- **Deps:** `vitalia/frontend/package.json` (`@axe-core/playwright` agregado T-6.b)
- **Audit script:** `scripts/playwright_console_network_audit.sh` (platform-shared, post-run trace audit)

## Modos de ejecución

### Local (gate pre-deploy)
```bash
WS=$(git rev-parse --show-toplevel)
bash $WS/scripts/e2e-preflight.sh
cd $WS/vitalia/frontend && \
  E2E_BASE_URL=http://localhost:3002 \
  CLERK_TESTING_TOKEN=$CLERK_TESTING_TOKEN_VITALIA \
  npx playwright test --project=smoke --grep "vitalia-auth-base-functional"
```

### LIVE (post-deploy by /pm-vitalia)
```bash
cd $WS/vitalia/frontend && \
  E2E_BASE_URL=https://dev-app.vitalialat.com \
  CLERK_TESTING_TOKEN=$CLERK_TESTING_TOKEN_VITALIA \
  VITALIA_ADMIN_PASSWORD=$VITALIA_ADMIN_PASSWORD \
  npx playwright test --project=smoke --grep "vitalia-auth-base-functional" --reporter=list
cd $WS/vitalia/frontend && npx playwright test e2e/a11y/ e2e/mobile/ e2e/visual/ --reporter=list
bash $WS/scripts/playwright_console_network_audit.sh $WS/vitalia/frontend/playwright-report/
```

## Comportamiento

- Suite umbrella: 18 scenarios SC-01..SC-18 cubriendo auth + dashboard + admin Streamlit + a11y axe critical+serious + mobile iPhone 13 viewport + visual screenshot baseline + broader console/network monitor + K8s healthcheck
- Visual thresholds (per self-fix iter-1): 0.05 auth pages (stables), 0.1 dashboard (dynamic content)
- A11y iframe exclusion narrowed to Clerk-specific selector (no global iframe ignore)
- Audit script regex tightened + allowlist Clerk dev mode warnings

