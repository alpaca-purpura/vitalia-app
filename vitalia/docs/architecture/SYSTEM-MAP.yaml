# ────────────────────────────────────────────────────────────────────────────
# CROSS-AGENT FLOWS (5 flujos cementados · expandir cuando descubrás más)
# ────────────────────────────────────────────────────────────────────────────
#
# Cada flow describe una secuencia donde un agente dispara acción en otro.
# Schema:
#   id: kebab-slug único
#   trigger:
#     agent: <agent_id>
#     area: <functional_area_id sin prefijo>
#     condition: descripción humana
#   actions:
#     - agent: <agent_id>
#       area: <functional_area_id>
#       what: descripción humana
#   mechanism: domain_event | api_call | webhook | shared_db
#   status: live | planned

cross_agent_flows:
  - id: nps-bajo-trigger-reactivacion
    trigger:
      agent: camila
      area: reputacion
      condition: "NPS del paciente < 6 (detractor)"
    actions:
      - agent: adrian
        area: reactivacion
        what: "Adrián crea task de seguimiento + intenta reactivar al paciente con propuesta personalizada o derivación a humano."
    mechanism: domain_event
    event_name: "PatientDissatisfied"
    status: planned
    target_release: F3

  - id: lead-calificado-trigger-agenda
    trigger:
      agent: adrian
      area: embudo
      condition: "Lead acepta presupuesto y confirma intención de booking"
    actions:
      - agent: mateo
        area: bookings
        what: "Mateo (Operar) crea booking prepagado con advisory lock + envía link de pago al paciente. Confirm callback enciende slot."
    mechanism: api_call
    endpoint: "POST /api/v1/bookings"
    status: live

  - id: tratamiento-terminado-trigger-followup
    trigger:
      agent: mateo
      area: agenda
      condition: "Turno marcado completed + tratamiento marca último-paso"
    actions:
      - agent: camila
        area: reactivar
        what: "Camila inicia workflow followup: día 1 check-in, día 7 evolución, día 30 NPS, día 90 control."
    mechanism: domain_event
    event_name: "TreatmentCompleted"
    status: live

  - id: nps-promotor-trigger-referidos
    trigger:
      agent: camila
      area: reputacion
      condition: "NPS del paciente ≥ 9 (promotor)"
    actions:
      - agent: lucas
        area: referrals
        what: "Lucas suma al paciente al leaderboard de referidos + envía oferta de referidos personalizada."
    mechanism: domain_event
    event_name: "PatientPromoter"
    status: live

  - id: campaign-launch-trigger-tracking
    trigger:
      agent: lucas
      area: lanzar
      condition: "Lucas lanza campaña Meta Ads + Google Ads"
    actions:
      - agent: lucas
        area: atribucion
        what: "Atribución empieza tracking de touchpoints de la nueva campaña automaticamente. Cada lead nuevo en CRM se asocia a la campaña activa."
      - agent: adrian
        area: crm
        what: "Adrián etiqueta cada lead nuevo con la campaña de origen para tracking de conversion."
    mechanism: shared_db
    table: "marketing_campaigns + leads.source_campaign_id"
    status: planned
    target_release: F3

# ────────────────────────────────────────────────────────────────────────────
# DATA OWNERSHIP MAP — entidades cross-modulo
# ────────────────────────────────────────────────────────────────────────────
#
# Schema:
#   <entity_name>:
#     owner_module: <path canónico DDD>
#     owner_agent: <agent que la conceptualmente posee>
#     consumed_by: [agent_id, ...]
#     phi: true | false
#     description: 1 línea

data_ownership:
  Patient:
    owner_module: crm
    owner_agent: adrian
    consumed_by: [adrian, mateo, camila, lucas]
    phi: true
    description: "Paciente con dual filter tenant+clinic. Adrián la posee (CRM); Mateo la consume (agenda); Camila (followup); Lucas (atribución anonymous)."

  Lead:
    owner_module: crm
    owner_agent: adrian
    consumed_by: [adrian, lucas]
    phi: false
    description: "Lead non-PHI single tenant. Adrián la posee (CRM); Lucas la consume (atribución)."

  Conversation:
    owner_module: crm
    owner_agent: adrian
    consumed_by: [adrian, mateo]
    phi: true
    description: "Hilo de chat patient/lead↔agent. Adrián la posee (inbox); Mateo la consume (notificaciones turno)."

  Appointment:
    owner_module: scheduling
    owner_agent: mateo
    consumed_by: [mateo, adrian, camila]
    phi: true
    description: "Turno con doctor. Mateo (Operar) la posee (agenda); Adrián (al cerrar venta); Camila (al terminar tratamiento dispara followup)."

  Booking:
    owner_module: booking
    owner_agent: mateo
    consumed_by: [mateo, adrian]
    phi: true
    description: "Reserva prepagada con advisory lock. Mateo (Operar) la posee; Adrián la dispara cuando lead confirma."

  Clinic:
    owner_module: clinics
    owner_agent: configuracion
    consumed_by: [lisa, mateo, adrian, lucas, camila]
    phi: false
    description: "Clínica (multi-tenant). Caja configuracion (zona plataforma) la posee; todos los agentes especialistas la consumen para scope/filtros."

  Treatment:
    owner_module: treatments
    owner_agent: camila
    consumed_by: [mateo, camila, adrian]
    phi: true
    description: "Tratamiento con paso-by-paso. Camila la posee (followup); Mateo (agenda turnos); Adrián (presupuesto)."

  Brand:
    owner_module: brand_studio
    owner_agent: lisa
    consumed_by: [lisa, mateo, adrian, lucas, camila]
    phi: false
    description: "Identidad de la marca. Lisa la posee; todos los demás agentes consumen voice + values."

  Offer:
    owner_module: offer_studio
    owner_agent: lisa
    consumed_by: [lisa, adrian, lucas, mateo]
    phi: false
    description: "Catálogo de servicios médicos. Lisa la posee; Adrián la cita en propuestas; Lucas en campañas; Mateo en booking widget."

  NPSResponse:
    owner_module: patients
    owner_agent: camila
    consumed_by: [camila, lucas, adrian]
    phi: true
    description: "Respuesta NPS del paciente. Camila la posee; Lucas la consume (segmento promotores); Adrián (alerta detractores)."

  AuditLog:
    owner_module: compliance
    owner_agent: seguridad-cumplimiento
    consumed_by: [seguridad-cumplimiento, observabilidad]
    phi: false
    description: "Audit log inmutable de todo acceso a PHI. Caja seguridad-cumplimiento (zona infraestructura) la posee; observabilidad la consume."

